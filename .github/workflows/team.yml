                  else:
                      print("dropping malformed conflicts entry:", centry)

          pytest_exit = manifest.get("pytest_exit", 1)
          overall = "pass" if all(v["verdict"] == "pass" for v in verdicts.values()) and pytest_exit == 0 else "fail"
          failed = [pid for pid, v in verdicts.items() if v["verdict"] != "pass"]
          failing_tests = []
          unattributed_failure = bool(overall == "fail" and not failed)
          verdict = {"overall": overall, "pytest_exit": pytest_exit,
                     "iteration": manifest.get("iteration", 1),
                     "processes": [verdicts[p["id"]] for p in plan["processes"]],
                     "conflicts": conflicts,
                     "failing_tests": failing_tests,
                     "unattributed_failure": unattributed_failure}
          json.dump(verdict, open("verdict.json", "w"), ensure_ascii=False, indent=2)

          lines = []
          if os.path.exists("work/verdict-droid.md"):
              lines.append(open("work/verdict-droid.md").read())
          lines += ["", "## 机器闸与缺料判定（脚本）", "",
                    f"全量 pytest 退出码：{pytest_exit}（非 0 时 overall 强制 fail）"]
          for pid, missing in blocked.items():
              lines.append(f"- `{pid}`：blocked — 料不齐，缺 {', '.join(missing)}（缺件归该工序补齐）")
          if unattributed_failure:
              lines.append("无主失败：逐工序全 pass 但合并 pytest 退出码非 0（见 verdict.json）。")
          if conflicts:
              lines += ["", "## 工单层冲突（验收员升级记录）", ""]
              for c in conflicts:
                  lines.append(f"- `{c['process']}`：{c['summary']}（证据：{c.get('evidence', '')}）")
          lines += ["", f"总判定：**{overall}**"]
          open("verdict.md", "w").write("\n".join(lines))

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"overall={overall}\n")
              out.write("failed_processes=" + json.dumps(failed) + "\n")
              out.write(f"unattributed_failure={'true' if unattributed_failure else 'false'}\n")
          print("revalidate merge done | overall:", overall, "| failed:", failed)
          PY

      - name: Adopt verdict into ForemanRun wall (P0-1, revalidate)
        id: adopt
        if: always()
        run: |
          if [ ! -f foreman-run.json ]; then
            if [ ! -f wall-in/foreman-run.json ]; then
              echo "foreman-run missing before revalidate adopt"
              exit 1
            fi
            cp wall-in/foreman-run.json foreman-run.json
          fi
          DROID_EXIT=-1
          [ -f work/droid-exit.txt ] && DROID_EXIT=$(cat work/droid-exit.txt)
          MERGE_FLAG=""
          [ -f verdict.json ] && MERGE_FLAG="--merge-step-ran"
          FOREMAN_RUN_PATCH=1 PYTHONPATH=scripts/team python3 scripts/team/run_adopt_step.py \
            --wall foreman-run.json --work-dir work --droid-exit "$DROID_EXIT" \
            --github-output "$GITHUB_OUTPUT" $MERGE_FLAG
        env:
          PYTHONPATH: scripts/team

      - name: Compute replan gate (Y1, revalidate)
        id: replan_gate
        if: always()
        run: |
          PYTHONPATH=scripts/team python3 scripts/team/compute_replan_gate.py \
            --wall foreman-run.json --github-output "$GITHUB_OUTPUT"

      - name: Derive validate job conclusion (W4, revalidate)
        id: validate_conclusion
        if: always()
        run: |
          PYTHONPATH=scripts/team python3 scripts/team/compute_validate_conclusion.py \
            --wall foreman-run.json --github-output "$GITHUB_OUTPUT"

      - name: Assert verdict artifact complete (B2, revalidate)
        id: assert_verdict
        if: always()
        run: |
          PYTHONPATH=scripts/team python3 scripts/team/assert_artifact_complete.py \
            --wall foreman-run.json \
            --name team-verdict-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}

      - name: Upload verdict artifact (revalidate)
        if: steps.assert_verdict.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: team-verdict-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: |
            verdict.json
            verdict.md
          overwrite: true

      - name: Upload foreman-run wall artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: foreman-run.json
          overwrite: true

      - name: Fail revalidate job when adoption failed (W6)
        if: always()
        run: |
          PYTHONPATH=scripts/team python3 scripts/team/compute_validate_conclusion.py --wall foreman-run.json

  replan:
    name: replan (foreman revises plan or re-dispatches)
    needs: [lead, prep, validate, revalidate]
    # R2-1: the retry is the only validate-state that can judge a real FAIL
    # after a first timeout (validate's own gate is necessarily false there:
    # requesting a revalidation implies adoption failed). When the retry ran
    # and was adopted, its gate decides; when it never ran, round 1's gate
    # decides. A failed/cancelled retry stays terminal (no arm matches).
    if: >-
      ${{ !cancelled() &&
      ((needs.revalidate.result == 'success' && needs.revalidate.outputs.should_replan == 'true') ||
      (needs.revalidate.result == 'skipped' && needs.validate.outputs.should_replan == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      processes2: ${{ steps.replan.outputs.processes2 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ForemanRun wall (batch-3 budgets)
        uses: actions/download-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: wall-in

      - name: Download plan, verdict, and evidence
        uses: actions/download-artifact@v4
        with:
          pattern: team-*-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: dl

      - name: Install droid CLI
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Write BYOM settings (replan session)
        env:
          WORKER_CI_KEY: ${{ secrets.WORKER_CI_KEY }}
          GO_GITHUB_RUN_TOKEN: ${{ secrets.GO_GITHUB_RUN_TOKEN }}
          GW_TOKEN_KNOWN: ${{ secrets.GW_TOKEN_KNOWN }}
          SESSION_NAME: team-lead-replan
        run: |
          mkdir -p ~/.factory
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.factory/settings.json")
          s = {}
          if os.path.exists(p):
              s = json.load(open(p))
          headers = {
              "x-ci-key": os.environ.get("WORKER_CI_KEY", ""),
              "x-opencode-session": os.environ.get("SESSION_NAME", "team-lead-replan"),
              "cf-aig-authorization": "Bearer " + os.environ.get("GW_TOKEN_KNOWN", ""),
          }
          s["customModels"] = [{
              "model": "dynamic/droid-review",
              "id": "custom:DeepSeek-V4.1-Flash-Go",
              "baseUrl": "https://droid-test.lumivane.dpdns.org",
              "apiKey": os.environ.get("GO_GITHUB_RUN_TOKEN", ""),
              "provider": "generic-chat-completion-api",
              "extraHeaders": headers,
          }]
          json.dump(s, open(p, "w"), indent=2)
          print("settings written for replan session")
          PY

      - name: Foreman classifies failures and writes plan v2
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -o pipefail
          mkdir -p stage
          cp dl/team-plan-*/team-plan.json stage/plan-v1.json
          cp dl/team-verdict-*/verdict.json stage/verdict.json
          tar -xzf dl/team-evidence-*/evidence.tar.gz -C stage
          python3 - <<'PY'
          import json, os
          plan = json.load(open("stage/plan-v1.json"))
          verdict = json.load(open("stage/verdict.json"))
          failed = [p["id"] for p in verdict["processes"] if p["verdict"] != "pass"]
          # v2.6.4 (A): attribution mode — no process was judged failed,
          # but the merged suite is red (the verdict carries
          # unattributed_failure). Attribute each failing test to the
          # process whose card owns its test file; card file sets are
          # disjoint by construction (the lead filing step rejects
          # overlaps), so ownership is unambiguous.
          attribution_mode = bool(verdict.get("unattributed_failure")) and not failed
          failing_tests = verdict.get("failing_tests") or []
          attributed = []
          if attribution_mode:
              owners = {}
              for proc in plan["processes"]:
                  for f in proc.get("files") or []:
                      owners[os.path.normpath(str(f).strip())] = proc["id"]
              for t in failing_tests:
                  owner = owners.get(os.path.normpath(str(t).split("::")[0].strip()))
                  if owner and owner not in attributed:
                      attributed.append(owner)
              attributed = [p["id"] for p in plan["processes"] if p["id"] in attributed]
          # 52A fix: escalated work-order conflicts reopen the order — the
          # conflicted processes join the required coverage set (deterministic,
          # from the verdict itself), so the foreman can revise their cards to
          # resolve the contradiction. Without this the coverage check
          # (changes must cover failed exactly) would reject any revision of
          # a passed-but-conflicted card — a prompt/checker contradiction of
          # the exact class that killed round 51.
          conflicts = verdict.get("conflicts") or []
          conflicted_ids = sorted({c.get("process") for c in conflicts if isinstance(c, dict) and c.get("process")})
          required_hint = sorted(set(failed) | set(conflicted_ids))
          # Round-53 fix: tell the foreman what the missing evidence actually
          # means before it writes any retry_note. The validator's "missing
          # diff" refers to prep's own pack member (prep generates diff.patch
          # from the git diff of the worker branch); it is never a worker
          # deliverable. The packs come up empty because F-1 rejected the
          # worker session before its branch push — the true cause is the
          # absent branch. All of this is derived from the manifest the
          # validator judged (the prompt is never trusted downstream).
          manifest_path = "stage/manifest.json"
          blocked_by_pid = {}
          if os.path.exists(manifest_path):
              try:
                  r2_manifest = json.load(open(manifest_path))
                  for pid, info in r2_manifest.get("packs", {}).items():
                      if info.get("complete"):
                          continue
                      cause = ""
                      if not info.get("branch_present") and not info.get("merged"):
                          cause = (
                              f"the round-1 branch for process `{pid}` was never pushed "
                              "(the F-1 check rejected the session before its branch push)"
                          )
                      elif not info.get("merged"):
                          cause = f"the round-1 branch for process `{pid}` exists but was not merged into the candidate"
                      worker_violations = info.get("out_of_bounds") or []
                      if worker_violations:
                          cause += (
                              "; out-of-bounds file(s) the worker session wrote "
                              "(the only worker-side file violation): " + ", ".join(worker_violations)
                              + " — must not be recreated by the next session"
                          )
                      if not cause:
                          cause = f"the evidence pack for process `{pid}` is incomplete (missing pack members)"
                      blocked_by_pid[pid] = cause
              except Exception as exc:
                  print("could not derive blocked causes from manifest:", exc)
          blocked_cause_line = ""
          if blocked_by_pid:
              blocked_cause_line = " ".join(
                  f"For process `{pid}`: {cause}." for pid, cause in sorted(blocked_by_pid.items())
              )
              absent = [pid for pid, cause in blocked_by_pid.items() if "was never pushed" in cause]
              if absent:
                  blocked_cause_line += (
                      " Summary: no branch — the worker session was rejected before its branch push"
                      " (for processes: " + ", ".join(f"`{pid}`" for pid in sorted(absent)) + ")."
                  )
          conflicts_line = ""
          if conflicts:
              names = ", ".join(conflicted_ids)
              conflicts_line = (
                  f"The validator escalated {len(conflicts)} work-order conflict(s) "
                  f"(process(es): {names}); details in stage/verdict.json top-level "
                  "\"conflicts\" array. Decide for each conflicted process: revise the "
                  "card to resolve the contradiction (state which value the card now "
                  "pins), or redispatch with a retry_note stating the card stands as "
                  "written. "
              )
          if attribution_mode:
              failed_line = ("No process was judged failed, but the merged test suite is red. "
                             "Failing tests (from verdict.json failing_tests): "
                             + ", ".join(failing_tests)
                             + "。These tests belong to process(es): "
                             + (", ".join(attributed) if attributed else "(none — no card owns the failing test files)")
                             + " (by card file ownership).")
              layer_block = "\n".join([
                  "Attribution mode — for EACH failing test above, decide whose fault it is:",
                  "- the test assertion conflicts with the card's own spec/examples (the card wrote a wrong expectation as a hard requirement) = plan problem (wrong checks): \"revise\" that process's card — even though it was judged pass; in this mode, revising an attributed process is the only allowed exception to the no-passed-process rule.",
                  "- the implementation is wrong in exactly the way the (correct) card describes = worker problem: \"redispatch\".",
                  "- the test file itself is wrong while the card is right = plan problem (wrong check command): \"revise\".",
              ]) + "\n\n"
              cover_rule = "The changes list must cover every attributed process exactly once, and no other process."
              claim_rule = "A revised card must not claim files owned by a process other than itself and the other attributed processes."
          else:
              failed_line = "Failed or blocked processes: " + (", ".join(required_hint) if required_hint else "(none)")
              layer_block = "\n"
              cover_rule = "The changes list must cover every failed, blocked, or conflicted process exactly once, and no passed process (conflicted = named in the verdict's conflicts array; its verdict may still say pass)."
              claim_rule = "A revised card must not claim files owned by a passed process (a conflicted process it revises excepted)."
          prompt = f"""You are the FOREMAN （领班） again. Validation of plan v1 did not pass. Your job now is to fix the PLAN, never the code. Do not write application code. Do not edit any file except team-plan-v2.json in the current directory.

          In front of you:
          - stage/plan-v1.json (the original plan and process cards)
          - stage/verdict.json (the validator verdict per process)
          - stage/manifest.json and stage/packs/<id>/ (evidence packs, including failed ones)
          - stage/pytest-output.txt (full test evidence)

          {failed_line}{conflicts_line}{blocked_cause_line}

          What the missing evidence means (read before writing any retry_note):
          - "missing handoff/status/diff" in a verdict reason refers to prep's evidence-pack members. The diff in the pack is generated by prep itself from the git diff of the worker branch — it is never a worker deliverable, and a retry_note must never ask the worker to write or commit a diff file. A worker session that wrote extra pack-shaped files would only add an out-of-bounds file and be rejected again.
          - When the branch for a process was never pushed, the real cause is that rejection, not a missing worker deliverable: state the actual cause on the retry_note (see the per-process causes above), and make the redispatched card stand on its own card contract — deliverable files, one handoff at team/handoffs/<id>.md, one status file at team/status/<id>.json, nothing else.

          For EACH failed or blocked process, decide whose fault it is:
          - "redispatch" （工人问题）: the card was fine, the work was not. Keep the original card and add a "retry_note" that tells the next worker exactly what to fix, citing the verdict reason and evidence.
          - "revise" （计划问题）: the card itself was wrong (bad split, wrong files, wrong checks, missing requirement). Output a corrected full card with the same "id", plus a "retry_note" explaining what changed and why.
          {layer_block}Write team-plan-v2.json with exactly this shape:
          {{
            "summary": "one short sentence",
            "changes": [
              {{"process_id": "id", "mode": "redispatch" or "revise", "reason": "whose fault and why", "card": {{full process card including retry_note}}}}
            ]
          }}
          {cover_rule}
          {claim_rule}
          Write valid JSON only. Do not wrap it in Markdown.
          Be efficient: at most 10 tool calls; decide from the verdict and the failed processes' evidence first; write team-plan-v2.json as soon as your decisions are made, do not re-read everything.
          """
          open("replan-prompt.txt", "w").write(prompt)
          if attribution_mode and not attributed:
              # v2.6.4 (A): nothing can be attributed — do not spend a
              # foreman session; the filing step posts the no-solution
              # stop comment and fails the job.
              open("attribution-empty.txt", "w").write("unattributed failure; no card owns the failing test files\n")
          PY
          if [ -f attribution-empty.txt ]; then
            echo "attribution mode with no attributable process; skipping the foreman session (the filing step will stop the order for a human)"
          else
            cp wall-in/foreman-run.json foreman-run.json
            FOREMAN_RUN_PATCH=1 PYTHONPATH=scripts/team python3 scripts/team/run_droid_session.py \
              --wall foreman-run.json --role replan \
              --prompt-file replan-prompt.txt \
              --stream-out replan-stream.jsonl \
              --exit-out replan-droid-exit.txt
          fi

      - name: Upload replan droid stream (W-13)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droid-stream-replan-run-${{ github.run_id }}
          path: replan-stream.jsonl
          if-no-files-found: warn

      - name: Validate plan v2 and file the revision
        id: replan
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          PLAN_ISSUE_NUMBER: ${{ needs.lead.outputs.plan_issue_number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          repo = os.environ["GITHUB_REPOSITORY"]
          issue_number = os.environ["ISSUE_NUMBER"]
          run_id = os.environ["RUN_ID"]
          plan_number = int(os.environ["PLAN_ISSUE_NUMBER"])

          def gh(*args, check=True):
              r = subprocess.run(["gh", *args], capture_output=True, text=True)
              if check and r.returncode != 0:
                  print("gh failed:", " ".join(args), r.stdout, r.stderr)
                  sys.exit(1)
              return r

          plan = json.load(open("stage/plan-v1.json"))
          verdict = json.load(open("stage/verdict.json"))
          failed = {p["id"] for p in verdict["processes"] if p["verdict"] != "pass"}
          def normp(p):
              return os.path.normpath(str(p).strip())

          # v2.6.4 (A): the required coverage set. Classic mode: the
          # failed processes. Attribution mode (no failed process, but
          # the verdict carries unattributed_failure): the processes
          # whose cards own the failing tests' files, recomputed here
          # deterministically — the prompt text is never trusted for
          # this. The protected-file set below is the complement of
          # `required`, so in attribution mode an attributed (passed)
          # process may re-claim its own files via its revise card,
          # while every other passed process stays protected.
          attribution_mode = bool(verdict.get("unattributed_failure")) and not failed
          required = set(failed)
          if attribution_mode:
              owners = {}
              for proc in plan["processes"]:
                  for f in proc.get("files") or []:
                      owners[normp(f)] = proc["id"]
              attributed = set()
              for t in verdict.get("failing_tests") or []:
                  owner = owners.get(normp(str(t).split("::")[0]))
                  if owner:
                      attributed.add(owner)
              if not attributed:
                  gh("issue", "comment", str(plan_number), "--body",
                     "## 改计划回路：无主失败无法归属\n\n合并测试失败清单 "
                     + "、".join(f"`{t}`" for t in (verdict.get("failing_tests") or []))
                     + " 的测试文件不归任何工序卡所有，领班无从判层，本单停下报人裁。", check=False)
                  print("unattributed failure cannot be attributed to any process card; stopping the order for a human")
                  sys.exit(1)
              required = attributed
          # 52A fix: conflicted processes are required coverage too — the
          # foreman must carry a decision (revise/redispatch) for each card
          # named in the verdict's conflicts array, deterministically
          # recomputed from the verdict (the prompt is never trusted).
          conflicts = verdict.get("conflicts") or []
          conflicted = {c.get("process") for c in conflicts if isinstance(c, dict) and c.get("process")}
          required |= conflicted

          v2 = json.load(open("team-plan-v2.json"))
          passed_files = {}
          for proc in plan["processes"]:
              if proc["id"] not in required:
                  for f in proc["files"]:
                      passed_files[normp(f)] = proc["id"]

          changes = v2.get("changes") or []
          change_ids = [c.get("process_id") for c in changes]
          if len(change_ids) != len(set(change_ids)):
              print("plan v2 has duplicate process_id entries in changes")
              sys.exit(1)
          if sorted(change_ids) != sorted(required):
              print(f"plan v2 must cover exactly the required processes {sorted(required)} (multiset comparison; classic mode: the failed processes, attribution mode: the attributed processes, plus every conflicted process named in the verdict's conflicts array)")
              sys.exit(1)
          for pid in change_ids:
              if not re.fullmatch(r"^[a-z0-9][a-z0-9-]*$", str(pid)):
                  print(f"plan v2 change has illegal process id (allowed: ^[a-z0-9][a-z0-9-]*$): {pid}")
                  sys.exit(1)
          originals = {p["id"]: p for p in plan["processes"]}
          # Full-graph claim check (F+J): the effective round-2 plan is the
          # passed processes (original cards) plus every change (redispatch
          # keeps the original card, revise brings a new one). Claims of ALL
          # of them must be pairwise disjoint after normalization, and none
          # may hit a protected path. Checking only revise-vs-passed lets
          # two failed processes claim the same file.
          claims = dict(passed_files)
          stripped2 = []
          for change in changes:
              pid = change.get("process_id")
              mode = change.get("mode")
              if mode == "redispatch":
                  claim_files = [normp(f) for f in originals[pid]["files"]]
              elif mode == "revise":
                  claim_files = [normp(f) for f in (change.get("card") or {}).get("files") or []]
              else:
                  print("invalid mode:", change)
                  sys.exit(1)
              kept_claims = []
              for f in claim_files:
                  if f == "team" or f.startswith("team/"):
                      stripped2.append((pid, f))
                  else:
                      kept_claims.append(f)
              claim_files = kept_claims
              if mode == "revise" and change.get("card") is not None:
                  change["card"]["files"] = list(claim_files)
              for f in claim_files:
                  parts = f.split("/")
                  if os.path.isabs(f) or ".." in parts or f == ".github" or f.startswith(".github/") or f == "team" or f.startswith("team/"):
                      print(f"plan v2 claims protected path: {f} ({pid})")
                      sys.exit(1)
                  if f in claims:
                      print(f"plan v2 file claimed by two processes in the effective plan: {f} ({claims[f]} and {pid})")
                      sys.exit(1)
                  claims[f] = pid
          processes2 = []
          seen_files = dict(passed_files)
          comment_lines = ["## 计划改版 v1 → v2（领班改计划）", "",
                           f"总述：{v2.get('summary', '')}", ""]
          if stripped2:
              comment_lines += ["系统托管路径已自动剔除（team/ 由系统托管、无需在计划中声明）：",
                                *[f"- `{pid}`: {f}" for pid, f in stripped2], ""]
              print("stripped system-managed paths (plan v2):", "; ".join(f"`{pid}`: {f}" for pid, f in stripped2))
          for change in changes:
              pid = change["process_id"]
              mode = change.get("mode")
              card = change.get("card") or {}
              if mode not in ("redispatch", "revise"):
                  print("invalid mode:", change)
                  sys.exit(1)
              if mode == "redispatch":
                  card = dict(originals[pid])
                  card["retry_note"] = (change.get("card") or {}).get("retry_note") or change.get("reason", "")
              else:
                  for key in ("id", "title", "scope", "files", "task", "checks"):
                      if not card.get(key):
                          print(f"revised card missing {key}: {pid}")
                          sys.exit(1)
                  if card["id"] != pid:
                      print("revised card id must stay the same:", pid)
                      sys.exit(1)
                  card["files"] = [normp(f) for f in card["files"]]
                  for f in card["files"]:
                      if f in seen_files:
                          print(f"revised card claims file owned by {seen_files[f]}: {f}")
                          sys.exit(1)
                      seen_files[f] = pid
              card["branch_suffix"] = "-r2"

              if mode == "revise":
                  old_sub = originals[pid].get("sub_issue_number")
                  child_title = f"[工序] {pid} v2 · 工单 #{issue_number} · run {run_id}"
                  child_body = "\n".join([
                      f"# 工序卡（计划 v2 修订）：{card['title']} (`{pid}`)", "",
                      f"父计划：#{plan_number}", f"来源工单：#{issue_number}", "",
                      f"修订理由：{change.get('reason', '')}", "",
                      f"范围：{card['scope']}", "", f"文件：{', '.join(card['files'])}", "",
                      f"任务：{card['task']}", "", f"检查：{'; '.join(card['checks'])}", "",
                      f"重试说明：{card.get('retry_note', '')}",
                  ])
                  open("issue-body.tmp.md", "w").write(child_body)
                  r = gh("issue", "create", "--title", child_title, "--body-file", "issue-body.tmp.md")
                  child_number = int(r.stdout.strip().splitlines()[-1].rstrip("/").split("/")[-1])
                  r = gh("api", f"repos/{repo}/issues/{child_number}", "--jq", ".id")
                  attach = gh("api", "--method", "POST",
                              f"repos/{repo}/issues/{plan_number}/sub_issues",
                              "-F", f"sub_issue_id={int(r.stdout.strip())}", check=False)
                  card["sub_issue_number"] = child_number
                  card["sub_issue_linked"] = attach.returncode == 0
                  if old_sub:
                      gh("issue", "comment", str(old_sub), "--body",
                         f"本工序卡已被计划 v2 修订卡取代（新子单 #{child_number}），本单以 not planned 关闭，不计完成。", check=False)
                      gh("issue", "close", str(old_sub), "--reason", "not planned", check=False)
                  comment_lines.append(f"- `{pid}`：改计划（revise）→ 新子单 #{child_number}；理由：{change.get('reason', '')}")
              else:
                  card["sub_issue_number"] = originals[pid].get("sub_issue_number")
                  card["sub_issue_linked"] = originals[pid].get("sub_issue_linked")
                  if card["sub_issue_number"]:
                      gh("issue", "comment", str(card["sub_issue_number"]), "--body",
                         f"## 重派（计划 v2）\n\n理由：{change.get('reason', '')}\n\n重试说明：{card.get('retry_note', '')}",
                         check=False)
                  comment_lines.append(f"- `{pid}`：重派（redispatch）→ 子单 #{card['sub_issue_number']}；理由：{change.get('reason', '')}")
              processes2.append(card)

          v2["processes"] = processes2
          v2["plan_version"] = 2
          json.dump(v2, open("team-plan-v2.json", "w"), ensure_ascii=False, indent=2)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("processes2=" + json.dumps(processes2, ensure_ascii=False) + "\n")
          # 52A fix: escalated work-order conflicts stay on the audit trail —
          # the replan notice names them, and a conflicts-only round (no
          # failed process, foreman judged the cards fine) is stated as such
          # instead of silently looking like an ordinary red round.
          conflicts = verdict.get("conflicts") or []
          if conflicts:
              comment_lines += ["", "## 工单层冲突（第 1 轮验收升级，计划 v2 必须给出处置）", ""]
              for c in conflicts:
                  comment_lines.append(f"- `{c.get('process')}`：{c.get('summary', '')}（证据：{c.get('evidence', '')}）")
          comment_lines += ["", "审计镜像（只读）：第 2/2 轮再计划通知；板面状态以 Projects PAT 写板为准。"]
          open("replan-comment.md", "w").write("\n".join(comment_lines))
          print("\n".join(comment_lines))
          PY

      - name: Download ForemanRun wall for replan comments
        uses: actions/download-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: wall-in

      - name: Post replan notice comments (B4/I4)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PLAN_ISSUE_NUMBER: ${{ needs.lead.outputs.plan_issue_number }}
        run: |
          if [ ! -f wall-in/foreman-run.json ]; then
            echo "foreman-run missing before replan comments"
            exit 1
          fi
          # Freshen only when absent: the replan session may already have
          # patched this wall copy with its session outcome; an unconditional
          # copy would drop that patch from the uploaded wall.
          [ -f foreman-run.json ] || cp wall-in/foreman-run.json foreman-run.json
          PYTHONPATH=scripts/team python3 scripts/team/post_comment_hard.py \
            --issue "$PLAN_ISSUE_NUMBER" \
            --body-file replan-comment.md \
            --hard-required \
            --wall-patch '{"key":"replan_notice_plan","wall":"foreman-run.json"}'
          PYTHONPATH=scripts/team python3 scripts/team/post_comment_hard.py \
            --issue "$ISSUE_NUMBER" \
            --body-file replan-comment.md \
            --hard-required \
            --wall-patch '{"key":"replan_notice_order","wall":"foreman-run.json"}'

      - name: Record replan exit on ForemanRun wall
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -f foreman-run.json ]; then
            :
          elif [ -f wall-in/foreman-run.json ]; then
            cp wall-in/foreman-run.json foreman-run.json
          else
            echo "foreman-run missing for replan wall sync"
            exit 1
          fi
          RESULT="success"
          if [ "$JOB_STATUS" = "failure" ]; then RESULT="failure"; fi
          if [ "$JOB_STATUS" = "cancelled" ]; then RESULT="cancelled"; fi
          PRODUCED="false"
          if [ -f team-plan-v2.json ]; then PRODUCED="true"; fi
          PYTHONPATH=scripts/team python3 scripts/team/wall_sync_job.py \
            --job replan --result "$RESULT" --produced "$PRODUCED"

      - name: Upload foreman-run wall artifact (replan exit)
        if: always() && hashFiles('foreman-run.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: foreman-run.json
          overwrite: true

      - name: Upload plan v2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-plan-v2-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: team-plan-v2.json
          overwrite: true

  worker2:
    name: worker (round 2)
    needs: replan
    if: ${{ !cancelled() && needs.replan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        process: ${{ fromJSON(needs.replan.outputs.processes2) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record base SHA (session self-commit guard)
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install dev dependencies (U-10)
        run: python3 -m pip install -r requirements-dev.txt

      - name: Install droid CLI
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Write BYOM settings (worker round 2 session)
        env:
          WORKER_CI_KEY: ${{ secrets.WORKER_CI_KEY }}
          GO_GITHUB_RUN_TOKEN: ${{ secrets.GO_GITHUB_RUN_TOKEN }}
          GW_TOKEN_KNOWN: ${{ secrets.GW_TOKEN_KNOWN }}
          SESSION_NAME: team-worker-${{ matrix.process.id }}-r2
        run: |
          mkdir -p ~/.factory
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.factory/settings.json")
          s = {}
          if os.path.exists(p):
              s = json.load(open(p))
          headers = {
              "x-ci-key": os.environ.get("WORKER_CI_KEY", ""),
              "x-opencode-session": os.environ.get("SESSION_NAME", "team-worker"),
              "cf-aig-authorization": "Bearer " + os.environ.get("GW_TOKEN_KNOWN", ""),
          }
          s["customModels"] = [{
              "model": "dynamic/droid-review",
              "id": "custom:DeepSeek-V4.1-Flash-Go",
              "baseUrl": "https://droid-test.lumivane.dpdns.org",
              "apiKey": os.environ.get("GO_GITHUB_RUN_TOKEN", ""),
              "provider": "generic-chat-completion-api",
              "extraHeaders": headers,
          }]
          json.dump(s, open(p, "w"), indent=2)
          print("settings written for worker round 2 session")
          PY

      - name: Worker executes exactly one process card (round 2)
        id: session
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          PROCESS_JSON: ${{ toJSON(matrix.process) }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          python3 - <<'PY'
          import json, os
          proc = json.loads(os.environ["PROCESS_JSON"])
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          issue = ev.get("issue") or {}
          retry = proc.get("retry_note") or ""
          retry_block = f"\n          Retry context (this card was re-dispatched after validation):\n          {retry}\n" if retry else ""
          prompt = f"""You are a WORKER on a development team under the foreman pattern. Execute exactly one process card (your sub-issue #{proc.get('sub_issue_number', '?')}). Do not do any other process. Do not expand scope.

          Work order: #{os.environ['ISSUE_NUMBER']} {issue.get('title','')}
          Work order body:
          {issue.get('body') or ''}

          Your process card:
          {json.dumps(proc, ensure_ascii=False, indent=2)}
          {retry_block}
          Instructions:
          - Create or edit only these files: {', '.join(proc['files'])}
          - Also write exactly these two team files:
            1. team/handoffs/{proc['id']}.md — a self-contained handoff with: what was requested, what you did, what you did not do, checks you ran and their results, and anything the validator must pay attention to.
            2. team/status/{proc['id']}.json — valid JSON with keys: id, title, state ("done"), files (array), checks (array of objects with command and result).
          - Run your process checks before finishing: {'; '.join(proc['checks'])}
          - Checks may run tests across the whole repo. Files like verdict.json or verdict.md that appear in the repo root because of those checks are pipeline by-products of the test suite, not your deliverables. They are outside your card, so delete them before finishing (e.g. rm -f verdict.json verdict.md).
          - Do not commit or push; the workflow will do that.
          - Do not modify files owned by other processes.
          - Be efficient: at most 20 tool calls.
          """
          open("worker-prompt.txt", "w").write(prompt)
          PY
          # F1: capture the session's own exit code (GNU timeout exit 124 =
          # 900s wall kill) for the delta step, then re-exit with it so the
          # job-level conclusion keeps failing on a killed session.
          set +e
          timeout --signal=TERM --kill-after=30s 900s ~/.local/bin/droid exec --auto high -m "custom:DeepSeek-V4.1-Flash-Go" --output-format stream-json "$(cat worker-prompt.txt)" | tee worker-stream.jsonl
          DROID_EXIT=$?
          echo "exit_code=${DROID_EXIT:-0}" >> "$GITHUB_OUTPUT"
          exit "${DROID_EXIT:-0}"

      - name: Upload worker droid stream (W-13)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droid-stream-worker-${{ matrix.process.id }}-run-${{ github.run_id }}
          path: worker-stream.jsonl
          if-no-files-found: warn

      - name: Verify process checks and handoff
        env:
          PROCESS_JSON: ${{ toJSON(matrix.process) }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          if subprocess.run(["python3", "-m", "pytest", "--version"],
                            capture_output=True).returncode != 0:
              print("pytest missing; installing deterministically (v2.1)")
              if subprocess.run(["python3", "-m", "pip", "install", "-q", "pytest"]).returncode != 0:
                  print("pytest install failed; cannot verify")
                  sys.exit(1)
              if subprocess.run(["python3", "-m", "pytest", "--version"],
                                capture_output=True).returncode != 0:
                  print("pytest still unavailable after install; cannot verify")
                  sys.exit(1)
          proc = json.loads(os.environ["PROCESS_JSON"])
          handoff = f"team/handoffs/{proc['id']}.md"
          status = f"team/status/{proc['id']}.json"
          # v2.6.3: process-quality failures (missing deliverables, malformed
          # status, red checks) no longer kill this step. All checks run to
          # completion, every problem is recorded in a marker file, and the
          # step exits 0 so the commit step still lands the branch + handoff
          # evidence; a trailing step fails the job if the marker exists.
          # (The marker name carries the process id: a bare
          # "checks-failed.marker" would collide when prep merges several
          # failed workers' branches into one candidate.) Only the harness
          # failure above (pytest cannot be installed at all) keeps the
          # hard exit: without pytest no check can run at all.
          marker = f"team/status/{proc['id']}.checks-failed.marker"
          # v2.6.3 (review fix): delete any pre-existing marker for this
          # process before checking. A stale marker (e.g. one that reached
          # the default branch from an earlier order reusing this process
          # id) must not fail this run: the trailing step may only honor a
          # marker written by THIS verify step, below.
          if os.path.exists(marker):
              print(f"removing pre-existing marker before verifying: {marker}")
              os.remove(marker)
          problems = []
          for path in [handoff, status] + [os.path.normpath(p) for p in proc["files"]]:
              if not os.path.exists(path):
                  print(f"missing expected file: {path}")
                  problems.append(f"missing expected file: {path}")
          if os.path.exists(status):
              try:
                  json.load(open(status))
              except Exception as exc:
                  print(f"status file is not valid JSON: {exc}")
                  problems.append(f"status file is not valid JSON: {exc}")
          check_results = []
          for cmd in proc["checks"]:
              print(f"$ {cmd}")
              result = subprocess.run(cmd, shell=True)
              check_results.append((cmd, result.returncode))
              if result.returncode != 0:
                  print(f"check failed (exit {result.returncode}): {cmd}")
                  problems.append(f"check failed (exit {result.returncode}): {cmd}")
          if problems:
              os.makedirs(os.path.dirname(marker), exist_ok=True)
              with open(marker, "w") as fh:
                  fh.write(f"process: {proc['id']}\n")
                  for cmd, rc in check_results:
                      fh.write(f"check exit {rc}: {cmd}\n")
                  for problem in problems:
                      fh.write(f"problem: {problem}\n")
              print("worker verification found problems; marker written, "
                    "evidence will still be committed and the job failed afterwards:")
              for problem in problems:
                  print(" -", problem)
          else:
              print("worker verification passed")
          PY

      - name: Commit, push worker branch, and post handoff
        # v2.6.3: run even when the verify step recorded red checks (or died
        # on the pytest-install guard), so the evidence lands before the
        # trailing step fails the job.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          PROCESS_ID: ${{ matrix.process.id }}
          PROCESS_TITLE: ${{ matrix.process.title }}
          PROCESS_JSON: ${{ toJSON(matrix.process) }}
          SUB_ISSUE_NUMBER: ${{ matrix.process.sub_issue_number }}
          BRANCH_SUFFIX: ${{ matrix.process.branch_suffix }}
        run: |
          SUFFIX="${BRANCH_SUFFIX:-}"
          BR="team/issue-${ISSUE_NUMBER}/run-${RUN_ID}/${PROCESS_ID}${SUFFIX}"
          git config user.name "droid-team-worker"
          git config user.email "droid-team-worker@localhost"
          if [ -z "${BASE_SHA:-}" ]; then
            echo "BASE_SHA not recorded; refusing to commit"
            exit 1
          fi
          # The worker session is told not to commit, but a prompt is not a
          # mechanism: squash any commits it made past the recorded base
          # back into the worktree, then verify the whole changed-file set
          # against the card before anything is staged (F-1).
          git reset --soft "$BASE_SHA"
          python3 - <<'PY'
          import json, os, subprocess, sys
          proc = json.loads(os.environ["PROCESS_JSON"])
          pid = proc["id"]
          def norm(p):
              return os.path.normpath(p.strip().strip('"'))
          allowed = {norm(f) for f in proc["files"]}
          allowed |= {f"team/handoffs/{pid}.md", f"team/status/{pid}.json",
                      f"team/status/{pid}.checks-failed.marker"}
          scratch = {"worker-prompt.txt", "worker-stream.jsonl"}
          out = subprocess.run(["git", "status", "--porcelain", "--untracked-files=all"],
                               capture_output=True, text=True).stdout
          changed = set()
          for line in out.splitlines():
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ")[-1]
              np = norm(path)
              parts = np.split("/")
              if parts[-1] in scratch or "__pycache__" in parts or ".pytest_cache" in parts or np.endswith(".pyc"):
                  continue
              changed.add(np)
          extras = sorted(changed - allowed)
          if extras:
              print("worker session changed files outside its card:", extras)
              sp = f"team/status/{pid}.json"
              try:
                  st = json.load(open(sp))
                  st["out_of_bounds"] = extras
                  json.dump(st, open(sp, "w"), ensure_ascii=False, indent=2)
              except Exception as exc:
                  print("could not annotate status.json:", exc)
              with open(f"team/handoffs/{pid}.md", "a") as fh:
                  fh.write("\n\n## 越界文件（工作流校验）\n\n本工序会话改动了卡外文件，提交被工作流拒绝：" + ", ".join(extras) + "\n")
              sys.exit(1)
          print("changed files within card scope:", sorted(changed))
          PY
          git checkout -b "$BR"
          # v2.6.3 (review fix): stage files one by one, each only if it
          # exists. A missing deliverable / handoff / status file is a
          # process-quality problem that prep/validator judge from the
          # evidence (missing items = blocked); it must not kill this step
          # on a pathspec error before the branch can land. The marker add
          # lives in the same loop, exactly once. This staging block is
          # identical in the round-1 and round-2 commit steps.
          jq -r '.files[]' <<<"$PROCESS_JSON" | while IFS= read -r f; do
            if [ -f "$f" ]; then git add -- "$f"; else echo "not staging missing file: $f"; fi
          done
          for f in "team/handoffs/${PROCESS_ID}.md" "team/status/${PROCESS_ID}.json" "team/status/${PROCESS_ID}.checks-failed.marker"; do
            if [ -f "$f" ]; then git add -- "$f"; else echo "not staging missing file: $f"; fi
          done
          if git diff --cached --quiet; then
            echo "worker produced no changes"
            exit 1
          fi
          git commit -m "team worker r2 ${PROCESS_ID}: ${PROCESS_TITLE}"
          git push -u origin "$BR"
          {
            echo "## 工人交接（第 2 轮）：${PROCESS_TITLE} (\`${PROCESS_ID}\`)"
            echo ""
            echo "分支：\`$BR\`"
            echo ""
            cat "team/handoffs/${PROCESS_ID}.md"
          } > handoff-comment.md
          PYTHONPATH=scripts/team python3 scripts/team/post_comment_hard.py \
            --issue "$ISSUE_NUMBER" --body-file handoff-comment.md --hard-required
          if [ -n "${SUB_ISSUE_NUMBER:-}" ]; then
            PYTHONPATH=scripts/team python3 scripts/team/post_comment_hard.py \
              --issue "$SUB_ISSUE_NUMBER" --body-file handoff-comment.md --hard-required
          fi

      - name: Fail the job when process checks failed
        # v2.6.3: the verify step now exits 0 after recording red checks in
        # the marker (so the commit step above could land the evidence);
        # this step restores the job-level conclusion: red checks = failed
        # job, exactly as before, just with the evidence already pushed.
        if: ${{ !cancelled() }}
        env:
          PROCESS_ID: ${{ matrix.process.id }}
        run: |
          MARKER="team/status/${PROCESS_ID}.checks-failed.marker"
          if [ -f "$MARKER" ]; then
            echo "process checks failed for ${PROCESS_ID}; branch and handoff evidence were committed first, now failing the job:"
            cat "$MARKER"
            exit 1
          fi
          echo "no failed-checks marker for ${PROCESS_ID}; job outcome unchanged"

      - name: Record worker2 delta for ForemanRun
        if: always()
        env:
          PROCESS_ID: ${{ matrix.process.id }}
          JOB_STATUS: ${{ job.status }}
          DROID_EXIT_CODE: ${{ steps.session.outputs.exit_code }}
        run: |
          RESULT="success"
          if [ "$JOB_STATUS" = "cancelled" ]; then RESULT="cancelled"; fi
          if [ -f "team/status/${PROCESS_ID}.checks-failed.marker" ]; then RESULT="failure"; fi
          PYTHONPATH=scripts/team python3 scripts/team/write_worker_delta.py \
            --pid "$PROCESS_ID" --result "$RESULT" --out worker-delta.json \
            --stream worker-stream.jsonl

      - name: Upload worker2 delta artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foreman-worker2-delta-${{ matrix.process.id }}-${{ github.run_id }}
          path: worker-delta.json
          overwrite: true

  workers2-wall-merge:
    name: workers2-wall-merge (round 2 workers slice)
    needs: [replan, worker2]
    if: >-
      always() &&
      (needs.replan.result == 'success' || needs.replan.result == 'failure' ||
      needs.replan.result == 'cancelled')
    runs-on: ubuntu-latest
    outputs:
      prep_should_run: ${{ steps.prep2_gate.outputs.prep_should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download ForemanRun wall
        uses: actions/download-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: wall-in
      - name: Download worker2 deltas
        uses: actions/download-artifact@v4
        with:
          pattern: foreman-worker2-delta-*-${{ github.run_id }}
          path: deltas
      - name: Merge worker2 deltas
        id: merge_worker2_deltas
        run: |
          if [ ! -f wall-in/foreman-run.json ]; then
            echo "foreman-run missing in workers2-wall-merge"
            exit 1
          fi
          cp wall-in/foreman-run.json foreman-run.json
          PYTHONPATH=scripts/team python3 scripts/team/merge_worker_deltas.py \
            --wall foreman-run.json --delta-dir deltas --round 2
      - name: Prepare foreman-run for worker2 wall sync
        if: always()
        run: |
          if [ ! -f foreman-run.json ]; then
            if [ ! -f wall-in/foreman-run.json ]; then
              echo "foreman-run missing for worker2 wall sync"
              exit 1
            fi
            cp wall-in/foreman-run.json foreman-run.json
          fi

      - name: Re-merge worker2 deltas if merge step succeeded
        if: always() && steps.merge_worker2_deltas.outcome == 'success'
        run: |
          if [ -d deltas ]; then
            PYTHONPATH=scripts/team python3 scripts/team/merge_worker_deltas.py \
              --wall foreman-run.json --delta-dir deltas --round 2
          fi

      - name: Sync worker2 chain seat from wall (W-11 / N-2)
        if: always()
        run: |
          PRODUCED="$(PYTHONPATH=scripts/team python3 -c "import json; w=json.load(open('foreman-run.json')); print('true' if (w.get('workers') or {}).get('completed_pids') else 'false')")"
          PYTHONPATH=scripts/team python3 scripts/team/wall_sync_job.py \
            --job worker2 --result "${{ needs.worker2.result }}" --produced "$PRODUCED"
      - name: Prep2 gate from wall (I1)
        id: prep2_gate
        run: |
          PYTHONPATH=scripts/team python3 - <<'PY'
          import os
          from foreman_run_lib import load_wall, prep_should_run
          wall = load_wall("foreman-run.json")
          flag = "true" if prep_should_run(wall) else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"prep_should_run={flag}\n")
          print("prep2_should_run:", flag)
          PY
      - name: Upload foreman-run wall artifact
        if: always() && hashFiles('foreman-run.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: foreman-run.json
          overwrite: true

  prep2:
    name: prep round 2 (replace rerun processes, repack evidence)
    needs: [lead, prep, validate, revalidate, replan, worker2, workers2-wall-merge]
    if: >-
      ${{ !cancelled() && needs.replan.result == 'success' &&
      needs.workers2-wall-merge.outputs.prep_should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate_branch: ${{ steps.prep2.outputs.candidate_branch }}
      manifest_sha256: ${{ steps.prep2.outputs.manifest_sha256 }}
    steps:
      - name: Checkout candidate from round 1
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.candidate_branch }}
          fetch-depth: 0

      - name: Download ForemanRun wall
        uses: actions/download-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: wall-in

      - name: Download plan, plan v2, and round 1 evidence
        uses: actions/download-artifact@v4
        with:
          pattern: team-*-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: dl

      - name: Replace rerun processes, rerun tests, repack evidence
        id: prep2
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, sys
          import atexit, tarfile

          def _pack_evidence_tar():
              # v2.5: evidence.tar.gz must exist under ANY exit code of this
              # script (the Upload step runs if: always() but needs a file).
              # atexit covers normal returns, sys.exit() and exceptions.
              try:
                  if os.path.isdir("evidence"):
                      with tarfile.open("evidence.tar.gz", "w:gz") as tf:
                          for root, _dirs, files in os.walk("evidence"):
                              for name in files:
                                  path = os.path.join(root, name)
                                  tf.add(path, arcname=os.path.relpath(path, "evidence"))
              except Exception as exc:
                  print(f"evidence tar packing failed: {exc}")

          atexit.register(_pack_evidence_tar)

          issue = os.environ["ISSUE_NUMBER"]
          run_id = os.environ["RUN_ID"]

          # v2.6.1: skeleton manifest before ANY artifact is read, so a
          # failure in the first lines below (missing or corrupt plan /
          # plan-v2 / round-1 evidence artifacts) still leaves a manifest
          # behind; the always() round-2 prep report renders its fallback
          # card from it. The minimal manifest further down (candidate
          # branch known) and the full manifest at the end overwrite it.
          os.makedirs("evidence", exist_ok=True)
          json.dump({"issue": issue, "run_id": run_id, "iteration": 2,
                     "candidate_branch": "", "pytest_exit": None,
                     "pytest_note": "", "packs": {}, "sha256": {}},
                    open("evidence/manifest.json", "w"), ensure_ascii=False, indent=2)

          # v2.6.4 (E): every subprocess in this job gets a timeout.
          # A hung child must surface as a recorded failure (exit 124,
          # the GNU timeout convention), never stall the step until the
          # 20-minute job wall kills it without evidence.
          RUN_TIMEOUT = 120
          PIP_TIMEOUT = 300
          PYTEST_FULL_TIMEOUT = 600
          CHECK_TIMEOUT = 300

          class _TimeoutResult:
              # CompletedProcess-shaped stand-in for a timed-out call,
              # so every existing caller (returncode checks, stdout /
              # stderr reads) takes its normal failure branch unchanged.
              def __init__(self, cmd, timeout, partial_out="", partial_err=""):
                  self.returncode = 124
                  self.stdout = partial_out or ""
                  self.stderr = (partial_err or "") + f"\nTIMEOUT after {timeout}s: {cmd}"

          def run(cmd, **kw):
              timeout = kw.pop("timeout", RUN_TIMEOUT)
              try:
                  return subprocess.run(cmd, capture_output=True, text=True, timeout=timeout, **kw)
              except subprocess.TimeoutExpired as exc:
                  print(f"subprocess timeout after {timeout}s: {cmd}")
                  out = exc.output.decode("utf-8", "replace") if isinstance(exc.output, bytes) else (exc.output or "")
                  err = exc.stderr.decode("utf-8", "replace") if isinstance(exc.stderr, bytes) else (exc.stderr or "")
                  return _TimeoutResult(cmd, timeout, out, err)

          def _count_passed(text):
              m = re.findall(r"(\d+) passed", text or "")
              return int(m[-1]) if m else 0

          def _count_skipped(text):
              m = re.findall(r"(\d+) skipped", text or "")
              return int(m[-1]) if m else 0

          def direct(cmd, **kw):
              # Post-review fix: the pytest probe / pip install / re-probe
              # call sites below keep their own arguments (the install
              # call deliberately streams uncaptured to the job log), but
              # share run()'s timeout semantics — a hang returns the
              # _TimeoutResult stand-in (exit 124, TIMEOUT noted) instead
              # of escaping as a bare TimeoutExpired traceback that would
              # kill the script before the evidence is written.
              try:
                  return subprocess.run(cmd, **kw)
              except subprocess.TimeoutExpired as exc:
                  timeout = kw.get("timeout", RUN_TIMEOUT)
                  print(f"subprocess timeout after {timeout}s: {cmd}")
                  out = exc.output.decode("utf-8", "replace") if isinstance(exc.output, bytes) else (exc.output or "")
                  err = exc.stderr.decode("utf-8", "replace") if isinstance(exc.stderr, bytes) else (exc.stderr or "")
                  return _TimeoutResult(cmd, timeout, out, err)

          def dl_file(prefix, filename):
              for d in sorted(os.listdir("dl")):
                  if d.startswith(prefix) and not (prefix == "team-plan-" and d.startswith("team-plan-v2")):
                      return os.path.join("dl", d, filename)
              raise FileNotFoundError(prefix + "/" + filename)

          plan = json.load(open(dl_file("team-plan-", "team-plan.json")))
          v2 = json.load(open(dl_file("team-plan-v2-", "team-plan-v2.json")))
          rerun = {p["id"]: p for p in v2["processes"]}

          os.makedirs("old_ev", exist_ok=True)
          ev_tar = [os.path.join("dl", d, "evidence.tar.gz") for d in os.listdir("dl") if d.startswith("team-evidence-")][0]
          run(["tar", "-xzf", ev_tar, "-C", "old_ev"])

          run(["git", "config", "user.name", "droid-team-prep"])
          run(["git", "config", "user.email", "droid-team-prep@localhost"])
          cand1_tip = run(["git", "rev-parse", "HEAD"]).stdout.strip()
          candidate2 = f"team/issue-{issue}/candidate-{run_id}-r2"
          run(["git", "checkout", "-b", candidate2])

          os.makedirs("evidence/packs", exist_ok=True)
          # v2.5: minimal manifest first (plans read, before any
          # replacement), overwritten by the full manifest at the end;
          # the always() round-2 prep report renders a "prep incomplete"
          # card from this one instead of crashing.
          json.dump({"issue": issue, "run_id": run_id, "iteration": 2,
                     "candidate_branch": candidate2, "pytest_exit": None,
                     "pytest_note": "", "packs": {}, "sha256": {}},
                    open("evidence/manifest.json", "w"), ensure_ascii=False, indent=2)
          packs = {}
          replaced_any = False
          for proc in plan["processes"]:
              pid = proc["id"]
              pack_dir = f"evidence/packs/{pid}"
              os.makedirs(pack_dir, exist_ok=True)
              if pid not in rerun:
                  old_pack = f"old_ev/packs/{pid}"
                  info = json.load(open("old_ev/manifest.json"))["packs"][pid]
                  if os.path.isdir(old_pack):
                      for name in os.listdir(old_pack):
                          open(os.path.join(pack_dir, name), "wb").write(open(os.path.join(old_pack, name), "rb").read())
                  packs[pid] = info
                  continue
              card = rerun[pid]
              json.dump(card, open(f"{pack_dir}/process-card.json", "w"), ensure_ascii=False, indent=2)
              branch = f"team/issue-{issue}/run-{run_id}/{pid}-r2"
              info = {"branch": branch, "branch_present": False, "merged": False, "merge_conflict": False}
              info["out_of_bounds"] = []
              exists = run(["git", "ls-remote", "--exit-code", "origin", branch]).returncode == 0
              if exists:
                  info["branch_present"] = True
                  run(["git", "fetch", "origin", branch])
                  def normp(p):
                      return os.path.normpath(str(p).strip())
                  allowed = {normp(f) for f in card["files"]}
                  allowed |= {f"team/handoffs/{pid}.md", f"team/status/{pid}.json",
                              f"team/status/{pid}.checks-failed.marker"}
                  full = run(["git", "diff", "--name-only", f"{cand1_tip}...origin/{branch}"])
                  extras = sorted({normp(p) for p in full.stdout.splitlines() if p.strip()} - allowed)
                  if extras:
                      info["out_of_bounds"] = extras
                      print(f"out-of-bounds files in {branch}: {extras}")
                  diff = run(["git", "diff", f"{cand1_tip}...origin/{branch}", "--"] + card["files"])
                  open(f"{pack_dir}/diff.patch", "w").write(diff.stdout)
                  # Whole-card replacement: files the round-1 card owned but
                  # the new card no longer claims must leave the candidate
                  # tree, or they leak into the PR as zombie files (低-2).
                  old_files = {normp(f) for f in proc["files"]}
                  new_files = {normp(f) for f in card["files"]}
                  to_delete = sorted(old_files - new_files)
                  for f in to_delete:
                      run(["git", "rm", "-q", "--ignore-unmatch", "--", f])
                  team_files = [f"team/handoffs/{pid}.md", f"team/status/{pid}.json"]
                  checkout = run(["git", "checkout", f"origin/{branch}", "--"] + card["files"] + team_files)
                  if checkout.returncode == 0:
                      stage_paths = [f for f in card["files"] + team_files if os.path.exists(f)]
                      run(["git", "add", "--"] + stage_paths)
                      staged = run(["git", "diff", "--cached", "--quiet"])
                      commit_ok = True
                      if staged.returncode != 0:
                          commit = run(["git", "commit", "-m", f"team prep2: replace {pid} with round 2 result"])
                          commit_ok = commit.returncode == 0
                      if commit_ok:
                          # merged := candidate tree matches the round-2
                          # branch on every card/team path and the deleted
                          # files are gone. A no-change replacement (round-2
                          # content identical to round 1) is a success, not
                          # a failure (中-6); a dirty staging area is reset.
                          tree_diff = run(["git", "diff", "--quiet", "HEAD", f"origin/{branch}", "--"] + card["files"] + team_files)
                          zombies = [f for f in to_delete
                                     if run(["git", "ls-files", "--", f]).stdout.strip()]
                          info["merged"] = tree_diff.returncode == 0 and not zombies
                          if not info["merged"]:
                              print(f"replacement verify failed for {pid}: tree_diff={tree_diff.returncode}, zombies={zombies}")
                      else:
                          print(f"replacement commit failed for {branch}")
                          run(["git", "reset", "--hard", "HEAD"])
                      replaced_any = replaced_any or info["merged"]
                  else:
                      print(f"replacement checkout failed for {branch}: {checkout.stderr}")
                      run(["git", "reset", "--hard", "HEAD"])
              packs[pid] = info

          pytest_available = True
          pytest_install_note = ""
          if direct(["python3", "-m", "pytest", "--version"],
                            capture_output=True, timeout=60).returncode != 0:
              print("pytest missing; installing deterministically (v2.1)")
              install_rc = direct(["python3", "-m", "pip", "install", "-q", "pytest"],
                                          timeout=PIP_TIMEOUT).returncode
              if install_rc != 0:
                  pytest_available = False
                  pytest_install_note = f"pytest install failed (pip exit {install_rc}); full test run not executed"
              elif direct(["python3", "-m", "pytest", "--version"],
                                  capture_output=True, timeout=60).returncode != 0:
                  pytest_available = False
                  pytest_install_note = "pytest still unavailable after install; full test run not executed"
          if pytest_available:
              try:
                  pytest_rc = subprocess.run(["python3", "-m", "pytest", "-q"],
                                             capture_output=True, text=True,
                                             timeout=PYTEST_FULL_TIMEOUT)
                  pytest_output = pytest_rc.stdout + pytest_rc.stderr
                  pytest_exit = pytest_rc.returncode
              except subprocess.TimeoutExpired as exc:
                  # v2.6.4 (E): a hung suite is a recorded failure (exit
                  # 124), not a silent stall until the job wall; the
                  # script still writes the evidence and the report.
                  out = exc.output.decode("utf-8", "replace") if isinstance(exc.output, bytes) else (exc.output or "")
                  err = exc.stderr.decode("utf-8", "replace") if isinstance(exc.stderr, bytes) else (exc.stderr or "")
                  pytest_output = out + err + f"\nTIMEOUT: full pytest run exceeded {PYTEST_FULL_TIMEOUT}s and was killed (v2.6.4)\n"
                  pytest_exit = 124
                  pytest_install_note = f"full pytest TIMEOUT after {PYTEST_FULL_TIMEOUT}s (killed); recorded as exit 124"
                  print(pytest_install_note)
          else:
              # Sentinel 127 (v2.4): pytest could not be installed. Evidence,
              # manifest and the prep report are still produced below; this
              # step exits non-zero only at the very end (failure on record).
              print(pytest_install_note)
              pytest_output = pytest_install_note + "\n"
              pytest_exit = 127
          open("evidence/pytest-output.txt", "w").write(pytest_output)
          open("evidence/pytest-exit.txt", "w").write(str(pytest_exit))
          print(f"full pytest exit (round 2): {pytest_exit}")

          def _focused_counts(card_out, checks):
              # I-4, scrutiny PR2-2b: a card's count is the count of THAT
              # card's focused check (its own file-level pytest run), never a
              # sum across the card's check commands — the card runs its
              # focused test AND the merged suite, and 18+240 must never be
              # reported as 258, a number corresponding to nothing. The last
              # summary line of the FIRST check (the focused one) wins.
              focused = (card_out.split("$ ", 2)[1] if card_out.count("$ ") else card_out) or ""
              return {"passed": _count_passed(focused), "skipped": _count_skipped(focused)}

          for proc in plan["processes"]:
              pid = proc["id"]
              if pid not in rerun:
                  continue
              card = rerun[pid]
              pack_dir = f"evidence/packs/{pid}"
              info = packs[pid]
              for src, dst in ((f"team/handoffs/{pid}.md", "handoff.md"),
                               (f"team/status/{pid}.json", "status.json")):
                  if info["merged"] and os.path.exists(src):
                      open(f"{pack_dir}/{dst}", "w").write(open(src).read())
              # v2.6.3 (review fix): same marker handling as round 1, but
              # the replacement above checks out only card + team files, so
              # the round-2 marker never enters this tree; read it straight
              # from the worker branch into the pack instead. Also NOT a key
              # of info["pack"]: "complete" keeps its original meaning.
              info["checks_failed_marker"] = False
              if info["merged"]:
                  branch = f"team/issue-{issue}/run-{run_id}/{pid}-r2"
                  shown = run(["git", "show", f"origin/{branch}:team/status/{pid}.checks-failed.marker"])
                  if shown.returncode == 0:
                      open(f"{pack_dir}/checks-failed.marker", "w").write(shown.stdout)
                      info["checks_failed_marker"] = True
              exits, out_lines = [], []
              if info["merged"] and not pytest_available:
                  out_lines.append("pytest unavailable (install failed); process checks not run, recorded as exit 127")
                  for cmd in card["checks"]:
                      out_lines.append(f"$ {cmd}\n[exit 127] pytest unavailable: install failed")
                      exits.append({"command": cmd, "exit": 127})
              elif info["merged"]:
                  for cmd in card["checks"]:
                      try:
                          r = subprocess.run(cmd, shell=True, capture_output=True, text=True,
                                             timeout=CHECK_TIMEOUT)
                          out_lines.append(f"$ {cmd}\n{r.stdout}{r.stderr}\n[exit {r.returncode}]")
                          exits.append({"command": cmd, "exit": r.returncode})
                      except subprocess.TimeoutExpired as exc:
                          # v2.6.4 (E): record the timeout as exit 124
                          # and keep running the remaining checks. With
                          # shell=True the timeout kills the shell;
                          # orphaned grandchildren are reaped when the
                          # job ends and no longer block the evidence.
                          out = exc.output.decode("utf-8", "replace") if isinstance(exc.output, bytes) else (exc.output or "")
                          err = exc.stderr.decode("utf-8", "replace") if isinstance(exc.stderr, bytes) else (exc.stderr or "")
                          out_lines.append(f"$ {cmd}\n{out}{err}\n[exit 124] TIMEOUT after {CHECK_TIMEOUT}s (killed)")
                          exits.append({"command": cmd, "exit": 124})
              else:
                  out_lines.append("round 2 branch not applied; process checks not run by prep2")
              open(f"{pack_dir}/checks-output.txt", "w").write("\n".join(out_lines))
              json.dump(exits, open(f"{pack_dir}/checks-exit.json", "w"), indent=2)
              info["pack"] = {"process_card": True,
                              "handoff": os.path.exists(f"{pack_dir}/handoff.md"),
                              "status": os.path.exists(f"{pack_dir}/status.json"),
                              "diff": os.path.exists(f"{pack_dir}/diff.patch"),
                              "checks_output": True}
              info["complete"] = all(info["pack"].values()) and info["merged"] and not info.get("out_of_bounds")

          # I-4 (round54-root-cure): check-summary.json is the authoritative
          # count (round 2) — per-card counts from the focused check, written
          # AFTER the per-card checks loop (scrutiny PR2-2) and BEFORE the
          # manifest hashes the tree so the sha covers it. Worker status
          # files stay untouched (evidence immutability).
          per_card = {}
          for proc in plan["processes"]:
              pid = proc["id"]
              out_path = f"evidence/packs/{pid}/checks-output.txt"
              card_out = open(out_path).read() if os.path.exists(out_path) else ""
              per_card[pid] = _focused_counts(card_out, proc["checks"])
          totals = {"passed": _count_passed(pytest_output), "skipped": _count_skipped(pytest_output)}
          json.dump({"schema_version": "check-summary.v1",
                     "per_card": per_card, "totals": totals},
                    open("evidence/check-summary.json", "w"), indent=2)
          print("check-summary (round 2):", json.dumps(totals))

          effective_plan = dict(plan)
          effective_plan["processes"] = [rerun.get(p["id"], p) for p in plan["processes"]]
          effective_plan["plan_version"] = 2
          json.dump(effective_plan, open("evidence/plan.json", "w"), ensure_ascii=False, indent=2)
          open("evidence/candidate-branch.txt", "w").write(candidate2)

          manifest = {"issue": issue, "run_id": run_id, "iteration": 2,
                      "candidate_branch": candidate2,
                      "pytest_exit": pytest_exit,
                      "pytest_note": pytest_install_note, "packs": packs, "sha256": {}}
          for root, _dirs, files in os.walk("evidence"):
              for name in files:
                  path = os.path.join(root, name)
                  if path == "evidence/manifest.json":
                      continue
                  manifest["sha256"][path] = hashlib.sha256(open(path, "rb").read()).hexdigest()
          json.dump(manifest, open("evidence/manifest.json", "w"), ensure_ascii=False, indent=2)

          manifest_sha = hashlib.sha256(open("evidence/manifest.json", "rb").read()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"candidate_branch={candidate2}\n")
              out.write(f"manifest_sha256={manifest_sha}\n")
          print("manifest sha256 (round 2):", manifest_sha)
          # v2.6.3 (review fix): markers are evidence, not deliverables.
          # Round-2 markers never enter this tree (see the pack loop), but
          # a marker inherited from the round-1 candidate is stripped here
          # too, so none can ride the PR into the default branch.
          tracked = run(["git", "ls-files", "--", "team/status"]).stdout.split()
          markers = [p for p in tracked if p.endswith(".checks-failed.marker")]
          for p in markers:
              run(["git", "rm", "-q", "--", p])
          if markers:
              strip = run(["git", "commit", "-m", "team prep2: strip checks-failed markers from candidate tree (kept in evidence packs)"])
              if strip.returncode != 0:
                  print("marker strip commit failed:", strip.stdout, strip.stderr)
                  sys.exit(1)
              print("stripped checks-failed markers from candidate tree:", markers)
          push = run(["git", "push", "-u", "origin", candidate2])
          if push.returncode != 0:
              print("candidate2 push failed:", push.stdout, push.stderr)
              sys.exit(1)
          if not pytest_available:
              print("prep2 finishing as failure: pytest install failed (evidence and manifest already written)")
              sys.exit(1)
          PY

      - name: Upload evidence round 2 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-evidence2-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: evidence.tar.gz
          overwrite: true

      - name: Post prep round 2 report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PLAN_ISSUE_NUMBER: ${{ needs.lead.outputs.plan_issue_number }}
        run: |
          python3 - <<'PY'
          import json, os
          manifest_missing = not os.path.exists("evidence/manifest.json")
          if manifest_missing:
              print("evidence/manifest.json missing (prep2 script died early); posting fallback report")
              manifest = {"candidate_branch": "", "pytest_exit": None, "pytest_note": "", "packs": {}}
          else:
              manifest = json.load(open("evidence/manifest.json"))
          packs = manifest.get("packs") or {}
          lines = ["## 备料报告（第 2 轮，脚本 job）", "",
                   f"候选分支：`{manifest.get('candidate_branch') or '（无）'}`",
                   f"全量 pytest 退出码：{manifest.get('pytest_exit')}", "",
                   "| 工序 | 料齐 | 缺件 |", "|---|---|---|"]
          if manifest.get("pytest_note"):
              note_tail = "" if "TIMEOUT" in manifest["pytest_note"] else "（退出码 127 为安装失败哨兵，全量测试未执行）"
              lines.insert(4, f"⚠ pytest 环境：{manifest['pytest_note']}{note_tail}")
          if not packs:
              lines.append("| — | 否 | 备料未完成（第 2 轮备料脚本未产出清单，脚本早段失败） |" if manifest_missing else "| — | 否 | 备料未完成（第 2 轮备料脚本未跑完，仅有最小清单） |")
          for pid, info in packs.items():
              info = info or {}
              missing = [k for k, v in (info.get("pack") or {}).items() if not v]
              if not info.get("merged"):
                  missing.append("未合并/未替换")
              if info.get("out_of_bounds"):
                  missing.append("越界文件：" + ", ".join(info["out_of_bounds"]))
              lines.append(f"| `{pid}` | {'是' if info.get('complete') else '否'} | {', '.join(missing) if missing else '—'} |")
          lines += ["", "重派工序以第 2 轮分支整卡替换第 1 轮成果；未重派工序沿用第 1 轮证据包。料不齐不予验收。"]
          open("prep2-comment.md", "w").write("\n".join(lines))
          print("\n".join(lines))
          PY
          PYTHONPATH=scripts/team python3 scripts/team/post_comment_hard.py \
            --issue "$ISSUE_NUMBER" --body-file prep2-comment.md --hard-required
          if [ -n "${PLAN_ISSUE_NUMBER:-}" ]; then
            PYTHONPATH=scripts/team python3 scripts/team/post_comment_hard.py \
              --issue "$PLAN_ISSUE_NUMBER" --body-file prep2-comment.md --hard-required
          fi

      - name: Patch ForemanRun (prep2)
        if: always()
        run: |
          if [ ! -f wall-in/foreman-run.json ]; then
            echo "foreman-run missing in prep2 patch"
            exit 1
          fi
          cp wall-in/foreman-run.json foreman-run.json
          PREP2_RESULT="${{ steps.prep2.outcome == 'success' && 'success' || 'failure' }}"
          PRODUCED="false"
          if [ -f evidence/manifest.json ]; then PRODUCED="true"; fi
          PYTHONPATH=scripts/team python3 scripts/team/wall_sync_job.py \
            --job prep2 --result "$PREP2_RESULT" --produced "$PRODUCED"

      - name: Upload foreman-run wall artifact (prep2)
        if: always() && hashFiles('foreman-run.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: foreman-run.json
          overwrite: true

  validate2:
    name: validator round 2 (squad-leader style, evidence only)
    needs: prep2
    if: ${{ !cancelled() && needs.prep2.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      EXPECTED_MANIFEST_SHA: ${{ needs.prep2.outputs.manifest_sha256 }}
    outputs:
      overall: ${{ steps.adopt2.outputs.overall }}
      failed_processes: ${{ steps.adopt2.outputs.failed_processes }}
      flips: ${{ steps.adopt2.outputs.flips }}
      should_revalidate: ${{ steps.replan_gate2.outputs.should_revalidate }}
      validate2_job_conclusion: ${{ steps.validate2_conclusion.outputs.validate_job_conclusion }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ForemanRun wall (W1)
        uses: actions/download-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: wall-in

      - name: Download evidence round 2 artifact
        uses: actions/download-artifact@v4
        with:
          name: team-evidence2-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}

      - name: Download round 1 verdict (flip accounting)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: team-verdict-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: round1

      - name: Extract and precheck evidence packs
        id: pre
        timeout-minutes: 2
        run: |
          mkdir -p work
          tar -xzf evidence.tar.gz -C work
          python3 - <<'PY'
          import hashlib, json, os, sys
          expected_sha = os.environ.get("EXPECTED_MANIFEST_SHA", "")
          actual_sha = hashlib.sha256(open("work/manifest.json", "rb").read()).hexdigest()
          if not expected_sha or actual_sha != expected_sha:
              print(f"manifest sha256 mismatch: expected {expected_sha!r}, actual {actual_sha}; refusing to judge")
              sys.exit(1)
          print("manifest sha256 verified against prep output:", actual_sha)
          manifest = json.load(open("work/manifest.json"))
          bad = []
          for path, digest in manifest["sha256"].items():
              local = "work/" + path[len("evidence/"):] if path.startswith("evidence/") else path
              if not os.path.exists(local) or hashlib.sha256(open(local, "rb").read()).hexdigest() != digest:
                  bad.append(path)
          if bad:
              print("evidence integrity check failed:", bad)
              sys.exit(1)
          judgeable, blocked = [], {}
          for pid, info in manifest["packs"].items():
              if info["complete"]:
                  judgeable.append(pid)
              else:
                  missing = [k for k, v in info["pack"].items() if not v]
                  if not info["merged"]:
                      missing.append("未合并/未替换")
                  if info.get("out_of_bounds"):
                      missing.append("越界文件：" + ", ".join(info["out_of_bounds"]))
                  blocked[pid] = missing
          json.dump(judgeable, open("work/judgeable.json", "w"))
          json.dump(blocked, open("work/blocked.json", "w"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("judgeable=" + json.dumps(judgeable) + "\n")
          print("judgeable:", judgeable, "| blocked （料不齐）:", blocked)
          PY

      - name: Install droid CLI
        if: steps.pre.outputs.judgeable != '[]'
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Write BYOM settings (validator round 2 session)
        if: steps.pre.outputs.judgeable != '[]'
        env:
          WORKER_CI_KEY: ${{ secrets.WORKER_CI_KEY }}
          GO_GITHUB_RUN_TOKEN: ${{ secrets.GO_GITHUB_RUN_TOKEN }}
          GW_TOKEN_KNOWN: ${{ secrets.GW_TOKEN_KNOWN }}
          SESSION_NAME: team-validator-r2
        run: |
          mkdir -p ~/.factory
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.factory/settings.json")
          s = {}
          if os.path.exists(p):
              s = json.load(open(p))
          headers = {
              "x-ci-key": os.environ.get("WORKER_CI_KEY", ""),
              "x-opencode-session": os.environ.get("SESSION_NAME", "team-validator"),
              "cf-aig-authorization": "Bearer " + os.environ.get("GW_TOKEN_KNOWN", ""),
          }
          s["customModels"] = [{
              "model": "dynamic/droid-review",
              "id": "custom:DeepSeek-V4.1-Flash-Go",
              "baseUrl": "https://droid-test.lumivane.dpdns.org",
              "apiKey": os.environ.get("GO_GITHUB_RUN_TOKEN", ""),
              "provider": "generic-chat-completion-api",
              "extraHeaders": headers,
          }]
          json.dump(s, open(p, "w"), indent=2)
          print("settings written for validator round 2 session")
          PY

      - name: Validator judges evidence packs only (round 2)
        id: droid_validate2
        if: steps.pre.outputs.judgeable != '[]'
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          ISSUE_TITLE: ${{ github.event.issue.title }}
          VALIDATOR_DROID_TIMEOUT_SECONDS: ${{ vars.VALIDATOR_DROID_TIMEOUT_SECONDS || '600' }}
        working-directory: work
        run: |
          set -o pipefail
          export REPO_ROOT="${GITHUB_WORKSPACE}"
          export PYTHONPATH="${REPO_ROOT}/scripts/team"
          TEAM_PY="${REPO_ROOT}/scripts/team"
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, os.path.join(os.environ["REPO_ROOT"], "scripts", "team"))
          from validator_prompt_template import build_validator_prompt
          judgeable = json.load(open("judgeable.json"))
          prompt = build_validator_prompt(judgeable, round_num=2)
          open("validator-prompt.txt", "w").write(prompt)
          PY
          cp ../wall-in/foreman-run.json ../foreman-run.json
          OVERRIDE_ARGS=""
          if [[ "$ISSUE_TITLE" == "[I8] API墙活验 A 采认失败" ]] || [[ "$ISSUE_TITLE" == "[I8] API墙活验 D 半套artifact" ]]; then
            OVERRIDE_ARGS="--droid-wall-override-sec ${VALIDATOR_DROID_TIMEOUT_SECONDS:-600}"
          fi
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from budget_resolve import validator_session_budget
          w = json.load(open("../foreman-run.json"))
          droid, adopt = validator_session_budget(w)
          print(f"VALIDATOR_DROID_WALL_SEC={droid}")
          print(f"ADOPT_RESERVE_SEC={adopt}")
          PY
          echo "validator session budget (wall): droid=${VALIDATOR_DROID_WALL_SEC}s adopt_reserve=${ADOPT_RESERVE_SEC}s (I8-A/D may override droid wall only)"
          FOREMAN_RUN_PATCH=1 python3 "${TEAM_PY}/run_droid_session.py" \
            --wall ../foreman-run.json --role validator \
            --prompt-file validator-prompt.txt \
            --stream-out validator-stream.jsonl \
            --exit-out droid-exit.txt \
            $OVERRIDE_ARGS
          cp ../foreman-run.json ../wall-in/foreman-run.json

      - name: Upload validator droid stream round 2 (W-13)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droid-stream-validator2-run-${{ github.run_id }}
          path: |
            work/validator-stream.jsonl
            work/verdict-partial.json
          if-no-files-found: warn

      - name: Merge verdict, enforce gates, verify evidence untouched
        id: verdict
        if: always()
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys
          sys.path.insert(0, os.path.join(os.environ.get("GITHUB_WORKSPACE", "."), "scripts", "team"))
          from salvage_assemble import assemble_assembled_draft
          expected_sha = os.environ.get("EXPECTED_MANIFEST_SHA", "")
          actual_sha = hashlib.sha256(open("work/manifest.json", "rb").read()).hexdigest()
          if not expected_sha or actual_sha != expected_sha:
              print(f"manifest sha256 changed since precheck: expected {expected_sha!r}, actual {actual_sha}; verdict refused")
              sys.exit(1)
          manifest = json.load(open("work/manifest.json"))
          plan = json.load(open("work/plan.json"))
          judgeable = json.load(open("work/judgeable.json")) if os.path.exists("work/judgeable.json") else []
          blocked = json.load(open("work/blocked.json")) if os.path.exists("work/blocked.json") else {}
          # I-6: no live draft (the usual exit-124 shape) but a sealed full
          # partial on disk -> the machine assembles the draft and the merge
          # proceeds on it (round-2 flavor: adopt2 reads the same file).
          if judgeable and not os.path.exists("work/verdict-droid.json"):
              assembled = assemble_assembled_draft(__import__("pathlib").Path("work"), judgeable)
              if assembled is not None:
                  open("work/verdict-droid.json", "w").write(json.dumps(assembled, ensure_ascii=False, indent=2))
                  print("draft machine-assembled from sealed verdict-partial.json (full judgeable coverage)")

          for path, digest in manifest["sha256"].items():
              local = "work/" + path[len("evidence/"):] if path.startswith("evidence/") else path
              if not os.path.exists(local) or hashlib.sha256(open(local, "rb").read()).hexdigest() != digest:
                  print("validator modified evidence:", path)
                  sys.exit(1)

          verdicts = {}
          if judgeable and os.path.exists("work/verdict-droid.json"):
              droid = json.load(open("work/verdict-droid.json"))
              entries = droid.get("processes", [])
              if sorted(p.get("id") for p in entries) != sorted(judgeable):
                  print(f"verdict coverage mismatch (multiset): judged {sorted(p.get('id') for p in entries)}, expected {sorted(judgeable)}")
                  sys.exit(1)
              got = {p["id"]: p for p in entries}
              for pid, entry in got.items():
                  if entry.get("verdict") not in ("pass", "fail"):
                      print("invalid verdict value:", entry)
                      sys.exit(1)
                  verdicts[pid] = {"id": pid, "verdict": entry["verdict"],
                                   "reason": entry.get("reason", "")}
          for pid, missing in blocked.items():
              verdicts[pid] = {"id": pid, "verdict": "blocked",
                               "reason": "料不齐（没料不验收）：缺 " + ", ".join(missing) + "（缺件归该工序补齐）"}

          expected_ids = sorted(p["id"] for p in plan["processes"])
          if sorted(verdicts) != expected_ids:
              # I-6 (round 2): same defang as round 1 — fill the missing
              # processes as blocked and let adopt2 classify (the assembled
              # path already ran above; a mismatch now means no source at
              # all). The old immediate exit-1 killed round-54 A/C at L497.
              print(f"final coverage mismatch (multiset): {sorted(verdicts)} vs {expected_ids}; routing through adopt classification")
              for pid in sorted(set(expected_ids) - set(verdicts)):
                  verdicts[pid] = {"id": pid, "verdict": "blocked",
                                   "reason": "validator 会话未产出该工序判定（机器组装无源，走重验链）"}
          # v2.6.4 (C): carry the validator's escalated conflicts into the
          # verdict as a top-level array. Entries are shape-checked loosely
          # on purpose: a malformed optional entry is dropped with a warning
          # instead of failing the whole validation job (unlike the strict
          # processes coverage check above).
          conflicts = []
          if judgeable and os.path.exists("work/verdict-droid.json"):
              droid = json.load(open("work/verdict-droid.json"))
              for centry in droid.get("conflicts") or []:
                  if isinstance(centry, dict) and centry.get("process") and centry.get("summary"):
                      conflicts.append({"process": centry["process"],
                                        "summary": centry["summary"],
                                        "evidence": centry.get("evidence", "")})
                  else:
                      print("dropping malformed conflicts entry:", centry)

          pytest_exit = manifest.get("pytest_exit", 1)
          overall = "pass" if all(v["verdict"] == "pass" for v in verdicts.values()) and pytest_exit == 0 else "fail"
          failed = [pid for pid, v in verdicts.items() if v["verdict"] != "pass"]
          # v2.6.4 (D): flip accounting — a process judged pass in round
          # 1 but not pass now (fail or blocked) is a flip. Round 2 is
          # the last round (the 2/2 limit is the workflow graph itself),
          # so a flip cannot be re-dispatched; it must at least be
          # visible: recorded in verdict2, exposed as a job output, and
          # named by assemble on the close-out card. A missing or
          # unreadable round-1 verdict means no flips, never a crash.
          flips = []
          if os.path.exists("round1/verdict.json"):
              try:
                  r1 = {p["id"]: p for p in json.load(open("round1/verdict.json")).get("processes", [])}
              except Exception as exc:
                  print(f"round-1 verdict unreadable ({exc}); flip accounting skipped")
                  r1 = {}
              for pid, v in verdicts.items():
                  prev = r1.get(pid)
                  if prev and prev.get("verdict") == "pass" and v["verdict"] != "pass":
                      flips.append({"id": pid,
                                    "round1_verdict": prev["verdict"],
                                    "round1_reason": prev.get("reason", ""),
                                    "round2_verdict": v["verdict"],
                                    "round2_reason": v.get("reason", "")})
          else:
              print("round-1 verdict artifact not present; flip accounting skipped")
          verdict = {"overall": overall, "pytest_exit": pytest_exit,
                     "iteration": manifest.get("iteration", 2),
                     "processes": [verdicts[p["id"]] for p in plan["processes"]],
                     "conflicts": conflicts,
                     "flips": flips}
          json.dump(verdict, open("verdict.json", "w"), ensure_ascii=False, indent=2)

          lines = []
          if os.path.exists("work/verdict-droid.md"):
              lines.append(open("work/verdict-droid.md").read())
          lines += ["", "## 机器闸与缺料判定（脚本）", "",
                    f"全量 pytest 退出码：{pytest_exit}（非 0 时 overall 强制 fail）"]
          for pid, missing in blocked.items():
              lines.append(f"- `{pid}`：blocked — 料不齐，缺 {', '.join(missing)}（缺件归该工序补齐）")
          for fl in flips:
              lines.append(f"⚠ 翻案：`{fl['id']}` 第 1 轮 pass → 第 2 轮 {fl['round2_verdict']}（一轮理由：{fl['round1_reason']}；二轮理由：{fl['round2_reason']}）")
          if conflicts:
              lines += ["", "## 工单层冲突（验收员升级记录）", ""]
              for c in conflicts:
                  lines.append(f"- `{c['process']}`：{c['summary']}（证据：{c.get('evidence', '')}）")
          lines += ["", f"总判定：**{overall}**"]
          open("verdict.md", "w").write("\n".join(lines))

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"overall={overall}\n")
              out.write("failed_processes=" + json.dumps(failed) + "\n")
              out.write("flips=" + json.dumps(flips, ensure_ascii=False) + "\n")
          print("overall:", overall, "| failed:", failed, "| flips:", [f["id"] for f in flips])
          PY

      - name: Adopt verdict into ForemanRun wall round 2 (P0-1)
        id: adopt2
        if: always()
        run: |
          if [ ! -f foreman-run.json ]; then
            if [ ! -f wall-in/foreman-run.json ]; then
              echo "foreman-run missing before adopt2"
              exit 1
            fi
            cp wall-in/foreman-run.json foreman-run.json
          fi
          DROID_EXIT=-1
          [ -f work/droid-exit.txt ] && DROID_EXIT=$(cat work/droid-exit.txt)
          MERGE_FLAG=""
          [ -f verdict.json ] && MERGE_FLAG="--merge-step-ran"
          ROUND1=""
          [ -f round1/verdict.json ] && ROUND1="--round1-verdict round1/verdict.json"
          FOREMAN_RUN_PATCH=1 PYTHONPATH=scripts/team python3 scripts/team/run_adopt_step.py \
            --wall foreman-run.json --work-dir work --droid-exit "$DROID_EXIT" \
            --round 2 --github-output "$GITHUB_OUTPUT" $MERGE_FLAG $ROUND1
        env:
          PYTHONPATH: scripts/team

      - name: Recompute replan gate from final verdict (52C)
        if: always()
        id: replan_gate2
        run: |
          # The 2/2 cap makes this the terminal gate: overwrite any stale
          # round-1 should_replan still on the wall (round-52 C carried a
          # leftover true through a clean round 2).
          PYTHONPATH=scripts/team python3 scripts/team/compute_replan_gate.py \
            --wall foreman-run.json --round 2

      - name: Derive validate2 job conclusion (W4)
        id: validate2_conclusion
        if: always()
        run: |
          PYTHONPATH=scripts/team python3 scripts/team/compute_validate_conclusion.py \
            --wall foreman-run.json --round 2 --github-output "$GITHUB_OUTPUT"

      - name: Sync validate2 chain seat from wall (W4 / W-11)
        if: always()
        run: |
          PYTHONPATH=scripts/team python3 scripts/team/wall_sync_job.py \
            --job validate2 \
            --result "$(python3 -c "import json;print(json.load(open('foreman-run.json'))['validation'].get('job_conclusion_derived','failure'))")" \
            --produced "$(python3 -c "import json;a=json.load(open('foreman-run.json'))['artifacts'];k='team-verdict2-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}';print('true' if a.get(k,{}).get('complete') else 'false')")"

      - name: Assert verdict round 2 artifact complete (B2)
        id: assert_verdict2
        if: always()
        run: |
          PYTHONPATH=scripts/team python3 scripts/team/assert_artifact_complete.py \
            --wall foreman-run.json \
            --name team-verdict2-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}

      - name: Upload verdict round 2 artifact
        if: steps.assert_verdict2.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: team-verdict2-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: |
            verdict.json
            verdict.md
          overwrite: true

      - name: Upload foreman-run wall artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: foreman-run.json
          overwrite: true

      - name: Fail validate2 job when adoption failed (W6)
        if: always()
        run: |
          PYTHONPATH=scripts/team python3 scripts/team/compute_validate_conclusion.py --wall foreman-run.json --round 2

  revalidate2:
    name: validator revalidate round 2 (single retry, evidence pack reused)
    needs: [validate2, prep2]
    if: ${{ !cancelled() && needs.validate2.outputs.should_revalidate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      EXPECTED_MANIFEST_SHA: ${{ needs.prep2.outputs.manifest_sha256 }}
    outputs:
      overall: ${{ steps.adopt2.outputs.overall }}
      failed_processes: ${{ steps.adopt2.outputs.failed_processes }}
      flips: ${{ steps.adopt2.outputs.flips }}
      validate2_job_conclusion: ${{ steps.validate2_conclusion.outputs.validate_job_conclusion }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ForemanRun wall (W1)
        uses: actions/download-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: wall-in

      - name: Refuse a second revalidate, stamp this run started (at most one, fail-closed)
        run: |
          if [ ! -f wall-in/foreman-run.json ]; then
            echo "foreman-run missing before revalidate2 guard"
            exit 1
          fi
          STARTED=$(python3 -c "import json;g=json.load(open('wall-in/foreman-run.json')).get('replan_gate') or {};print('true' if g.get('revalidate_run_started') else 'false')")
          if [ "$STARTED" = "true" ]; then
            echo "revalidate already ran once; refusing to run again (fail-closed)"
            exit 1
          fi
          # The attempt marker is stamped when the retry session actually
          # starts (not when adopt requested it): a first-timeout wall never
          # talks its own one legitimate retry out of running.
          python3 -c "
          import json
          w = json.load(open('wall-in/foreman-run.json'))
          g = w.get('replan_gate') or {}
          g['revalidate_run_started'] = True
          w['replan_gate'] = g
          json.dump(w, open('wall-in/foreman-run.json', 'w'), ensure_ascii=False, indent=2)
          "
          echo "first revalidate attempt: run-start marker stamped, proceeding"

      - name: Download evidence round 2 artifact (same pack, sha unchanged)
        uses: actions/download-artifact@v4
        with:
          name: team-evidence2-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}

      - name: Download round 1 verdict (flip accounting)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: team-verdict-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: round1

      - name: Extract evidence and keep verdict inputs
        timeout-minutes: 2
        run: |
          mkdir -p work
          tar -xzf evidence.tar.gz -C work
          python3 - <<'PY'
          import hashlib, json, os, sys
          expected_sha = os.environ.get("EXPECTED_MANIFEST_SHA", "")
          actual_sha = hashlib.sha256(open("work/manifest.json", "rb").read()).hexdigest()
          if not expected_sha or actual_sha != expected_sha:
              print(f"manifest sha256 mismatch: expected {expected_sha!r}, actual {actual_sha}; refusing to judge")
              sys.exit(1)
          print("manifest sha256 verified against prep2 output:", actual_sha)
          manifest = json.load(open("work/manifest.json"))
          bad = []
          for path, digest in manifest["sha256"].items():
              local = "work/" + path[len("evidence/"):] if path.startswith("evidence/") else path
              if not os.path.exists(local) or hashlib.sha256(open(local, "rb").read()).hexdigest() != digest:
                  bad.append(path)
          if bad:
              print("evidence integrity check failed:", bad)
              sys.exit(1)
          judgeable, blocked = [], {}
          for pid, info in manifest["packs"].items():
              if info["complete"]:
                  judgeable.append(pid)
              else:
                  missing = [k for k, v in info["pack"].items() if not v]
                  if not info["merged"]:
                      missing.append("未合并/未替换")
                  if info.get("out_of_bounds"):
                      missing.append("越界文件：" + ", ".join(info["out_of_bounds"]))
                  blocked[pid] = missing
          json.dump(judgeable, open("work/judgeable.json", "w"))
          json.dump(blocked, open("work/blocked.json", "w"))
          print("revalidate judgeable:", judgeable, "| blocked:", blocked)
          PY

      - name: Install droid CLI
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Write BYOM settings (validator revalidate round 2 session)
        env:
          WORKER_CI_KEY: ${{ secrets.WORKER_CI_KEY }}
          GO_GITHUB_RUN_TOKEN: ${{ secrets.GO_GITHUB_RUN_TOKEN }}
          GW_TOKEN_KNOWN: ${{ secrets.GW_TOKEN_KNOWN }}
          SESSION_NAME: team-validator-r2
        run: |
          mkdir -p ~/.factory
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.factory/settings.json")
          s = {}
          if os.path.exists(p):
              s = json.load(open(p))
          headers = {
              "x-ci-key": os.environ.get("WORKER_CI_KEY", ""),
              "x-opencode-session": os.environ.get("SESSION_NAME", "team-validator"),
              "cf-aig-authorization": "Bearer " + os.environ.get("GW_TOKEN_KNOWN", ""),
          }
          s["customModels"] = [{
              "model": "dynamic/droid-review",
              "id": "custom:DeepSeek-V4.1-Flash-Go",
              "baseUrl": "https://droid-test.lumivane.dpdns.org",
              "apiKey": os.environ.get("GO_GITHUB_RUN_TOKEN", ""),
              "provider": "generic-chat-completion-api",
              "extraHeaders": headers,
          }]
          json.dump(s, open(p, "w"), indent=2)
          print("settings written for validator revalidate round 2 session")
          PY

      - name: Validator judges evidence packs only (revalidate round 2)
        id: droid_validate2
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          ISSUE_TITLE: ${{ github.event.issue.title }}
          VALIDATOR_DROID_TIMEOUT_SECONDS: ${{ vars.VALIDATOR_DROID_TIMEOUT_SECONDS || '600' }}
        working-directory: work
        run: |
          set -o pipefail
          export REPO_ROOT="${GITHUB_WORKSPACE}"
          export PYTHONPATH="${REPO_ROOT}/scripts/team"
          TEAM_PY="${REPO_ROOT}/scripts/team"
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, os.path.join(os.environ["REPO_ROOT"], "scripts", "team"))
          from validator_prompt_template import build_validator_prompt
          judgeable = json.load(open("judgeable.json"))
          prompt = build_validator_prompt(judgeable, round_num=2)
          open("validator-prompt.txt", "w").write(prompt)
          PY
          cp ../wall-in/foreman-run.json ../foreman-run.json
          OVERRIDE_ARGS=""
          if [[ "$ISSUE_TITLE" == "[I8] API墙活验 A 采认失败" ]] || [[ "$ISSUE_TITLE" == "[I8] API墙活验 D 半套artifact" ]]; then
            OVERRIDE_ARGS="--droid-wall-override-sec ${VALIDATOR_DROID_TIMEOUT_SECONDS:-600}"
          fi
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from budget_resolve import validator_session_budget
          w = json.load(open("../foreman-run.json"))
          droid, adopt = validator_session_budget(w)
          print(f"VALIDATOR_DROID_WALL_SEC={droid}")
          print(f"ADOPT_RESERVE_SEC={adopt}")
          PY
          echo "revalidate session budget (wall): droid=${VALIDATOR_DROID_WALL_SEC}s adopt_reserve=${ADOPT_RESERVE_SEC}s"
          FOREMAN_RUN_PATCH=1 python3 "${TEAM_PY}/run_droid_session.py" \
            --wall ../foreman-run.json --role validator \
            --prompt-file validator-prompt.txt \
            --stream-out validator-stream.jsonl \
            --exit-out droid-exit.txt \
            $OVERRIDE_ARGS
          cp ../foreman-run.json ../wall-in/foreman-run.json

      - name: Merge verdict, enforce gates, verify evidence untouched (round 2)
        id: verdict
        if: always()
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys
          sys.path.insert(0, os.path.join(os.environ.get("GITHUB_WORKSPACE", "."), "scripts", "team"))
          from salvage_assemble import assemble_assembled_draft
          expected_sha = os.environ.get("EXPECTED_MANIFEST_SHA", "")
          actual_sha = hashlib.sha256(open("work/manifest.json", "rb").read()).hexdigest()
          if not expected_sha or actual_sha != expected_sha:
              print(f"manifest sha256 changed since precheck: expected {expected_sha!r}, actual {actual_sha}; verdict refused")
              sys.exit(1)
          manifest = json.load(open("work/manifest.json"))
          plan = json.load(open("work/plan.json"))
          judgeable = json.load(open("work/judgeable.json")) if os.path.exists("work/judgeable.json") else []
          blocked = json.load(open("work/blocked.json")) if os.path.exists("work/blocked.json") else {}
          merge_ran = bool(judgeable and os.path.exists("work/verdict-droid.json"))
          # I-6, same as the validate inline merge: no live draft but a sealed
          # full partial on disk -> the machine assembles the draft and the
          # merge proceeds on it.
          if judgeable and not merge_ran:
              assembled = assemble_assembled_draft(__import__("pathlib").Path("work"), judgeable)
              if assembled is not None:
                  open("work/verdict-droid.json", "w").write(json.dumps(assembled, ensure_ascii=False, indent=2))
                  merge_ran = True
                  print("draft machine-assembled from sealed verdict-partial.json (full judgeable coverage)")

          for path, digest in manifest["sha256"].items():
              local = "work/" + path[len("evidence/"):] if path.startswith("evidence/") else path
              if not os.path.exists(local) or hashlib.sha256(open(local, "rb").read()).hexdigest() != digest:
                  print("validator modified evidence:", path)
                  sys.exit(1)

          verdicts = {}
          if judgeable and os.path.exists("work/verdict-droid.json"):
              droid = json.load(open("work/verdict-droid.json"))
              entries = droid.get("processes", [])
              if sorted(p.get("id") for p in entries) != sorted(judgeable):
                  print(f"verdict coverage mismatch (multiset): judged {sorted(p.get("id") for p in entries)}, expected {sorted(judgeable)}")
                  sys.exit(1)
              got = {p["id"]: p for p in entries}
              for pid, entry in got.items():
                  if entry.get("verdict") not in ("pass", "fail"):
                      print("invalid verdict value:", entry)
                      sys.exit(1)
                  verdicts[pid] = {"id": pid, "verdict": entry["verdict"],
                                   "reason": entry.get("reason", "")}
          for pid, missing in blocked.items():
              verdicts[pid] = {"id": pid, "verdict": "blocked",
                               "reason": "料不齐（没料不验收）：缺 " + ", ".join(missing) + "（缺件归该工序补齐）"}

          expected_ids = sorted(p["id"] for p in plan["processes"])
          if sorted(verdicts) != expected_ids:
              # I-6: a mismatch here means the validator never judged and
              # never sealed a full partial — no merge artifacts to assemble.
              # Do NOT exit the step: fill the missing processes as blocked
              # and let the adopt library classify (draft_timeout ->
              # revalidate, fail-closed).
              print(f"final coverage mismatch (multiset): {sorted(verdicts)} vs {expected_ids}; routing through adopt classification")
              for pid in sorted(set(expected_ids) - set(verdicts)):
                  verdicts[pid] = {"id": pid, "verdict": "blocked",
                                   "reason": "validator 会话未产出该工序判定（机器组装无源，走重验链）"}
          conflicts = []
          if judgeable and os.path.exists("work/verdict-droid.json"):
              droid = json.load(open("work/verdict-droid.json"))
              for centry in droid.get("conflicts") or []:
                  if isinstance(centry, dict) and centry.get("process") and centry.get("summary"):
                      conflicts.append({"process": centry["process"],
                                        "summary": centry["summary"],
                                        "evidence": centry.get("evidence", "")})
                  else:
                      print("dropping malformed conflicts entry:", centry)

          pytest_exit = manifest.get("pytest_exit", 1)
          overall = "pass" if all(v["verdict"] == "pass" for v in verdicts.values()) and pytest_exit == 0 else "fail"
          failed = [pid for pid, v in verdicts.items() if v["verdict"] != "pass"]
          flips = []
          if os.path.exists("round1/verdict.json"):
              try:
                  r1 = {p["id"]: p for p in json.load(open("round1/verdict.json")).get("processes", [])}
              except Exception as exc:
                  print(f"round-1 verdict unreadable ({exc}); flip accounting skipped")
                  r1 = {}
              for pid, v in verdicts.items():
                  prev = r1.get(pid)
                  if prev and prev.get("verdict") == "pass" and v["verdict"] != "pass":
                      flips.append({"id": pid,
                                    "round1_verdict": prev["verdict"],
                                    "round1_reason": prev.get("reason", ""),
                                    "round2_verdict": v["verdict"],
                                    "round2_reason": v.get("reason", "")})
          else:
              print("round-1 verdict artifact not present; flip accounting skipped")
          verdict = {"overall": overall, "pytest_exit": pytest_exit,
                     "iteration": manifest.get("iteration", 2),
                     "processes": [verdicts[p["id"]] for p in plan["processes"]],
                     "conflicts": conflicts,
                     "flips": flips}
          json.dump(verdict, open("verdict.json", "w"), ensure_ascii=False, indent=2)

          lines = []
          if os.path.exists("work/verdict-droid.md"):
              lines.append(open("work/verdict-droid.md").read())
          lines += ["", "## 机器闸与缺料判定（脚本）", "",
                    f"全量 pytest 退出码：{pytest_exit}（非 0 时 overall 强制 fail）"]
          for pid, missing in blocked.items():
              lines.append(f"- `{pid}`：blocked — 料不齐，缺 {', '.join(missing)}（缺件归该工序补齐）")
          for fl in flips:
              lines.append(f"⚠ 翻案：`{fl['id']}` 第 1 轮 pass → 第 2 轮 {fl['round2_verdict']}（一轮理由：{fl['round1_reason']}；二轮理由：{fl['round2_reason']}）")
          if conflicts:
              lines += ["", "## 工单层冲突（验收员升级记录）", ""]
              for c in conflicts:
                  lines.append(f"- `{c['process']}`：{c['summary']}（证据：{c.get('evidence', '')}）")
          lines += ["", f"总判定：**{overall}**"]
          open("verdict.md", "w").write("\n".join(lines))

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"overall={overall}\n")
              out.write("failed_processes=" + json.dumps(failed) + "\n")
              out.write("flips=" + json.dumps(flips, ensure_ascii=False) + "\n")
          print("revalidate merge done | overall:", overall, "| failed:", failed, "| flips:", [f["id"] for f in flips])
          PY

      - name: Adopt verdict into ForemanRun wall round 2 (P0-1, revalidate)
        id: adopt2
        if: always()
        run: |
          if [ ! -f foreman-run.json ]; then
            if [ ! -f wall-in/foreman-run.json ]; then
              echo "foreman-run missing before revalidate2 adopt"
              exit 1
            fi
            cp wall-in/foreman-run.json foreman-run.json
          fi
          DROID_EXIT=-1
          [ -f work/droid-exit.txt ] && DROID_EXIT=$(cat work/droid-exit.txt)
          MERGE_FLAG=""
          [ -f verdict.json ] && MERGE_FLAG="--merge-step-ran"
          ROUND1=""
          [ -f round1/verdict.json ] && ROUND1="--round1-verdict round1/verdict.json"
          FOREMAN_RUN_PATCH=1 PYTHONPATH=scripts/team python3 scripts/team/run_adopt_step.py \
            --wall foreman-run.json --work-dir work --droid-exit "$DROID_EXIT" \
            --round 2 --github-output "$GITHUB_OUTPUT" $MERGE_FLAG $ROUND1
        env:
          PYTHONPATH: scripts/team

      - name: Recompute replan gate from final verdict (52C, revalidate)
        if: always()
        id: replan_gate2
        run: |
          PYTHONPATH=scripts/team python3 scripts/team/compute_replan_gate.py \
            --wall foreman-run.json --round 2

      - name: Derive validate2 job conclusion (W4, revalidate)
        id: validate2_conclusion
        if: always()
        run: |
          PYTHONPATH=scripts/team python3 scripts/team/compute_validate_conclusion.py \
            --wall foreman-run.json --round 2 --github-output "$GITHUB_OUTPUT"

      - name: Assert verdict round 2 artifact complete (B2, revalidate)
        id: assert_verdict2
        if: always()
        run: |
          PYTHONPATH=scripts/team python3 scripts/team/assert_artifact_complete.py \
            --wall foreman-run.json \
            --name team-verdict2-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}

      - name: Upload verdict round 2 artifact (revalidate)
        if: steps.assert_verdict2.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: team-verdict2-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: |
            verdict.json
            verdict.md
          overwrite: true

      - name: Upload foreman-run wall artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: foreman-run.json
          overwrite: true

      - name: Fail revalidate2 job when adoption failed (W6)
        if: always()
        run: |
          PYTHONPATH=scripts/team python3 scripts/team/compute_validate_conclusion.py --wall foreman-run.json --round 2

  assemble:
    name: assemble (final status card, close-out, PR)
    needs: [lead, worker, prep, validate, revalidate, replan, worker2, prep2, validate2, revalidate2]
    if: >-
      ${{ always() && needs.lead.result != 'skipped' &&
      needs.lead.outputs.duplicate != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: team-*-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: dl

      - name: Download ForemanRun wall
        uses: actions/download-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: wall-root

      - name: Pick final verdict and candidate
        id: pick
        run: |
          if [ ! -f wall-root/foreman-run.json ]; then
            echo "foreman-run missing in assemble"
            exit 1
          fi
          PYTHONPATH=scripts/team python3 scripts/team/pick_verdict_from_wall.py \
            --wall wall-root/foreman-run.json \
            --dl dl \
            --issue ${{ github.event.issue.number }} \
            --run-id ${{ github.run_id }} \
            --out final-verdict.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Write Projects board via PAT (P1-1)
        id: board_write
        env:
          PROJECTS_STATE_PAT: ${{ secrets.PROJECTS_STATE_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OVERALL: ${{ steps.pick.outputs.overall }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ ! -f wall-root/foreman-run.json ]; then
            echo "foreman-run missing before board write"
            exit 1
          fi
          cp wall-root/foreman-run.json foreman-run.json
          PYTHONPATH=scripts/team python3 scripts/team/project_state_write.py \
            --wall foreman-run.json --overall "$OVERALL" --issue "$ISSUE_NUMBER"

      - name: Post final status card, close out, attempt PR
        id: closeout
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PLAN_ISSUE_NUMBER: ${{ needs.lead.outputs.plan_issue_number }}
          CANDIDATE_BRANCH: ${{ steps.pick.outputs.candidate }}
          OVERALL: ${{ steps.pick.outputs.overall }}
          REPLAN_RESULT: ${{ needs.replan.result }}
          WORKER2_RESULT: ${{ needs.worker2.result }}
          PREP2_RESULT: ${{ needs.prep2.result }}
          VALIDATE2_RESULT: ${{ needs.validate2.result }}
          PICKED_ROUND: ${{ steps.pick.outputs.picked_round }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          def gh(*args, check=False):
              r = subprocess.run(["gh", *args], capture_output=True, text=True)
              if check and r.returncode != 0:
                  print("gh failed:", " ".join(args), r.stdout, r.stderr)
              return r

          issue_number = os.environ["ISSUE_NUMBER"]
          plan_number = os.environ["PLAN_ISSUE_NUMBER"]
          candidate = os.environ["CANDIDATE_BRANCH"]
          overall = os.environ["OVERALL"]
          replan_result = os.environ.get("REPLAN_RESULT", "")
          verdict = json.load(open("final-verdict.json"))

          def find_file(prefix, filename):
              if not os.path.isdir("dl"):
                  return None
              for d in sorted(os.listdir("dl")):
                  if d.startswith(prefix):
                      p = os.path.join("dl", d, filename)
                      if os.path.exists(p):
                          return p
              return None

          plan_path = find_file("team-plan-", "team-plan.json")
          plan = json.load(open(plan_path)) if plan_path else None
          subs = {p["id"]: p.get("sub_issue_number") for p in plan["processes"]} if plan else {}
          if plan is None:
              print("plan artifact missing; closing out with an empty sub-issue table")
          v2_path = find_file("team-plan-v2-", "team-plan-v2.json")
          if v2_path:
              v2 = json.load(open(v2_path))
              for p in v2.get("processes", []):
                  if p.get("sub_issue_number"):
                      subs[p["id"]] = p["sub_issue_number"]

          pr_text = "（未尝试：无候选分支）"
          pr_failed = False
          if overall == "pass" and candidate:
              # PR first (L): sub-issues and the [计划] issue close only
              # after the PR actually exists; a refused PR must not leave
              # a fully closed-out board behind it.
              r = gh("pr", "create", "--repo", os.environ["GITHUB_REPOSITORY"],
                     "--base", "main", "--head", candidate,
                     "--title", f"team: issue #{issue_number}",
                     "--body", f"Foreman-pattern result for issue #{issue_number}. Candidate branch: {candidate}")
              print("gh pr create rc:", r.returncode, (r.stdout or r.stderr).strip())
              if r.returncode == 0:
                  pr_text = (r.stdout or "").strip() or "(gh pr create 无输出)"
                  for pid, sub in subs.items():
                      if sub:
                          gh("issue", "close", str(sub), "--reason", "completed")
                  if plan_number:
                      gh("issue", "comment", plan_number, "--body",
                         "## 收口\n\n全部工序验收过关，PR 已创建，子单与本计划单随之关闭。")
                      gh("issue", "close", plan_number, "--reason", "completed")
              else:
                  pr_failed = True
                  pr_text = "PR 创建失败（子单与计划单未关，run 将标红）：" + ((r.stderr or r.stdout).strip() or "(gh pr create 无输出)")
          elif overall != "pass":
              procs = verdict.get("processes", [])
              failed = [p["id"] for p in procs if p.get("verdict") != "pass"]
              pytest_exit_v = verdict.get("pytest_exit")
              flips_v = verdict.get("flips") or []
              if flips_v:
                  flip_ids = ", ".join(f["id"] for f in flips_v)
                  block_detail = f"第 2 轮验收翻案：{flip_ids} 第 1 轮已判 pass、第 2 轮重判未过。验收未过：{', '.join(failed)}。"
              elif failed:
                  block_detail = f"验收未过：{', '.join(failed)}。"
              elif procs and all(p.get("verdict") == "pass" for p in procs) and pytest_exit_v not in (0, None):
                  block_detail = f"工序逐项 pass，但全量 pytest 退出码 {pytest_exit_v}，机器闸判 fail。"
              elif verdict.get("conflicts"):
                  block_detail = "验收员升级了工单层冲突（见状态卡冲突清单），含未处置矛盾的工单不通过。"
              elif verdict.get("reason"):
                  block_detail = f"验收未过：{verdict['reason']}。"
              else:
                  block_detail = "验收未过（无逐工序判定）。"
              # v2.6.3: state the factual stop reason instead of the old
              # unconditional disjunction ("iterations used up OR nothing to
              # re-dispatch"), whose first half was false whenever round 2
              # never ran. The verdict's iteration and the replan job result
              # together distinguish the cases.
              try:
                  iteration_v = int(verdict.get("iteration") or 1)
              except (TypeError, ValueError):
                  iteration_v = 1
              if iteration_v >= 2:
                  stop_reason = "本单已跑满 2 轮（上限）仍未通过，整单停下报人裁。"
              elif replan_result == "success":
                  stop_reason = "改计划回路已重派，但第 2 轮未产出判定，本单按第 1 轮判定停下报人裁。"
              elif verdict.get("unattributed_failure") and replan_result == "failure":
                  stop_reason = "合并失败无法归属任何工序卡，改计划回路无从判层，整单停下报人裁。"
              elif replan_result == "failure":
                  stop_reason = "改计划回路失败（replan job 红），本单按第 1 轮判定停下报人裁。"
              elif replan_result == "cancelled":
                  stop_reason = "改计划回路被取消（replan job 被取消/硬超时），本单按第 1 轮判定停下报人裁。"
              else:
                  stop_reason = "第 1 轮判定未产生可重派项，改计划回路未触发，整单停下报人裁。"
              if plan_number:
                  gh("issue", "comment", plan_number, "--body",
                     f"## 阻塞\n\n{block_detail}{stop_reason}子单保持打开。")
              pr_text = "（未尝试：验收未过）"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"pr_failed={'true' if pr_failed else 'false'}\n")

          pytest_exit = verdict.get("pytest_exit")
          plan_label = f"#{plan_number}" if plan_number else "未落成"
          lines = ["## 团队状态卡（收口）", "",
                   f"计划：{plan_label}（计划版本 v{verdict.get('iteration', 1)} 轮验收）",
                   f"候选分支：`{candidate or '无'}`",
                   f"全量 pytest 退出码：{pytest_exit if pytest_exit is not None else '未知'}", ""]
          if replan_result == "failure":
              lines += ["⚠ 改计划回路失败（replan job 红），本卡按第 1 轮判定收口", ""]
          r2_dead = [name for name, key in (("replan", "REPLAN_RESULT"), ("worker2", "WORKER2_RESULT"),
                                            ("prep2", "PREP2_RESULT"), ("validate2", "VALIDATE2_RESULT"))
                     if os.environ.get(key, "") in ("failure", "cancelled")]
          if v2_path and os.environ.get("PICKED_ROUND") == "1" and r2_dead:
              lines += [f"⚠ 计划 v2 已落成，但第 2 轮链条未走完（{', '.join(r2_dead)}），本卡按第 1 轮判定收口", ""]
          if verdict.get("reason"):
              lines += [f"判定说明：{verdict['reason']}", ""]
          flips_card = verdict.get("flips") or []
          if flips_card:
              lines += [f"⚠ 第 2 轮验收翻案：{', '.join(f['id'] for f in flips_card)}（第 1 轮 pass、第 2 轮未过），已达 2/2 轮上限，不再自动重派。", ""]
          lines += ["### 验收结果"]
          for proc in verdict.get("processes", []):
              sub = subs.get(proc.get("id"))
              sub_label = f"（子单 #{sub}）" if sub else ""
              lines.append(f"- `{proc.get('id')}`{sub_label}：{proc.get('verdict')} — {proc.get('reason')}")
          conflicts_card = verdict.get("conflicts") or []
          if conflicts_card:
              lines += ["", "### 工单层冲突（验收员升级记录，未处置）"]
              for c in conflicts_card:
                  lines.append(f"- `{c.get('process')}`：{c.get('summary')}（证据：{c.get('evidence', '')}）")
          salvaged_from = verdict.get("salvaged_from")
          if salvaged_from:
              lines += ["",
                        f"⚠ validator 会话被墙杀，采认失败；从 {salvaged_from} 回收了 {verdict.get('salvaged_count', 0)} 件已完成分析的结论（见上），其余工序未完成分析。已回收的 pass 不构成验收通过。", ""]
          lines += ["", f"总判定：**{overall}**", "", "### PR", "", pr_text, "",
                    "板面权威：Projects #33 字段由 `project_state_write.py`（PAT）写入；本评论仅为审计镜像。"]
          open("final-comment.md", "w").write("\n".join(lines))
          print("\n".join(lines))
          PY
          if [ ! -f foreman-run.json ] && [ -f wall-root/foreman-run.json ]; then
            cp wall-root/foreman-run.json foreman-run.json
          fi
          PYTHONPATH=scripts/team python3 scripts/team/post_comment_hard.py \
            --issue "$ISSUE_NUMBER" \
            --body-file final-comment.md \
            --hard-required \
            --wall-patch '{"key":"final_status_card","wall":"foreman-run.json"}'

      - name: Prepare foreman-run for assemble wall sync (W5)
        if: always()
        run: |
          if [ ! -f foreman-run.json ]; then
            if [ ! -f wall-root/foreman-run.json ]; then
              echo "foreman-run missing for assemble wall sync"
              exit 1
            fi
            cp wall-root/foreman-run.json foreman-run.json
          fi

      - name: Record assemble exit on ForemanRun wall (W5, no backfill)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ ! -f foreman-run.json ] && [ -f wall-root/foreman-run.json ]; then
            cp wall-root/foreman-run.json foreman-run.json
          fi
          RESULT="success"
          if [ "$JOB_STATUS" = "failure" ]; then RESULT="failure"; fi
          if [ "$JOB_STATUS" = "cancelled" ]; then RESULT="cancelled"; fi
          PRODUCED="false"
          if [ -f final-verdict.json ]; then PRODUCED="true"; fi
          PYTHONPATH=scripts/team python3 scripts/team/assemble_chain_facts.py \
            --wall foreman-run.json --assemble-exit --result "$RESULT" --produced "$PRODUCED"

      - name: Upload foreman-run wall artifact (assemble exit)
        if: always() && hashFiles('foreman-run.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: foreman-run.json
          overwrite: true

      - name: Fail the run when validation did not pass or the PR failed
        if: >-
          steps.pick.outputs.overall != 'pass' ||
          steps.closeout.outputs.pr_failed == 'true' ||
          steps.board_write.outcome == 'failure'
        run: |
          echo "run must fail: overall/pr/board_write"
          exit 1

      - name: Post minimal status card when pick failed
        if: ${{ failure() && steps.pick.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "## 团队状态卡（汇总异常·未收口）"
            echo ""
            echo "汇总 job 的 pick 步失败，未能生成正式收口卡。run：${RUN_ID}。请看本 run 的 assemble job 日志定位 pick 失败原因；本工单未收口。"
          } > minimal-card.md
          PYTHONPATH=scripts/team python3 scripts/team/post_comment_hard.py \
            --issue "$ISSUE_NUMBER" \
            --body-file minimal-card.md \
            --hard-required
