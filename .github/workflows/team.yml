name: Droid Team v2.8.0 (foreman pattern test)

# Foreman pattern （领班制）, v2.8.0:
#   v2.8.1 change note (round-52 ledger fixes): the stitch step now records its scan on the wall (--wall) so plan.output_shape is written by the same step that prints "stitch: shape=...", and the two steps that re-copied the just-downloaded wall over same-job writes (lead plan comment, replan notice) only freshen when absent — the round-52 walls all lost the plan slice to that clobber and the lead close-out detail read lead_plan_output_shape=unknown against a shape=complete log. validate2 recomputes the replan gate from the final verdict (--round 2) so a two-round run no longer ends with round 1's should_replan=true on the wall (round-52 C); the terminal recomputation refuses to run without the round-2 validation slice (StaleGateError, fail-closed).
#   v2.8.0 change note: segments-only assembly — team-plan.json is stitched by the system (lead_plan_segments.py stitch) from the lead's segments right before the Validate step reads it; the lead prompt no longer asks for a hand-written team-plan.json, and the plan-vs-segments equivalence check was deleted with the second artifact it reconciled (round-51 A/C/D died on summary drift and B on id/summary/task drift — all three triggers require the double write). Card ids are derived from module-name stems (lower-case, underscores -> hyphens, ^[a-z0-9][a-z0-9-]*$) so id==filename holds by construction; the id==filename scan error now says exactly that. Scan shape is disk-truth: none = nothing stitchable, partial = segments on disk with residue, complete = header + every card clean; the lead hard gate still kills only zero-segment sessions, and a timed-out lead session records partial at run level.
# Foreman pattern （领班制）, v2.7.0:
#   v2.7.0 change note: 整面 API 墙 ForemanRun / foreman-run.v1 — 唯一产物 foreman-run.json 跨 job 传递 (W1)；采认链 + upload 完整门 (P0-1/B2)；replan_gate.should_replan 唯一编排门 (Y1/W4)；env hard_fail_count + PROJECTS_STATE_PAT (W3)；workers.completed_pids prep 门 (P1-5)；chain_facts 收口 (W5)；closeout 硬评论 + human_stop (W2/W6)；foreman_mode test|prod 默认 test (L6)。
# Foreman pattern （领班制）, v2.6.5:
#   v2.6.5 change note: R19 fix only. (a) Foreman prompt: a process card's "files" list may contain deliverable paths only, and the old team/ exception sentence is rewritten as a system-managed declaration — handoff/status files under team/ are produced by the system automatically and must never be listed in any card's "files". (b) Deterministic stripping at both plan gates: team/ entries in a card's files are stripped by script after normalization and before the protected-path check (validate step for plan v1, full-graph claim check for plan v2); every stripped entry is recorded in the job log and on the source order (v1, via the dispatch comment) / the replan comment (v2). .github/**, absolute paths and ".." still hard-reject; a card left with no files after stripping still fails as a card without files. No other behavior changes.
#   v2.6.4 change note: (A) unattributed-failure attribution mode — when every process verdict is pass but the merged suite is red (overall=fail with an empty failed list), validate now exports unattributed_failure plus a deterministic failing_tests list parsed from the pytest output, replan triggers on that signal too, attributes each failing test to the process whose card owns its test file, and may revise an attributed (even passed) card; failures no card owns stop the order for a human instead of dying silently (round-17 C1, ruled a mutual veto between the replan prompt and the trigger construction); (B) validator hard rule in both rounds: a red mandated check (a non-zero entry in checks-exit.json — except an exit 127 recorded because pytest was unavailable — or a checks-failed.marker in the pack) can never be judged pass; (C) foreman transcription discipline: the work order's acceptance criteria are transcribed into the cards item by item and a work-order self-contradiction must be carried on the card as an explicit CONFLICT note, and the validator escalates worker-flagged out-of-card conflicts into a top-level verdict "conflicts" array that assemble renders on the final status card whether the order passes or fails (round-18 R18); (D) validate2 records round-1 -> round-2 verdict flips in a "flips" field, exposes them as a job output, and the close-out card and blocked notice name them (the 2/2 round limit already stands, so a flip is accounted, not re-dispatched); (E) prep/prep2 subprocess calls gain timeouts (other calls 120s, pip install 300s, per-process checks 300s each, full pytest 600s recorded as exit 124 on timeout) so a hung child surfaces as a recorded failure instead of stalling silently until the job wall (findings A3, prep face).
#   v2.6.3 change note: (1) validate/replan/worker2/validate2 job ifs gain an explicit !cancelled(), so GitHub's implicit success() (evaluated over the whole needs chain) no longer lets an upstream worker failure silently skip the validator (round-15 live evidence + minimal repro run 44092768688); (2) worker/worker2 verify steps record process-quality failures (missing deliverables, malformed status, red checks) in team/status/<pid>.checks-failed.marker and exit 0, the commit step runs under !cancelled() so the branch + handoff evidence always lands, and a new trailing step fails the job when the marker exists — job conclusion unchanged (red checks = failed job), evidence no longer dies with the step; (3) assemble's blocked notice states the factual stop reason (round limit reached / replan never triggered / replan failed or cancelled / round 2 produced no verdict) instead of the unconditional "iterations used up or nothing to re-dispatch" disjunction.
#   v2.6.2 change note: round-2 worker branch .../<pid>/r2 -> .../<pid>-r2 (leaf suffix); the old name prefix-conflicted with the round-1 branch .../<pid> and its push was rejected with "cannot lock ref" (round-10 live evidence).
#   env-check (reusable gate, GitHub side only)
#   -> lead/foreman splits the order and files the [计划] issue + sub-issues
#   -> workers (one process card each, parallel)
#   -> prep (script job: merge + tests + evidence packs, validator never merges)
#   -> validate (squad-leader style: pre-packed evidence only, no GitHub token,
#      soft timeout, single structured verdict; no pack = no judging)
#   -> replan (foreman revises the plan / re-dispatches, at most one extra round)
#   -> worker2 / prep2 / validate2 when a replan happened
#   -> assemble (final status card, sub-issue close-out, PR attempt)

on:
  issue_comment:
    types: [created]

concurrency:
  group: team-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  env-check:
    name: env-check (gate)
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@team-droid')
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/env-check.yml
    with:
      issue_number: ${{ github.event.issue.number }}
      project_number: 33
    secrets: inherit

  lead:
    name: lead (foreman splits and files the plan)
    needs: env-check
    if: >-
      needs.env-check.result == 'success' &&
      needs.env-check.outputs.foreman_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      processes: ${{ steps.plan.outputs.processes }}
      plan_issue_number: ${{ steps.plan.outputs.plan_issue_number }}
      duplicate: ${{ steps.dup.outputs.duplicate }}
    env:
      FOREMAN_MODE: ${{ vars.FOREMAN_MODE || 'test' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ForemanRun wall (W1)
        uses: actions/download-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: wall-in

      - name: Duplicate check (work order already closed out with pass?)
        id: dup
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ["GITHUB_REPOSITORY"]
          issue = os.environ["ISSUE_NUMBER"]
          comments = []
          page = 1
          while True:
              r = subprocess.run(["gh", "api", f"repos/{repo}/issues/{issue}/comments?per_page=100&page={page}"],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  print("comment list failed; treating as not duplicate:", (r.stderr or "")[:300])
                  comments = []
                  break
              batch = json.loads(r.stdout or "[]")
              comments += batch
              if len(batch) < 100:
                  break
              page += 1
          duplicate = any((c.get("user") or {}).get("login") == "github-actions[bot]" and
                          "## 团队状态卡（收口）" in (c.get("body") or "") and
                          "总判定：**pass**" in (c.get("body") or "")
                          for c in comments)
          if duplicate:
              subprocess.run(["gh", "issue", "comment", issue, "--body",
                              "## 重复点名\n\n重复点名：本工单已由先前 run 处理完毕（pass），不重复派队。"],
                             check=False)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"duplicate={'true' if duplicate else 'false'}\n")
          print("duplicate:", duplicate)
          PY

      - name: Install droid CLI
        if: steps.dup.outputs.duplicate != 'true'
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Write BYOM settings (lead session)
        if: steps.dup.outputs.duplicate != 'true'
        env:
          WORKER_CI_KEY: ${{ secrets.WORKER_CI_KEY }}
          GO_GITHUB_RUN_TOKEN: ${{ secrets.GO_GITHUB_RUN_TOKEN }}
          GW_TOKEN_KNOWN: ${{ secrets.GW_TOKEN_KNOWN }}
          SESSION_NAME: team-lead
        run: |
          mkdir -p ~/.factory
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.factory/settings.json")
          s = {}
          if os.path.exists(p):
              s = json.load(open(p))
          headers = {
              "x-ci-key": os.environ.get("WORKER_CI_KEY", ""),
              "x-opencode-session": os.environ.get("SESSION_NAME", "team-lead"),
              "cf-aig-authorization": "Bearer " + os.environ.get("GW_TOKEN_KNOWN", ""),
          }
          s["customModels"] = [{
              "model": "dynamic/droid-review",
              "id": "custom:DeepSeek-V4.1-Flash-Go",
              "baseUrl": "https://droid-test.lumivane.dpdns.org",
              "apiKey": os.environ.get("GO_GITHUB_RUN_TOKEN", ""),
              "provider": "generic-chat-completion-api",
              "extraHeaders": headers,
          }]
          json.dump(s, open(p, "w"), indent=2)
          m = s["customModels"][0]
          print("settings check | model:", m["model"], "| baseUrl:", m["baseUrl"],
                "| apiKey present:", bool(m["apiKey"]),
                "| x-ci-key present:", bool(headers["x-ci-key"]),
                "| x-opencode-session present:", bool(headers["x-opencode-session"]),
                "| cf-aig-authorization present:", bool(headers["cf-aig-authorization"]))
          PY

      - name: Foreman splits the order into process cards
        if: steps.dup.outputs.duplicate != 'true'
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          set -o pipefail
          python3 - <<'PY'
          import json, os
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          issue = ev.get("issue") or {}
          title = issue.get("title", "")
          body = issue.get("body") or ""
          prompt = f"""You are the FOREMAN （领班） of a development team under the foreman pattern. Your only job is to split the work order into process cards. You never write application code yourself. team-plan.json is assembled by the system from your segments; you never create, edit, or write it. Do not edit any file except new JSON files under team/lead-plan-segments/ (one new file per segment — never overwrite an existing segment file).

          Segmented persistence (required — read before anything else; the session fails if you delay this):
          - Your FIRST action must be to write team/lead-plan-segments/00-header.json as a standalone complete file (within your first 2 tool calls): {{"schema_version":"lead-plan-segment.v1","kind":"header","summary":"<one short sentence describing this plan>"}}. Write the summary as final text immediately — the system assembles team-plan.json from these segments, and the header's summary becomes the plan summary. The header file must exist before you analyze the work order at length.
          - After EACH process card is fully decided, immediately write a new standalone file team/lead-plan-segments/process-<id>.json (never update a segment file you already wrote): {{"schema_version":"lead-plan-segment.v1","kind":"process","process":{{...full card...}}}}. Do not batch segment writes until the end — write each segment as soon as that card is decided. This is how partial progress survives a timeout.
          - Derive <id> from the module name: take the stem, lower-case it, and turn underscores into hyphens; the result must match ^[a-z0-9][a-z0-9-]*$ and must equal the card's "id" field exactly. Example: module Tap_Code -> id tap-code, file team/lead-plan-segments/process-tap-code.json.
          - team-plan.json is assembled by the system from these segments after your session ends. Never create it, never edit it, never write it.

          Work order title: {title}

          Work order body:
          {body}

          Card shape (the "process" object inside each segment file):
          {{
            "id": "short-kebab-id",
            "title": "process title",
            "scope": "what this process owns and does not own",
            "files": ["deliverable file this process creates or edits", "its test file"],
            "task": "complete instructions for one worker",
            "checks": ["one shell command that verifies this process"]
          }}

          Rules:
          - Every "files" list may contain deliverable paths only — the files the deliverable itself consists of, plus their test files. `team/**` and `.github/**` must never appear in any "files" list.
          - Split along module boundaries into 1 to 6 independent processes (typically 3).
          - Processes must not depend on each other and must not share files. Every worker's handoff and status files under team/ are system-managed: the system produces them automatically, and you must never list any team/ path in any process's "files".
          - Each process gets exactly one worker, one job, and a short lease.
          - The checks must be runnable from the repository root.
          - Every segment file must contain valid JSON only; do not wrap it in Markdown.
          - Transcribe the work order's acceptance criteria item by item. Every acceptance example, value, or requirement stated anywhere in the work order must land in the task or checks of the one process card it belongs to. Never let the body's worked examples substitute for the acceptance section, and never drop an acceptance item silently.
          - If the work order contradicts itself (for example a body example and an acceptance value disagree), do NOT silently pick one side. The affected card's task text must carry an explicit conflict note in exactly this shape: "CONFLICT: <item> — body says <X>, acceptance says <Y>; provisional value: <X or Y> (reason: <one line>)". Both values must appear in the card; the worker and the validator must be able to see the conflict from the card alone.
          """
          open("lead-prompt.txt", "w").write(prompt)
          PY
          cp wall-in/foreman-run.json foreman-run.json
          FOREMAN_RUN_PATCH=1 PYTHONPATH=scripts/team python3 scripts/team/run_droid_session.py \
            --wall foreman-run.json --role lead \
            --prompt-file lead-prompt.txt \
            --stream-out lead-stream.jsonl \
            --exit-out lead-droid-exit.txt \
            --heartbeat

      - name: Upload lead droid stream (W-13)
        if: always() && steps.dup.outputs.duplicate != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: droid-stream-lead-run-${{ github.run_id }}
          path: lead-stream.jsonl
          if-no-files-found: warn

      - name: Sync lead plan segments to ForemanRun wall (B2)
        if: steps.dup.outputs.duplicate != 'true'
        run: |
          if [ ! -f wall-in/foreman-run.json ]; then
            echo "foreman-run missing before lead segment sync"
            exit 1
          fi
          [ -f foreman-run.json ] || cp wall-in/foreman-run.json foreman-run.json
          PYTHONPATH=scripts/team python3 scripts/team/lead_plan_segments.py sync-wall --wall foreman-run.json

      - name: Stitch segments into team-plan.json (single source)
        if: steps.dup.outputs.duplicate != 'true'
        run: |
          if [ ! -f wall-in/foreman-run.json ]; then
            echo "foreman-run missing before segment stitch"
            exit 1
          fi
          [ -f foreman-run.json ] || cp wall-in/foreman-run.json foreman-run.json
          PYTHONPATH=scripts/team python3 scripts/team/lead_plan_segments.py stitch --wall foreman-run.json

      - name: Validate plan, file [计划] issue and sub-issues
        if: steps.dup.outputs.duplicate != 'true'
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ ! -f wall-in/foreman-run.json ]; then
            echo "foreman-run missing before lead plan gate"
            exit 1
          fi
          [ -f foreman-run.json ] || cp wall-in/foreman-run.json foreman-run.json
          PYTHONPATH=scripts/team python3 scripts/team/lead_plan_segments.py assert-ready --wall foreman-run.json
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          repo = os.environ["GITHUB_REPOSITORY"]
          issue_number = os.environ["ISSUE_NUMBER"]
          run_id = os.environ["RUN_ID"]

          def gh(*args, check=True):
              r = subprocess.run(["gh", *args], capture_output=True, text=True)
              if check and r.returncode != 0:
                  print("gh failed:", " ".join(args), r.stdout, r.stderr)
                  sys.exit(1)
              return r

          plan = json.load(open("team-plan.json"))
          processes = plan.get("processes") or []
          if not 1 <= len(processes) <= 6:
              print(f"plan must contain 1-6 processes, got {len(processes)}")
              sys.exit(1)

          def norm(p):
              return os.path.normpath(str(p).strip())

          def protected_hits(files):
              hits = []
              for f in files:
                  nf = norm(f)
                  parts = nf.split("/")
                  if os.path.isabs(str(f)) or ".." in parts or nf == ".github" or nf.startswith(".github/") or nf == "team" or nf.startswith("team/"):
                      hits.append(f)
              return hits

          seen_ids = set()
          seen_files = {}
          protected = []
          stripped = []
          for proc in processes:
              for key in ("id", "title", "scope", "files", "task", "checks"):
                  if not proc.get(key):
                      print(f"process missing {key}: {proc}")
                      sys.exit(1)
              pid = proc["id"]
              if not re.fullmatch(r"^[a-z0-9][a-z0-9-]*$", str(pid)):
                  print(f"process id has illegal characters (allowed: ^[a-z0-9][a-z0-9-]*$): {pid}")
                  sys.exit(1)
              if pid in seen_ids:
                  print(f"duplicate process id: {pid}")
                  sys.exit(1)
              seen_ids.add(pid)
              proc["files"] = [norm(f) for f in proc["files"]]
              kept_files = []
              for f in proc["files"]:
                  if f == "team" or f.startswith("team/"):
                      stripped.append((pid, f))
                  else:
                      kept_files.append(f)
              proc["files"] = kept_files
              if not proc["files"]:
                  print(f"process missing files (every entry was a system-managed team/ path and was stripped): {pid}")
                  sys.exit(1)
              protected += [(pid, f) for f in protected_hits(proc["files"])]
              for f in proc["files"]:
                  if f in seen_files:
                      print(f"file owned by two processes: {f}")
                      sys.exit(1)
                  seen_files[f] = pid
          if stripped:
              print("stripped system-managed paths:", "; ".join(f"`{pid}`: {f}" for pid, f in stripped))
          if protected:
              detail = "; ".join(f"`{pid}`: {f}" for pid, f in protected)
              print("plan claims protected paths:", detail)
              gh("issue", "comment", issue_number, "--body",
                 "## 领班计划校验失败（受保护路径）\n\n计划卡面命中受保护路径黑名单（.github/**、绝对路径或含 ..），计划被拒：\n\n" + detail,
                 check=False)
              sys.exit(1)
          plan["plan_version"] = 1
          plan["iteration"] = 1

          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          order_title = (ev.get("issue") or {}).get("title", "")

          def find_issue(title):
              r = gh("issue", "list", "--state", "all", "--limit", "100",
                     "--search", f'"{title}" in:title', "--json", "number,title")
              for item in json.loads(r.stdout or "[]"):
                  if item.get("title") == title:
                      return item["number"]
              return None

          def create_issue(title, body):
              found = find_issue(title)
              if found:
                  return found
              open("issue-body.tmp.md", "w").write(body)
              r = gh("issue", "create", "--title", title, "--body-file", "issue-body.tmp.md")
              url = r.stdout.strip().splitlines()[-1]
              return int(url.rstrip("/").split("/")[-1])

          plan_title = f"[计划] 工单 #{issue_number} · run {run_id} · {order_title}"[:200]
          plan_lines = [f"# [计划] 工单 #{issue_number} 的执行计划（领班制）", "",
                        f"来源工单：#{issue_number}", f"运行：run {run_id}", "",
                        f"总述：{plan.get('summary', '')}", "", "## 工序卡清单", ""]
          for i, proc in enumerate(processes, 1):
              plan_lines += [f"### 工序 {i}：{proc['title']} (`{proc['id']}`)",
                             f"- 范围：{proc['scope']}",
                             f"- 文件：{', '.join(proc['files'])}",
                             f"- 任务：{proc['task']}",
                             f"- 检查：{'; '.join(proc['checks'])}", ""]
          plan_lines.append("本计划由领班 job 落成；工序以本单的 sub-issues 执行，进度看本单的 Sub-issues progress。")
          plan_number = create_issue(plan_title, "\n".join(plan_lines))
          print("plan issue:", plan_number)

          for proc in processes:
              child_title = f"[工序] {proc['id']} · 工单 #{issue_number} · run {run_id}"
              child_body = "\n".join([
                  f"# 工序卡：{proc['title']} (`{proc['id']}`)", "",
                  f"父计划：#{plan_number}", f"来源工单：#{issue_number}", "",
                  f"范围：{proc['scope']}", "",
                  f"文件：{', '.join(proc['files'])}", "",
                  f"任务：{proc['task']}", "",
                  f"检查：{'; '.join(proc['checks'])}", "",
                  "工人按本卡施工，交接记录与状态文件落在代码分支的 team/ 目录；验收过关后由汇总 job 关单。",
              ])
              child_number = create_issue(child_title, child_body)
              r = gh("api", f"repos/{repo}/issues/{child_number}", "--jq", ".id")
              child_id = int(r.stdout.strip())
              attach = gh("api", "--method", "POST",
                          f"repos/{repo}/issues/{plan_number}/sub_issues",
                          "-F", f"sub_issue_id={child_id}", check=False)
              linked = attach.returncode == 0
              if not linked:
                  note = ("sub-issue 挂接失败（原文）：" + (attach.stderr or attach.stdout).strip()[:300])
                  gh("issue", "comment", str(child_number), "--body",
                     f"父计划：#{plan_number}。{note}", check=False)
                  gh("issue", "comment", str(plan_number), "--body",
                     f"工序 `{proc['id']}` 子单 #{child_number}：{note}", check=False)
              proc["sub_issue_number"] = child_number
              proc["sub_issue_linked"] = linked
              print("sub-issue:", proc["id"], "->", child_number, "linked:", linked)

          json.dump(plan, open("team-plan.json", "w"), ensure_ascii=False, indent=2)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("processes=" + json.dumps(processes, ensure_ascii=False) + "\n")
              out.write(f"plan_issue_number={plan_number}\n")

          lines = ["## 领班派单卡", "",
                   f"计划已落成：[计划] #{plan_number}（工序在该单下以 sub-issues 执行）",
                   "", f"总述：{plan.get('summary', '')}", ""]
          for i, proc in enumerate(processes, 1):
              lines += [f"### 工序 {i}：{proc['title']} (`{proc['id']}`) → 子单 #{proc['sub_issue_number']}",
                        f"- 范围：{proc['scope']}",
                        f"- 文件：{', '.join(proc['files'])}",
                        f"- 检查：{'; '.join(proc['checks'])}", ""]
          if stripped:
              lines += ["", "## 系统托管路径已自动剔除（team/ 由系统托管、无需在计划中声明）", ""]
              lines += [f"- `{pid}`: {f}" for pid, f in stripped]
          lines.append("审计镜像（只读）：派单评论；Projects 板面权威字段见 `closeout.project_state_*` 与 PAT 写板。")
          open("plan-comment.md", "w").write("\n".join(lines))
          print("\n".join(lines))
          PY

      - name: Post plan dispatch comment (B4/I4)
        if: steps.dup.outputs.duplicate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          # I8-B live only: non-empty invalid PAT → gh issue comment 401/403; post_comment_hard --hard-required exits 1.
          I8_LIVE_B_INVALID_GH_TOKEN: ${{ vars.I8_LIVE_B_INVALID_GH_TOKEN || 'ghp_i8livefixture000000000000000000000000' }}
        run: |
          if [ ! -f wall-in/foreman-run.json ]; then
            echo "foreman-run missing before plan comment"
            exit 1
          fi
          # Freshen only when absent: an unconditional copy here would revert
          # the wall to its just-downloaded pre-session state and wipe the
          # plan slice the stitch/sync steps wrote (round-52 shape=unknown).
          [ -f foreman-run.json ] || cp wall-in/foreman-run.json foreman-run.json
          if [[ "$ISSUE_TITLE" == "[I8] API墙活验 B 评论硬失败" ]]; then
            export GH_TOKEN="$I8_LIVE_B_INVALID_GH_TOKEN"
            echo "I8-B live fixture: plan dispatch comment uses invalid GH_TOKEN (API hard-fail, not empty)"
          fi
          PYTHONPATH=scripts/team python3 scripts/team/post_comment_hard.py \
            --issue "$ISSUE_NUMBER" \
            --body-file plan-comment.md \
            --hard-required \
            --wall-patch '{"key":"plan_dispatch","wall":"foreman-run.json"}'

      - name: Upload plan artifact
        if: steps.dup.outputs.duplicate != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: team-plan-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: team-plan.json
          overwrite: true

      - name: Validate foreman_mode plan gate (L6)
        if: steps.dup.outputs.duplicate != 'true'
        run: |
          if [ ! -f foreman-run.json ] && [ ! -f wall-in/foreman-run.json ]; then
            echo "foreman-run missing before foreman_mode gate"
            exit 1
          fi
          [ -f foreman-run.json ] || cp wall-in/foreman-run.json foreman-run.json
          PYTHONPATH=scripts/team python3 scripts/team/validate_foreman_mode.py \
            --plan team-plan.json --mode "$FOREMAN_MODE"

      - name: Record lead exit on ForemanRun wall (batch-2 / W-9)
        if: always() && steps.dup.outputs.duplicate != 'true'
        env:
          PLAN_ISSUE_NUMBER: ${{ steps.plan.outputs.plan_issue_number }}
          FOREMAN_MODE: ${{ vars.FOREMAN_MODE || 'test' }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ ! -f wall-in/foreman-run.json ]; then
            echo "foreman-run missing for lead wall sync"
            exit 1
          fi
          [ -f foreman-run.json ] || cp wall-in/foreman-run.json foreman-run.json
          RESULT="success"
          if [ "$JOB_STATUS" = "failure" ]; then RESULT="failure"; fi
          if [ "$JOB_STATUS" = "cancelled" ]; then RESULT="cancelled"; fi
          PRODUCED="false"
          if [ -f team-plan.json ]; then PRODUCED="true"; fi
          LEAD_DETAIL=""
          if [ -f foreman-run.json ]; then
            LEAD_DETAIL="$(PYTHONPATH=scripts/team python3 -c "import json; w=json.load(open('foreman-run.json')); pl=w.get('plan') or {}; print(f\"lead_plan_output_shape={pl.get('output_shape','unknown')}\")")"
          fi
          python3 - <<'PY' > /tmp/lead-patch.json
          import json, os
          p = os.environ.get("PLAN_ISSUE_NUMBER", "")
          patch = {
              "plan_issue_number": int(p) if (p and str(p).isdigit()) else None,
              "foreman_mode": os.environ.get("FOREMAN_MODE", "test"),
          }
          print(json.dumps(patch))
          PY
          SYNC_DETAIL="lead job result=$RESULT"
          if [ -n "$LEAD_DETAIL" ]; then SYNC_DETAIL="$SYNC_DETAIL; $LEAD_DETAIL"; fi
          PYTHONPATH=scripts/team python3 scripts/team/wall_sync_job.py \
            --job lead --result "$RESULT" --produced "$PRODUCED" \
            --detail "$SYNC_DETAIL" \
            --patch "$(cat /tmp/lead-patch.json)"

      - name: Upload foreman-run wall artifact (lead exit)
        if: always() && steps.dup.outputs.duplicate != 'true' && hashFiles('foreman-run.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: foreman-run.json
          overwrite: true

  worker:
    name: worker
    needs: lead
    if: needs.lead.result == 'success' && needs.lead.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        process: ${{ fromJSON(needs.lead.outputs.processes) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record base SHA (session self-commit guard)
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install dev dependencies (U-10)
        run: python3 -m pip install -r requirements-dev.txt

      - name: Install droid CLI
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Write BYOM settings (worker session)
        env:
          WORKER_CI_KEY: ${{ secrets.WORKER_CI_KEY }}
          GO_GITHUB_RUN_TOKEN: ${{ secrets.GO_GITHUB_RUN_TOKEN }}
          GW_TOKEN_KNOWN: ${{ secrets.GW_TOKEN_KNOWN }}
          SESSION_NAME: team-worker-${{ matrix.process.id }}
        run: |
          mkdir -p ~/.factory
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.factory/settings.json")
          s = {}
          if os.path.exists(p):
              s = json.load(open(p))
          headers = {
              "x-ci-key": os.environ.get("WORKER_CI_KEY", ""),
              "x-opencode-session": os.environ.get("SESSION_NAME", "team-worker"),
              "cf-aig-authorization": "Bearer " + os.environ.get("GW_TOKEN_KNOWN", ""),
          }
          s["customModels"] = [{
              "model": "dynamic/droid-review",
              "id": "custom:DeepSeek-V4.1-Flash-Go",
              "baseUrl": "https://droid-test.lumivane.dpdns.org",
              "apiKey": os.environ.get("GO_GITHUB_RUN_TOKEN", ""),
              "provider": "generic-chat-completion-api",
              "extraHeaders": headers,
          }]
          json.dump(s, open(p, "w"), indent=2)
          m = s["customModels"][0]
          print("settings check | model:", m["model"], "| baseUrl:", m["baseUrl"],
                "| apiKey present:", bool(m["apiKey"]),
                "| x-ci-key present:", bool(headers["x-ci-key"]),
                "| x-opencode-session present:", bool(headers["x-opencode-session"]),
                "| cf-aig-authorization present:", bool(headers["cf-aig-authorization"]))
          PY

      - name: Worker executes exactly one process card
        id: session
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          PROCESS_JSON: ${{ toJSON(matrix.process) }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          python3 - <<'PY'
          import json, os
          proc = json.loads(os.environ["PROCESS_JSON"])
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          issue = ev.get("issue") or {}
          retry = proc.get("retry_note") or ""
          retry_block = f"\n          Retry context (this card was re-dispatched after validation):\n          {retry}\n" if retry else ""
          prompt = f"""You are a WORKER on a development team under the foreman pattern. Execute exactly one process card (your sub-issue #{proc.get('sub_issue_number', '?')}). Do not do any other process. Do not expand scope.

          Work order: #{os.environ['ISSUE_NUMBER']} {issue.get('title','')}
          Work order body:
          {issue.get('body') or ''}

          Your process card:
          {json.dumps(proc, ensure_ascii=False, indent=2)}
          {retry_block}
          Instructions:
          - Create or edit only these files: {', '.join(proc['files'])}
          - Also write exactly these two team files:
            1. team/handoffs/{proc['id']}.md — a self-contained handoff with: what was requested, what you did, what you did not do, checks you ran and their results, and anything the validator must pay attention to.
            2. team/status/{proc['id']}.json — valid JSON with keys: id, title, state ("done"), files (array), checks (array of objects with command and result).
          - Run your process checks before finishing: {'; '.join(proc['checks'])}
          - Checks may run tests across the whole repo. Files like verdict.json or verdict.md that appear in the repo root because of those checks are pipeline by-products of the test suite, not your deliverables. They are outside your card, so delete them before finishing (e.g. rm -f verdict.json verdict.md).
          - Do not commit or push; the workflow will do that.
          - Do not modify files owned by other processes.
          - Be efficient: at most 20 tool calls.
          """
          open("worker-prompt.txt", "w").write(prompt)
          PY
          # F1: capture the session's own exit code (GNU timeout exit 124 =
          # 900s wall kill) for the delta step, then re-exit with it so the
          # job-level conclusion keeps failing on a killed session.
          set +e
          timeout --signal=TERM --kill-after=30s 900s ~/.local/bin/droid exec --auto high -m "custom:DeepSeek-V4.1-Flash-Go" --output-format stream-json "$(cat worker-prompt.txt)" | tee worker-stream.jsonl
          DROID_EXIT=$?
          echo "exit_code=${DROID_EXIT:-0}" >> "$GITHUB_OUTPUT"
          exit "${DROID_EXIT:-0}"

      - name: Upload worker droid stream (W-13)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droid-stream-worker-${{ matrix.process.id }}-run-${{ github.run_id }}
          path: worker-stream.jsonl
          if-no-files-found: warn

      - name: Verify process checks and handoff
        env:
          PROCESS_JSON: ${{ toJSON(matrix.process) }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          if subprocess.run(["python3", "-m", "pytest", "--version"],
                            capture_output=True).returncode != 0:
              print("pytest missing; installing deterministically (v2.1)")
              if subprocess.run(["python3", "-m", "pip", "install", "-q", "pytest"]).returncode != 0:
                  print("pytest install failed; cannot verify")
                  sys.exit(1)
              if subprocess.run(["python3", "-m", "pytest", "--version"],
                                capture_output=True).returncode != 0:
                  print("pytest still unavailable after install; cannot verify")
                  sys.exit(1)
          proc = json.loads(os.environ["PROCESS_JSON"])
          handoff = f"team/handoffs/{proc['id']}.md"
          status = f"team/status/{proc['id']}.json"
          # v2.6.3: process-quality failures (missing deliverables, malformed
          # status, red checks) no longer kill this step. All checks run to
          # completion, every problem is recorded in a marker file, and the
          # step exits 0 so the commit step still lands the branch + handoff
          # evidence; a trailing step fails the job if the marker exists.
          # (The marker name carries the process id: a bare
          # "checks-failed.marker" would collide when prep merges several
          # failed workers' branches into one candidate.) Only the harness
          # failure above (pytest cannot be installed at all) keeps the
          # hard exit: without pytest no check can run at all.
          marker = f"team/status/{proc['id']}.checks-failed.marker"
          # v2.6.3 (review fix): delete any pre-existing marker for this
          # process before checking. A stale marker (e.g. one that reached
          # the default branch from an earlier order reusing this process
          # id) must not fail this run: the trailing step may only honor a
          # marker written by THIS verify step, below.
          if os.path.exists(marker):
              print(f"removing pre-existing marker before verifying: {marker}")
              os.remove(marker)
          problems = []
          for path in [handoff, status] + [os.path.normpath(p) for p in proc["files"]]:
              if not os.path.exists(path):
                  print(f"missing expected file: {path}")
                  problems.append(f"missing expected file: {path}")
          if os.path.exists(status):
              try:
                  json.load(open(status))
              except Exception as exc:
                  print(f"status file is not valid JSON: {exc}")
                  problems.append(f"status file is not valid JSON: {exc}")
          check_results = []
          for cmd in proc["checks"]:
              print(f"$ {cmd}")
              result = subprocess.run(cmd, shell=True)
              check_results.append((cmd, result.returncode))
              if result.returncode != 0:
                  print(f"check failed (exit {result.returncode}): {cmd}")
                  problems.append(f"check failed (exit {result.returncode}): {cmd}")
          if problems:
              os.makedirs(os.path.dirname(marker), exist_ok=True)
              with open(marker, "w") as fh:
                  fh.write(f"process: {proc['id']}\n")
                  for cmd, rc in check_results:
                      fh.write(f"check exit {rc}: {cmd}\n")
                  for problem in problems:
                      fh.write(f"problem: {problem}\n")
              print("worker verification found problems; marker written, "
                    "evidence will still be committed and the job failed afterwards:")
              for problem in problems:
                  print(" -", problem)
          else:
              print("worker verification passed")
          PY

      - name: Commit, push worker branch, and post handoff
        # v2.6.3: run even when the verify step recorded red checks (or died
        # on the pytest-install guard), so the evidence lands before the
        # trailing step fails the job.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          PROCESS_ID: ${{ matrix.process.id }}
          PROCESS_TITLE: ${{ matrix.process.title }}
          PROCESS_JSON: ${{ toJSON(matrix.process) }}
          SUB_ISSUE_NUMBER: ${{ matrix.process.sub_issue_number }}
          BRANCH_SUFFIX: ${{ matrix.process.branch_suffix }}
        run: |
          SUFFIX="${BRANCH_SUFFIX:-}"
          BR="team/issue-${ISSUE_NUMBER}/run-${RUN_ID}/${PROCESS_ID}${SUFFIX}"
          git config user.name "droid-team-worker"
          git config user.email "droid-team-worker@localhost"
          if [ -z "${BASE_SHA:-}" ]; then
            echo "BASE_SHA not recorded; refusing to commit"
            exit 1
          fi
          # The worker session is told not to commit, but a prompt is not a
          # mechanism: squash any commits it made past the recorded base
          # back into the worktree, then verify the whole changed-file set
          # against the card before anything is staged (F-1).
          git reset --soft "$BASE_SHA"
          python3 - <<'PY'
          import json, os, subprocess, sys
          proc = json.loads(os.environ["PROCESS_JSON"])
          pid = proc["id"]
          def norm(p):
              return os.path.normpath(p.strip().strip('"'))
          allowed = {norm(f) for f in proc["files"]}
          allowed |= {f"team/handoffs/{pid}.md", f"team/status/{pid}.json",
                      f"team/status/{pid}.checks-failed.marker"}
          scratch = {"worker-prompt.txt", "worker-stream.jsonl"}
          out = subprocess.run(["git", "status", "--porcelain", "--untracked-files=all"],
                               capture_output=True, text=True).stdout
          changed = set()
          for line in out.splitlines():
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ")[-1]
              np = norm(path)
              parts = np.split("/")
              if parts[-1] in scratch or "__pycache__" in parts or ".pytest_cache" in parts or np.endswith(".pyc"):
                  continue
              changed.add(np)
          extras = sorted(changed - allowed)
          if extras:
              print("worker session changed files outside its card:", extras)
              sp = f"team/status/{pid}.json"
              try:
                  st = json.load(open(sp))
                  st["out_of_bounds"] = extras
                  json.dump(st, open(sp, "w"), ensure_ascii=False, indent=2)
              except Exception as exc:
                  print("could not annotate status.json:", exc)
              with open(f"team/handoffs/{pid}.md", "a") as fh:
                  fh.write("\n\n## 越界文件（工作流校验）\n\n本工序会话改动了卡外文件，提交被工作流拒绝：" + ", ".join(extras) + "\n")
              sys.exit(1)
          print("changed files within card scope:", sorted(changed))
          PY
          git checkout -b "$BR"
          # v2.6.3 (review fix): stage files one by one, each only if it
          # exists. A missing deliverable / handoff / status file is a
          # process-quality problem that prep/validator judge from the
          # evidence (missing items = blocked); it must not kill this step
          # on a pathspec error before the branch can land. The marker add
          # lives in the same loop, exactly once. This staging block is
          # identical in the round-1 and round-2 commit steps.
          jq -r '.files[]' <<<"$PROCESS_JSON" | while IFS= read -r f; do
            if [ -f "$f" ]; then git add -- "$f"; else echo "not staging missing file: $f"; fi
          done
          for f in "team/handoffs/${PROCESS_ID}.md" "team/status/${PROCESS_ID}.json" "team/status/${PROCESS_ID}.checks-failed.marker"; do
            if [ -f "$f" ]; then git add -- "$f"; else echo "not staging missing file: $f"; fi
          done
          if git diff --cached --quiet; then
            echo "worker produced no changes"
            exit 1
          fi
          git commit -m "team worker ${PROCESS_ID}: ${PROCESS_TITLE}"
          git push -u origin "$BR"
          {
            echo "## 工人交接：${PROCESS_TITLE} (\`${PROCESS_ID}\`)"
            echo ""
            echo "分支：\`$BR\`"
            echo ""
            cat "team/handoffs/${PROCESS_ID}.md"
          } > handoff-comment.md
          PYTHONPATH=scripts/team python3 scripts/team/post_comment_hard.py \
            --issue "$ISSUE_NUMBER" --body-file handoff-comment.md --hard-required
          if [ -n "${SUB_ISSUE_NUMBER:-}" ]; then
            PYTHONPATH=scripts/team python3 scripts/team/post_comment_hard.py \
              --issue "$SUB_ISSUE_NUMBER" --body-file handoff-comment.md --hard-required
          fi

      - name: Fail the job when process checks failed
        # v2.6.3: the verify step now exits 0 after recording red checks in
        # the marker (so the commit step above could land the evidence);
        # this step restores the job-level conclusion: red checks = failed
        # job, exactly as before, just with the evidence already pushed.
        if: ${{ !cancelled() }}
        env:
          PROCESS_ID: ${{ matrix.process.id }}
        run: |
          MARKER="team/status/${PROCESS_ID}.checks-failed.marker"
          if [ -f "$MARKER" ]; then
            echo "process checks failed for ${PROCESS_ID}; branch and handoff evidence were committed first, now failing the job:"
            cat "$MARKER"
            exit 1
          fi
          echo "no failed-checks marker for ${PROCESS_ID}; job outcome unchanged"

      - name: Record worker delta for ForemanRun (W1 matrix)
        if: always()
        env:
          PROCESS_ID: ${{ matrix.process.id }}
          JOB_STATUS: ${{ job.status }}
          DROID_EXIT_CODE: ${{ steps.session.outputs.exit_code }}
        run: |
          RESULT="success"
          if [ "$JOB_STATUS" = "cancelled" ]; then RESULT="cancelled"; fi
          if [ -f "team/status/${PROCESS_ID}.checks-failed.marker" ]; then RESULT="failure"; fi
          PYTHONPATH=scripts/team python3 scripts/team/write_worker_delta.py \
            --pid "$PROCESS_ID" --result "$RESULT" --out worker-delta.json \
            --stream worker-stream.jsonl
          if [ "$RESULT" = "cancelled" ]; then
            python3 -c "import json; d=json.load(open('worker-delta.json')); d['cancel_reason']='job_wall_25m'; d['session_outcome']='job_wall_cancelled'; json.dump(d,open('worker-delta.json','w'))"
          fi

      - name: Upload worker delta artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foreman-worker-delta-${{ matrix.process.id }}-${{ github.run_id }}
          path: worker-delta.json
          overwrite: true

  workers-wall-merge:
    name: workers-wall-merge (ForemanRun workers slice)
    needs: [lead, worker]
    if: >-
      always() && needs.lead.outputs.duplicate != 'true' &&
      (needs.lead.result == 'success' || needs.lead.result == 'failure' ||
      needs.lead.result == 'cancelled')
    runs-on: ubuntu-latest
    outputs:
      prep_should_run: ${{ steps.prep_gate.outputs.prep_should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ForemanRun wall
        uses: actions/download-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: wall-in

      - name: Download all worker deltas
        uses: actions/download-artifact@v4
        with:
          pattern: foreman-worker-delta-*-${{ github.run_id }}
          path: deltas

      - name: Merge worker deltas into wall
        id: merge_worker_deltas
        run: |
          if [ ! -f wall-in/foreman-run.json ]; then
            echo "foreman-run artifact missing in workers-wall-merge"
            exit 1
          fi
          cp wall-in/foreman-run.json foreman-run.json
          PYTHONPATH=scripts/team python3 scripts/team/merge_worker_deltas.py --wall foreman-run.json --delta-dir deltas

      - name: Prepare foreman-run for worker wall sync
        if: always()
        run: |
          if [ ! -f foreman-run.json ]; then
            if [ ! -f wall-in/foreman-run.json ]; then
              echo "foreman-run missing for worker wall sync"
              exit 1
            fi
            cp wall-in/foreman-run.json foreman-run.json
          fi

      - name: Re-merge worker deltas if merge step succeeded
        if: always() && steps.merge_worker_deltas.outcome == 'success'
        run: |
          if [ -d deltas ]; then
            PYTHONPATH=scripts/team python3 scripts/team/merge_worker_deltas.py \
              --wall foreman-run.json --delta-dir deltas
          fi

      - name: Sync worker chain seat from wall (W-11 / N-1)
        if: always()
        run: |
          PRODUCED="$(PYTHONPATH=scripts/team python3 -c "import json; w=json.load(open('foreman-run.json')); print('true' if (w.get('workers') or {}).get('completed_pids') else 'false')")"
          PYTHONPATH=scripts/team python3 scripts/team/wall_sync_job.py \
            --job worker \
            --result "${{ needs.worker.result }}" \
            --produced "$PRODUCED"

      - name: Prep gate from wall (I1)
        id: prep_gate
        run: |
          PYTHONPATH=scripts/team python3 - <<'PY'
          import json, os
          from foreman_run_lib import load_wall, prep_should_run
          wall = load_wall("foreman-run.json")
          flag = "true" if prep_should_run(wall) else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"prep_should_run={flag}\n")
          print("prep_should_run:", flag)
          PY

      - name: Upload foreman-run wall artifact
        if: always() && hashFiles('foreman-run.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: foreman-run.json
          overwrite: true

  prep:
    name: prep (merge and pack evidence)
    needs: [lead, worker, workers-wall-merge]
    if: >-
      ${{ !cancelled() && needs.lead.result == 'success' &&
      needs.workers-wall-merge.outputs.prep_should_run == 'true' &&
      needs.lead.outputs.duplicate != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate_branch: ${{ steps.prep.outputs.candidate_branch }}
      manifest_sha256: ${{ steps.prep.outputs.manifest_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download ForemanRun wall
        uses: actions/download-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: wall-in

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: team-plan-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: plan

      - name: Merge worker branches, run tests, pack evidence
        id: prep
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, sys
          import atexit, tarfile

          def _pack_evidence_tar():
              # v2.5: evidence.tar.gz must exist under ANY exit code of this
              # script (the Upload step runs if: always() but needs a file).
              # atexit covers normal returns, sys.exit() and exceptions.
              try:
                  if os.path.isdir("evidence"):
                      with tarfile.open("evidence.tar.gz", "w:gz") as tf:
                          for root, _dirs, files in os.walk("evidence"):
                              for name in files:
                                  path = os.path.join(root, name)
                                  tf.add(path, arcname=os.path.relpath(path, "evidence"))
              except Exception as exc:
                  print(f"evidence tar packing failed: {exc}")

          atexit.register(_pack_evidence_tar)

          issue = os.environ["ISSUE_NUMBER"]
          run_id = os.environ["RUN_ID"]
          plan = json.load(open("plan/team-plan.json"))

          def normp(p):
              return os.path.normpath(str(p).strip())

          # v2.6.4 (E): every subprocess in this job gets a timeout.
          # A hung child must surface as a recorded failure (exit 124,
          # the GNU timeout convention), never stall the step until the
          # 20-minute job wall kills it without evidence.
          RUN_TIMEOUT = 120
          PIP_TIMEOUT = 300
          PYTEST_FULL_TIMEOUT = 600
          CHECK_TIMEOUT = 300

          class _TimeoutResult:
              # CompletedProcess-shaped stand-in for a timed-out call,
              # so every existing caller (returncode checks, stdout /
              # stderr reads) takes its normal failure branch unchanged.
              def __init__(self, cmd, timeout, partial_out="", partial_err=""):
                  self.returncode = 124
                  self.stdout = partial_out or ""
                  self.stderr = (partial_err or "") + f"\nTIMEOUT after {timeout}s: {cmd}"

          def run(cmd, **kw):
              timeout = kw.pop("timeout", RUN_TIMEOUT)
              try:
                  return subprocess.run(cmd, capture_output=True, text=True, timeout=timeout, **kw)
              except subprocess.TimeoutExpired as exc:
                  print(f"subprocess timeout after {timeout}s: {cmd}")
                  out = exc.output.decode("utf-8", "replace") if isinstance(exc.output, bytes) else (exc.output or "")
                  err = exc.stderr.decode("utf-8", "replace") if isinstance(exc.stderr, bytes) else (exc.stderr or "")
                  return _TimeoutResult(cmd, timeout, out, err)

          def _count_passed(text):
              m = re.findall(r"(\d+) passed", text or "")
              return int(m[-1]) if m else 0

          def _count_skipped(text):
              m = re.findall(r"(\d+) skipped", text or "")
              return int(m[-1]) if m else 0

          def direct(cmd, **kw):
              # Post-review fix: the pytest probe / pip install / re-probe
              # call sites below keep their own arguments (the install
              # call deliberately streams uncaptured to the job log), but
              # share run()'s timeout semantics — a hang returns the
              # _TimeoutResult stand-in (exit 124, TIMEOUT noted) instead
              # of escaping as a bare TimeoutExpired traceback that would
              # kill the script before the evidence is written.
              try:
                  return subprocess.run(cmd, **kw)
              except subprocess.TimeoutExpired as exc:
                  timeout = kw.get("timeout", RUN_TIMEOUT)
                  print(f"subprocess timeout after {timeout}s: {cmd}")
                  out = exc.output.decode("utf-8", "replace") if isinstance(exc.output, bytes) else (exc.output or "")
                  err = exc.stderr.decode("utf-8", "replace") if isinstance(exc.stderr, bytes) else (exc.stderr or "")
                  return _TimeoutResult(cmd, timeout, out, err)

          base = run(["git", "rev-parse", "HEAD"]).stdout.strip()
          candidate = f"team/issue-{issue}/candidate-{run_id}"
          run(["git", "config", "user.name", "droid-team-prep"])
          run(["git", "config", "user.email", "droid-team-prep@localhost"])
          run(["git", "checkout", "-b", candidate])

          os.makedirs("evidence/packs", exist_ok=True)
          # v2.5: minimal manifest first (plan read, before any merging),
          # so an interrupted prep still leaves a readable manifest; the
          # full manifest overwrites it at the end of this script, and the
          # always() prep report renders a "prep incomplete" card from
          # this one instead of crashing.
          json.dump({"issue": issue, "run_id": run_id, "iteration": 1,
                     "candidate_branch": candidate, "pytest_exit": None,
                     "pytest_note": "", "packs": {}, "sha256": {}},
                    open("evidence/manifest.json", "w"), ensure_ascii=False, indent=2)
          packs = {}
          merged_any = False
          for proc in plan["processes"]:
              pid = proc["id"]
              branch = f"team/issue-{issue}/run-{run_id}/{pid}"
              pack_dir = f"evidence/packs/{pid}"
              os.makedirs(pack_dir, exist_ok=True)
              json.dump(proc, open(f"{pack_dir}/process-card.json", "w"), ensure_ascii=False, indent=2)
              info = {"branch": branch, "branch_present": False, "merged": False,
                      "merge_conflict": False}
              exists = run(["git", "ls-remote", "--exit-code", "origin", branch]).returncode == 0
              info["out_of_bounds"] = []
              if exists:
                  info["branch_present"] = True
                  run(["git", "fetch", "origin", branch])
                  allowed = {normp(f) for f in proc["files"]}
                  allowed |= {f"team/handoffs/{pid}.md", f"team/status/{pid}.json",
                              f"team/status/{pid}.checks-failed.marker"}
                  full = run(["git", "diff", "--name-only", f"{base}...origin/{branch}"])
                  extras = sorted({normp(p) for p in full.stdout.splitlines() if p.strip()} - allowed)
                  if extras:
                      info["out_of_bounds"] = extras
                      print(f"out-of-bounds files in {branch}: {extras}")
                  diff = run(["git", "diff", f"{base}...origin/{branch}", "--"] + proc["files"])
                  open(f"{pack_dir}/diff.patch", "w").write(diff.stdout)
                  merge = run(["git", "merge", "--no-ff", "--no-edit", f"origin/{branch}"])
                  if merge.returncode == 0:
                      info["merged"] = True
                      merged_any = True
                  else:
                      info["merge_conflict"] = True
                      run(["git", "merge", "--abort"])
                      print(f"merge conflict for {branch}: {merge.stdout} {merge.stderr}")
              packs[pid] = info

          pytest_available = True
          pytest_install_note = ""
          if direct(["python3", "-m", "pytest", "--version"],
                            capture_output=True, timeout=60).returncode != 0:
              print("pytest missing; installing deterministically (v2.1)")
              install_rc = direct(["python3", "-m", "pip", "install", "-q", "pytest"],
                                          timeout=PIP_TIMEOUT).returncode
              if install_rc != 0:
                  pytest_available = False
                  pytest_install_note = f"pytest install failed (pip exit {install_rc}); full test run not executed"
              elif direct(["python3", "-m", "pytest", "--version"],
                                  capture_output=True, timeout=60).returncode != 0:
                  pytest_available = False
                  pytest_install_note = "pytest still unavailable after install; full test run not executed"
          if pytest_available:
              try:
                  pytest_rc = subprocess.run(["python3", "-m", "pytest", "-q"],
                                             capture_output=True, text=True,
                                             timeout=PYTEST_FULL_TIMEOUT)
                  pytest_output = pytest_rc.stdout + pytest_rc.stderr
                  pytest_exit = pytest_rc.returncode
              except subprocess.TimeoutExpired as exc:
                  # v2.6.4 (E): a hung suite is a recorded failure (exit
                  # 124), not a silent stall until the job wall; the
                  # script still writes the evidence and the report.
                  out = exc.output.decode("utf-8", "replace") if isinstance(exc.output, bytes) else (exc.output or "")
                  err = exc.stderr.decode("utf-8", "replace") if isinstance(exc.stderr, bytes) else (exc.stderr or "")
                  pytest_output = out + err + f"\nTIMEOUT: full pytest run exceeded {PYTEST_FULL_TIMEOUT}s and was killed (v2.6.4)\n"
                  pytest_exit = 124
                  pytest_install_note = f"full pytest TIMEOUT after {PYTEST_FULL_TIMEOUT}s (killed); recorded as exit 124"
                  print(pytest_install_note)
          else:
              # Sentinel 127 (v2.4): pytest could not be installed. Evidence,
              # manifest and the prep report are still produced below; this
              # step exits non-zero only at the very end (failure on record).
              print(pytest_install_note)
              pytest_output = pytest_install_note + "\n"
              pytest_exit = 127
          open("evidence/pytest-output.txt", "w").write(pytest_output)
          open("evidence/pytest-exit.txt", "w").write(str(pytest_exit))
          print(f"full pytest exit: {pytest_exit}")

          def _focused_counts(card_out, checks):
              # I-4, scrutiny PR2-2b: a card's count is the count of THAT
              # card's focused check (its own file-level pytest run), never a
              # sum across the card's check commands — the card runs its
              # focused test AND the merged suite, and 18+240 must never be
              # reported as 258, a number corresponding to nothing. The last
              # summary line of the FIRST check (the focused one) wins.
              focused = (card_out.split("$ ", 2)[1] if card_out.count("$ ") else card_out) or ""
              return {"passed": _count_passed(focused), "skipped": _count_skipped(focused)}

          for proc in plan["processes"]:
              pid = proc["id"]
              pack_dir = f"evidence/packs/{pid}"
              info = packs[pid]
              for src, dst in ((f"team/handoffs/{pid}.md", "handoff.md"),
                               (f"team/status/{pid}.json", "status.json")):
                  if info["merged"] and os.path.exists(src):
                      open(f"{pack_dir}/{dst}", "w").write(open(src).read())
              # v2.6.3 (review fix): the worker's checks-failed marker joins
              # the pack as an evidence item (the candidate tree is stripped
              # of markers below, so the pack is its durable home). It is
              # deliberately NOT a key of info["pack"]: "complete" keeps
              # meaning the original five items, so a marker can neither
              # complete nor block a pack.
              marker_src = f"team/status/{pid}.checks-failed.marker"
              info["checks_failed_marker"] = bool(info["merged"] and os.path.exists(marker_src))
              if info["checks_failed_marker"]:
                  open(f"{pack_dir}/checks-failed.marker", "w").write(open(marker_src).read())
              exits = []
              out_lines = []
              if info["merged"] and not pytest_available:
                  out_lines.append("pytest unavailable (install failed); process checks not run, recorded as exit 127")
                  for cmd in proc["checks"]:
                      out_lines.append(f"$ {cmd}\n[exit 127] pytest unavailable: install failed")
                      exits.append({"command": cmd, "exit": 127})
              elif info["merged"]:
                  for cmd in proc["checks"]:
                      try:
                          r = subprocess.run(cmd, shell=True, capture_output=True, text=True,
                                             timeout=CHECK_TIMEOUT)
                          out_lines.append(f"$ {cmd}\n{r.stdout}{r.stderr}\n[exit {r.returncode}]")
                          exits.append({"command": cmd, "exit": r.returncode})
                      except subprocess.TimeoutExpired as exc:
                          # v2.6.4 (E): record the timeout as exit 124
                          # and keep running the remaining checks. With
                          # shell=True the timeout kills the shell;
                          # orphaned grandchildren are reaped when the
                          # job ends and no longer block the evidence.
                          out = exc.output.decode("utf-8", "replace") if isinstance(exc.output, bytes) else (exc.output or "")
                          err = exc.stderr.decode("utf-8", "replace") if isinstance(exc.stderr, bytes) else (exc.stderr or "")
                          out_lines.append(f"$ {cmd}\n{out}{err}\n[exit 124] TIMEOUT after {CHECK_TIMEOUT}s (killed)")
                          exits.append({"command": cmd, "exit": 124})
              else:
                  out_lines.append("branch not merged; process checks not run by prep")
              open(f"{pack_dir}/checks-output.txt", "w").write("\n".join(out_lines))
              json.dump(exits, open(f"{pack_dir}/checks-exit.json", "w"), indent=2)
              info["pack"] = {
                  "process_card": True,
                  "handoff": os.path.exists(f"{pack_dir}/handoff.md"),
                  "status": os.path.exists(f"{pack_dir}/status.json"),
                  "diff": os.path.exists(f"{pack_dir}/diff.patch"),
                  "checks_output": True,
              }
              info["complete"] = all(info["pack"].values()) and info["merged"] and not info.get("out_of_bounds")

          # I-4 (round54-root-cure): check-summary.json is the authoritative
          # count — per-card passed/skipped from the focused check prep ran
          # for that card, merged totals from the real pytest output. Written
          # AFTER the per-card checks loop (scrutiny PR2-2: the loop creates
          # checks-output.txt; a summary written before it reads zeros) and
          # BEFORE the manifest hashes the tree, so the pack's sha covers it.
          # Worker status files are never rewritten (evidence immutability).
          per_card = {}
          for proc in plan["processes"]:
              pid = proc["id"]
              out_path = f"evidence/packs/{pid}/checks-output.txt"
              card_out = open(out_path).read() if os.path.exists(out_path) else ""
              per_card[pid] = _focused_counts(card_out, proc["checks"])
          totals = {"passed": _count_passed(pytest_output), "skipped": _count_skipped(pytest_output)}
          json.dump({"schema_version": "check-summary.v1",
                     "per_card": per_card, "totals": totals},
                    open("evidence/check-summary.json", "w"), indent=2)
          print("check-summary:", json.dumps(totals))

          json.dump(plan, open("evidence/plan.json", "w"), ensure_ascii=False, indent=2)
          open("evidence/candidate-branch.txt", "w").write(candidate if merged_any else "")

          manifest = {"issue": issue, "run_id": run_id, "iteration": 1,
                      "candidate_branch": candidate if merged_any else "",
                      "pytest_exit": pytest_exit,
                      "pytest_note": pytest_install_note, "packs": packs, "sha256": {}}
          for root, _dirs, files in os.walk("evidence"):
              for name in files:
                  path = os.path.join(root, name)
                  if path == "evidence/manifest.json":
                      continue
                  manifest["sha256"][path] = hashlib.sha256(open(path, "rb").read()).hexdigest()
          json.dump(manifest, open("evidence/manifest.json", "w"), ensure_ascii=False, indent=2)
          print(json.dumps({pid: p["complete"] for pid, p in packs.items()}, indent=2))

          manifest_sha = hashlib.sha256(open("evidence/manifest.json", "rb").read()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"candidate_branch={candidate if merged_any else ''}\n")
              out.write(f"manifest_sha256={manifest_sha}\n")
          print("manifest sha256:", manifest_sha)
          if merged_any:
              # v2.6.3 (review fix): markers are evidence, not deliverables.
              # Every marker in the merged tree was copied into its pack
              # above; strip all of them from the candidate tree so they
              # can never ride the PR into the default branch.
              tracked = run(["git", "ls-files", "--", "team/status"]).stdout.split()
              markers = [p for p in tracked if p.endswith(".checks-failed.marker")]
              for p in markers:
                  run(["git", "rm", "-q", "--", p])
              if markers:
                  strip = run(["git", "commit", "-m", "team prep: strip checks-failed markers from candidate tree (kept in evidence packs)"])
                  if strip.returncode != 0:
                      print("marker strip commit failed:", strip.stdout, strip.stderr)
                      sys.exit(1)
                  print("stripped checks-failed markers from candidate tree:", markers)
              push = run(["git", "push", "-u", "origin", candidate])
              if push.returncode != 0:
                  print("candidate push failed:", push.stdout, push.stderr)
                  sys.exit(1)
          if not pytest_available:
              print("prep finishing as failure: pytest install failed (evidence and manifest already written)")
              sys.exit(1)
          PY

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-evidence-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: evidence.tar.gz
          overwrite: true

      - name: Post prep report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PLAN_ISSUE_NUMBER: ${{ needs.lead.outputs.plan_issue_number }}
        run: |
          python3 - <<'PY'
          import json, os
          manifest_missing = not os.path.exists("evidence/manifest.json")
          if manifest_missing:
              print("evidence/manifest.json missing (prep script died early); posting fallback report")
              manifest = {"candidate_branch": "", "pytest_exit": None, "pytest_note": "", "packs": {}}
          else:
              manifest = json.load(open("evidence/manifest.json"))
          packs = manifest.get("packs") or {}
          lines = ["## 备料报告（脚本 job）", "",
                   f"候选分支：`{manifest.get('candidate_branch') or '（无可合并分支）'}`",
                   f"全量 pytest 退出码：{manifest.get('pytest_exit')}", "",
                   "| 工序 | 料齐 | 缺件 |", "|---|---|---|"]
          if manifest.get("pytest_note"):
              note_tail = "" if "TIMEOUT" in manifest["pytest_note"] else "（退出码 127 为安装失败哨兵，全量测试未执行）"
              lines.insert(4, f"⚠ pytest 环境：{manifest['pytest_note']}{note_tail}")
          if not packs:
              lines.append("| — | 否 | 备料未完成（备料脚本未产出清单，脚本早段失败） |" if manifest_missing else "| — | 否 | 备料未完成（备料脚本未跑完，仅有最小清单） |")
          for pid, info in packs.items():
              info = info or {}
              missing = [k for k, v in (info.get("pack") or {}).items() if not v]
              if not info.get("merged"):
                  missing.append("未合并")
              if info.get("out_of_bounds"):
                  missing.append("越界文件：" + ", ".join(info["out_of_bounds"]))
              lines.append(f"| `{pid}` | {'是' if info.get('complete') else '否'} | {', '.join(missing) if missing else '—'} |")
          lines += ["", "料不齐的工序不予验收（没料不验收）：验收将对缺料工序直接判 blocked，理由记为料不齐。"]
          open("prep-comment.md", "w").write("\n".join(lines))
          print("\n".join(lines))
          PY
          PYTHONPATH=scripts/team python3 scripts/team/post_comment_hard.py \
            --issue "$ISSUE_NUMBER" --body-file prep-comment.md --hard-required
          if [ -n "${PLAN_ISSUE_NUMBER:-}" ]; then
            PYTHONPATH=scripts/team python3 scripts/team/post_comment_hard.py \
              --issue "$PLAN_ISSUE_NUMBER" --body-file prep-comment.md --hard-required
          fi

      - name: Patch ForemanRun (prep)
        if: always()
        run: |
          if [ ! -f wall-in/foreman-run.json ]; then
            echo "foreman-run missing in prep patch"
            exit 1
          fi
          cp wall-in/foreman-run.json foreman-run.json
          PREP_RESULT="${{ steps.prep.outcome == 'success' && 'success' || 'failure' }}"
          PYTHONPATH=scripts/team python3 scripts/team/wall_sync_job.py \
            --job prep --result "$PREP_RESULT" --produced true

      - name: Upload foreman-run wall artifact
        if: always() && hashFiles('foreman-run.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: foreman-run.json
          overwrite: true

  validate:
    name: validator (squad-leader style, evidence only)
    needs: prep
    if: ${{ !cancelled() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      EXPECTED_MANIFEST_SHA: ${{ needs.prep.outputs.manifest_sha256 }}
    outputs:
      overall: ${{ steps.adopt.outputs.overall }}
      failed_processes: ${{ steps.adopt.outputs.failed_processes }}
      unattributed_failure: ${{ steps.adopt.outputs.unattributed_failure }}
      should_replan: ${{ steps.replan_gate.outputs.should_replan }}
      should_revalidate: ${{ steps.replan_gate.outputs.should_revalidate }}
      validate_job_conclusion: ${{ steps.validate_conclusion.outputs.validate_job_conclusion }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ForemanRun wall (W1)
        uses: actions/download-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: wall-in

      - name: Download evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: team-evidence-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}

      - name: Extract and precheck evidence packs
        id: pre
        timeout-minutes: 2
        run: |
          mkdir -p work
          tar -xzf evidence.tar.gz -C work
          python3 - <<'PY'
          import hashlib, json, os, sys
          expected_sha = os.environ.get("EXPECTED_MANIFEST_SHA", "")
          actual_sha = hashlib.sha256(open("work/manifest.json", "rb").read()).hexdigest()
          if not expected_sha or actual_sha != expected_sha:
              print(f"manifest sha256 mismatch: expected {expected_sha!r}, actual {actual_sha}; refusing to judge")
              sys.exit(1)
          print("manifest sha256 verified against prep output:", actual_sha)
          manifest = json.load(open("work/manifest.json"))
          bad = []
          for path, digest in manifest["sha256"].items():
              local = "work/" + path[len("evidence/"):] if path.startswith("evidence/") else path
              if not os.path.exists(local) or hashlib.sha256(open(local, "rb").read()).hexdigest() != digest:
                  bad.append(path)
          if bad:
              print("evidence integrity check failed:", bad)
              sys.exit(1)
          judgeable, blocked = [], {}
          for pid, info in manifest["packs"].items():
              if info["complete"]:
                  judgeable.append(pid)
              else:
                  missing = [k for k, v in info["pack"].items() if not v]
                  if not info["merged"]:
                      missing.append("未合并")
                  if info.get("out_of_bounds"):
                      missing.append("越界文件：" + ", ".join(info["out_of_bounds"]))
                  blocked[pid] = missing
          json.dump(judgeable, open("work/judgeable.json", "w"))
          json.dump(blocked, open("work/blocked.json", "w"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("judgeable=" + json.dumps(judgeable) + "\n")
          print("judgeable:", judgeable, "| blocked （料不齐）:", blocked)
          PY

      - name: Install droid CLI
        if: steps.pre.outputs.judgeable != '[]'
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Write BYOM settings (validator session)
        if: steps.pre.outputs.judgeable != '[]'
        env:
          WORKER_CI_KEY: ${{ secrets.WORKER_CI_KEY }}
          GO_GITHUB_RUN_TOKEN: ${{ secrets.GO_GITHUB_RUN_TOKEN }}
          GW_TOKEN_KNOWN: ${{ secrets.GW_TOKEN_KNOWN }}
          SESSION_NAME: team-validator
        run: |
          mkdir -p ~/.factory
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.factory/settings.json")
          s = {}
          if os.path.exists(p):
              s = json.load(open(p))
          headers = {
              "x-ci-key": os.environ.get("WORKER_CI_KEY", ""),
              "x-opencode-session": os.environ.get("SESSION_NAME", "team-validator"),
              "cf-aig-authorization": "Bearer " + os.environ.get("GW_TOKEN_KNOWN", ""),
          }
          s["customModels"] = [{
              "model": "dynamic/droid-review",
              "id": "custom:DeepSeek-V4.1-Flash-Go",
              "baseUrl": "https://droid-test.lumivane.dpdns.org",
              "apiKey": os.environ.get("GO_GITHUB_RUN_TOKEN", ""),
              "provider": "generic-chat-completion-api",
              "extraHeaders": headers,
          }]
          json.dump(s, open(p, "w"), indent=2)
          m = s["customModels"][0]
          print("settings check | model:", m["model"], "| baseUrl:", m["baseUrl"],
                "| apiKey present:", bool(m["apiKey"]),
                "| x-ci-key present:", bool(headers["x-ci-key"]),
                "| x-opencode-session present:", bool(headers["x-opencode-session"]),
                "| cf-aig-authorization present:", bool(headers["cf-aig-authorization"]))
          PY

      - name: Validator judges evidence packs only
        id: droid_validate
        if: steps.pre.outputs.judgeable != '[]'
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          ISSUE_TITLE: ${{ github.event.issue.title }}
          VALIDATOR_DROID_TIMEOUT_SECONDS: ${{ vars.VALIDATOR_DROID_TIMEOUT_SECONDS || '600' }}
        working-directory: work
        run: |
          set -o pipefail
          export REPO_ROOT="${GITHUB_WORKSPACE}"
          export PYTHONPATH="${REPO_ROOT}/scripts/team"
          TEAM_PY="${REPO_ROOT}/scripts/team"
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, os.path.join(os.environ["REPO_ROOT"], "scripts", "team"))
          from validator_prompt_template import build_validator_prompt
          judgeable = json.load(open("judgeable.json"))
          prompt = build_validator_prompt(judgeable, round_num=1)
          open("validator-prompt.txt", "w").write(prompt)
          PY
          cp ../wall-in/foreman-run.json ../foreman-run.json
          OVERRIDE_ARGS=""
          if [[ "$ISSUE_TITLE" == "[I8] API墙活验 A 采认失败" ]] || [[ "$ISSUE_TITLE" == "[I8] API墙活验 D 半套artifact" ]]; then
            OVERRIDE_ARGS="--droid-wall-override-sec ${VALIDATOR_DROID_TIMEOUT_SECONDS:-600}"
          fi
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from budget_resolve import validator_session_budget
          w = json.load(open("../foreman-run.json"))
          droid, adopt = validator_session_budget(w)
          print(f"VALIDATOR_DROID_WALL_SEC={droid}")
          print(f"ADOPT_RESERVE_SEC={adopt}")
          PY
          echo "validator session budget (wall): droid=${VALIDATOR_DROID_WALL_SEC}s adopt_reserve=${ADOPT_RESERVE_SEC}s (I8-A/D may override droid wall only)"
          FOREMAN_RUN_PATCH=1 python3 "${TEAM_PY}/run_droid_session.py" \
            --wall ../foreman-run.json --role validator \
            --prompt-file validator-prompt.txt \
            --stream-out validator-stream.jsonl \
            --exit-out droid-exit.txt \
            $OVERRIDE_ARGS
          cp ../foreman-run.json ../wall-in/foreman-run.json

      - name: Upload validator droid stream (W-13)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droid-stream-validator-run-${{ github.run_id }}
          path: |
            work/validator-stream.jsonl
            work/verdict-partial.json
          if-no-files-found: warn

      - name: Merge verdict, enforce gates, verify evidence untouched
        id: verdict
        if: always()
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, sys
          sys.path.insert(0, os.path.join(os.environ.get("GITHUB_WORKSPACE", "."), "scripts", "team"))
          from salvage_assemble import assemble_assembled_draft
          expected_sha = os.environ.get("EXPECTED_MANIFEST_SHA", "")
          actual_sha = hashlib.sha256(open("work/manifest.json", "rb").read()).hexdigest()
          if not expected_sha or actual_sha != expected_sha:
              print(f"manifest sha256 changed since precheck: expected {expected_sha!r}, actual {actual_sha}; verdict refused")
              sys.exit(1)
          manifest = json.load(open("work/manifest.json"))
          plan = json.load(open("work/plan.json"))
          judgeable = json.load(open("work/judgeable.json")) if os.path.exists("work/judgeable.json") else []
          blocked = json.load(open("work/blocked.json")) if os.path.exists("work/blocked.json") else {}
          merge_ran = bool(judgeable and os.path.exists("work/verdict-droid.json"))
          # I-6: no live draft (the usual exit-124 shape) but a sealed full
          # partial on disk -> the machine assembles the draft and the merge
          # proceeds on it. Anything less leaves merge_ran false; the adopt
          # library then routes draft_timeout to the revalidate chain.
          if judgeable and not merge_ran:
              assembled = assemble_assembled_draft(__import__("pathlib").Path("work"), judgeable)
              if assembled is not None:
                  open("work/verdict-droid.json", "w").write(json.dumps(assembled, ensure_ascii=False, indent=2))
                  merge_ran = True
                  print("draft machine-assembled from sealed verdict-partial.json (full judgeable coverage)")

          for path, digest in manifest["sha256"].items():
              local = "work/" + path[len("evidence/"):] if path.startswith("evidence/") else path
              if not os.path.exists(local) or hashlib.sha256(open(local, "rb").read()).hexdigest() != digest:
                  print("validator modified evidence:", path)
                  sys.exit(1)

          verdicts = {}
          if judgeable and merge_ran:
              droid = json.load(open("work/verdict-droid.json"))
              entries = droid.get("processes", [])
              if sorted(p.get("id") for p in entries) != sorted(judgeable):
                  print(f"verdict coverage mismatch (multiset): judged {sorted(p.get('id') for p in entries)}, expected {sorted(judgeable)}")
                  sys.exit(1)
              got = {p["id"]: p for p in entries}
              for pid, entry in got.items():
                  if entry.get("verdict") not in ("pass", "fail"):
                      print("invalid verdict value:", entry)
                      sys.exit(1)
                  verdicts[pid] = {"id": pid, "verdict": entry["verdict"],
                                   "reason": entry.get("reason", "")}
          for pid, missing in blocked.items():
              verdicts[pid] = {"id": pid, "verdict": "blocked",
                               "reason": "料不齐（没料不验收）：缺 " + ", ".join(missing) + "（缺件归该工序补齐）"}

          expected_ids = sorted(p["id"] for p in plan["processes"])
          if sorted(verdicts) != expected_ids:
              # I-6: a mismatch here means the validator never judged and
              # never sealed a full partial — no merge artifacts to assemble.
              # Do NOT exit the step: fill the missing processes as blocked
              # and let the adopt library classify (draft_timeout ->
              # revalidate, fail-closed). The old immediate exit-1 killed
              # round-54 A/C even with a sealed full partial recoverable.
              print(f"final coverage mismatch (multiset): {sorted(verdicts)} vs {expected_ids}; routing through adopt classification")
              for pid in sorted(set(expected_ids) - set(verdicts)):
                  verdicts[pid] = {"id": pid, "verdict": "blocked",
                                   "reason": "validator 会话未产出该工序判定（机器组装无源，走重验链）"}
          # v2.6.4 (C): carry the validator's escalated conflicts into the
          # verdict as a top-level array. Entries are shape-checked loosely
          # on purpose: a malformed optional entry is dropped with a warning
          # instead of failing the whole validation job (unlike the strict
          # processes coverage check above).
          conflicts = []
          if judgeable and merge_ran:
              for centry in droid.get("conflicts") or []:
                  if isinstance(centry, dict) and centry.get("process") and centry.get("summary"):
                      conflicts.append({"process": centry["process"],
                                        "summary": centry["summary"],
                                        "evidence": centry.get("evidence", "")})
                  else:
                      print("dropping malformed conflicts entry:", centry)

          pytest_exit = manifest.get("pytest_exit", 1)
          overall = "pass" if all(v["verdict"] == "pass" for v in verdicts.values()) and pytest_exit == 0 else "fail"
          failed = [pid for pid, v in verdicts.items() if v["verdict"] != "pass"]
          # v2.6.4 (A): the unattributed-failure case — every process
          # verdict is pass yet the merged suite is red, so the failed list
          # above is empty and (before v2.6.4) nothing downstream could
          # act. Extract the failing tests deterministically from the
          # pytest output (summary FAILED lines first, failure-section
          # headers as fallback) so replan can attribute them by card
          # file ownership.
          failing_tests = []
          failing_tests_truncated = False
          if overall == "fail" and not failed:
              raw_pytest = ""
              if os.path.exists("work/pytest-output.txt"):
                  raw_pytest = open("work/pytest-output.txt").read()
              seen_tests = set()
              for tline in raw_pytest.splitlines():
                  test_id = None
                  if tline.startswith("FAILED "):
                      test_id = tline[len("FAILED "):].split(" - ")[0].strip()
                  else:
                      m_fail = re.match(r"^_{3,}\s+(\S+)\s+_{3,}$", tline.strip())
                      if m_fail:
                          test_id = m_fail.group(1)
                  if test_id and test_id not in seen_tests:
                      seen_tests.add(test_id)
                      failing_tests.append(test_id)
              if len(failing_tests) > 50:
                  failing_tests_truncated = True
                  print(f"failing_tests truncated to 50 of {len(failing_tests)}")
                  failing_tests = failing_tests[:50]
          unattributed_failure = bool(overall == "fail" and not failed)
          verdict = {"overall": overall, "pytest_exit": pytest_exit,
                     "iteration": manifest.get("iteration", 1),
                     "processes": [verdicts[p["id"]] for p in plan["processes"]],
                     "conflicts": conflicts,
                     "failing_tests": failing_tests,
                     "unattributed_failure": unattributed_failure}
          json.dump(verdict, open("verdict.json", "w"), ensure_ascii=False, indent=2)

          lines = []
          if os.path.exists("work/verdict-droid.md"):
              lines.append(open("work/verdict-droid.md").read())
          lines += ["", "## 机器闸与缺料判定（脚本）", "",
                    f"全量 pytest 退出码：{pytest_exit}（非 0 时 overall 强制 fail）"]
          for pid, missing in blocked.items():
              lines.append(f"- `{pid}`：blocked — 料不齐，缺 {', '.join(missing)}（缺件归该工序补齐）")
          if unattributed_failure:
              trunc_note = "（已截断至 50 条）" if failing_tests_truncated else ""
              lines.append(f"无主失败：逐工序全 pass 但合并 pytest 退出码 {pytest_exit}，失败测试见 verdict.json 的 failing_tests（共 {len(failing_tests)} 条{trunc_note}）。")
          if conflicts:
              lines += ["", "## 工单层冲突（验收员升级记录）", ""]
              for c in conflicts:
                  lines.append(f"- `{c['process']}`：{c['summary']}（证据：{c.get('evidence', '')}）")
          lines += ["", f"总判定：**{overall}**"]
          open("verdict.md", "w").write("\n".join(lines))

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"overall={overall}\n")
              out.write("failed_processes=" + json.dumps(failed) + "\n")
              out.write(f"unattributed_failure={'true' if unattributed_failure else 'false'}\n")
          print("overall:", overall, "| failed:", failed, "| unattributed_failure:", unattributed_failure)
          PY

      - name: Adopt verdict into ForemanRun wall (P0-1)
        id: adopt
        if: always()
        run: |
          if [ ! -f foreman-run.json ]; then
            if [ ! -f wall-in/foreman-run.json ]; then
              echo "foreman-run missing before adopt"
              exit 1
            fi
            cp wall-in/foreman-run.json foreman-run.json
          fi
          DROID_EXIT=-1
          [ -f work/droid-exit.txt ] && DROID_EXIT=$(cat work/droid-exit.txt)
          MERGE_FLAG=""
          [ -f verdict.json ] && MERGE_FLAG="--merge-step-ran"
          FOREMAN_RUN_PATCH=1 PYTHONPATH=scripts/team python3 scripts/team/run_adopt_step.py \
            --wall foreman-run.json --work-dir work --droid-exit "$DROID_EXIT" \
            --github-output "$GITHUB_OUTPUT" $MERGE_FLAG
        env:
          PYTHONPATH: scripts/team

      - name: Compute replan gate (Y1)
        id: replan_gate
        if: always()
        run: |
          PYTHONPATH=scripts/team python3 scripts/team/compute_replan_gate.py \
            --wall foreman-run.json --github-output "$GITHUB_OUTPUT"

      - name: Derive validate job conclusion (W4)
        id: validate_conclusion
        if: always()
        run: |
          PYTHONPATH=scripts/team python3 scripts/team/compute_validate_conclusion.py \
            --wall foreman-run.json --github-output "$GITHUB_OUTPUT"

      - name: Sync validate chain seat from wall (W4 / W-11)
        if: always()
        run: |
          PYTHONPATH=scripts/team python3 scripts/team/wall_sync_job.py \
            --job validate --result "$(python3 -c "import json;print(json.load(open('foreman-run.json'))['validation'].get('job_conclusion_derived','failure'))")" \
            --produced "$(python3 -c "import json;a=json.load(open('foreman-run.json'))['artifacts'];k=[x for x in a if x.startswith('team-verdict')][0];print('true' if a[k]['complete'] else 'false')")"

      - name: Assert verdict artifact complete (B2)
        id: assert_verdict
        if: always()
        run: |
          PYTHONPATH=scripts/team python3 scripts/team/assert_artifact_complete.py \
            --wall foreman-run.json \
            --name team-verdict-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}

      - name: Upload verdict artifact
        if: steps.assert_verdict.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: team-verdict-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: |
            verdict.json
            verdict.md
          overwrite: true

      - name: Upload foreman-run wall artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: foreman-run.json
          overwrite: true

      - name: Fail validate job when adoption failed (W6)
        if: always()
        run: |
          PYTHONPATH=scripts/team python3 scripts/team/compute_validate_conclusion.py --wall foreman-run.json

  revalidate:
    name: validator revalidate (single retry, evidence pack reused)
    needs: [validate, prep]
    if: ${{ !cancelled() && needs.validate.outputs.should_revalidate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      EXPECTED_MANIFEST_SHA: ${{ needs.prep.outputs.manifest_sha256 }}
    outputs:
      overall: ${{ steps.adopt.outputs.overall }}
      failed_processes: ${{ steps.adopt.outputs.failed_processes }}
      unattributed_failure: ${{ steps.adopt.outputs.unattributed_failure }}
      should_replan: ${{ steps.replan_gate.outputs.should_replan }}
      validate_job_conclusion: ${{ steps.validate_conclusion.outputs.validate_job_conclusion }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ForemanRun wall (W1)
        uses: actions/download-artifact@v4
        with:
          name: foreman-run-${{ github.run_id }}
          path: wall-in

      - name: Refuse a second revalidate, stamp this run started (at most one, fail-closed)
        run: |
          if [ ! -f wall-in/foreman-run.json ]; then
            echo "foreman-run missing before revalidate guard"
            exit 1
          fi
          STARTED=$(python3 -c "import json;g=json.load(open('wall-in/foreman-run.json')).get('replan_gate') or {};print('true' if g.get('revalidate_run_started') else 'false')")
          if [ "$STARTED" = "true" ]; then
            echo "revalidate already ran once; refusing to run again (fail-closed)"
            exit 1
          fi
          # The attempt marker is stamped when the retry session actually
          # starts (not when adopt requested it): a first-timeout wall never
          # talks its own one legitimate retry out of running.
          python3 -c "
          import json
          w = json.load(open('wall-in/foreman-run.json'))
          g = w.get('replan_gate') or {}
          g['revalidate_run_started'] = True
          w['replan_gate'] = g
          json.dump(w, open('wall-in/foreman-run.json', 'w'), ensure_ascii=False, indent=2)
          "
          echo "first revalidate attempt: run-start marker stamped, proceeding"

      - name: Download evidence artifact (same pack, sha unchanged)
        uses: actions/download-artifact@v4
        with:
          name: team-evidence-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}

      - name: Extract evidence and keep verdict inputs
        timeout-minutes: 2
        run: |
          mkdir -p work
          tar -xzf evidence.tar.gz -C work
          # The validator's partial file (if the killed session recorded any
          # conclusions) lives in the stream artifact, not the evidence pack;
          # the fresh work dir judges the pack as-is.
          python3 - <<'PY'
          import hashlib, json, os, sys
          expected_sha = os.environ.get("EXPECTED_MANIFEST_SHA", "")
          actual_sha = hashlib.sha256(open("work/manifest.json", "rb").read()).hexdigest()
          if not expected_sha or actual_sha != expected_sha:
              print(f"manifest sha256 mismatch: expected {expected_sha!r}, actual {actual_sha}; refusing to judge")
              sys.exit(1)
          print("manifest sha256 verified against prep output:", actual_sha)
          manifest = json.load(open("work/manifest.json"))
          bad = []
          for path, digest in manifest["sha256"].items():
              local = "work/" + path[len("evidence/"):] if path.startswith("evidence/") else path
              if not os.path.exists(local) or hashlib.sha256(open(local, "rb").read()).hexdigest() != digest:
                  bad.append(path)
          if bad:
              print("evidence integrity check failed:", bad)
              sys.exit(1)
          judgeable, blocked = [], {}
          for pid, info in manifest["packs"].items():
              if info["complete"]:
                  judgeable.append(pid)
              else:
                  missing = [k for k, v in info["pack"].items() if not v]
                  if not info["merged"]:
                      missing.append("未合并")
                  if info.get("out_of_bounds"):
                      missing.append("越界文件：" + ", ".join(info["out_of_bounds"]))
                  blocked[pid] = missing
          json.dump(judgeable, open("work/judgeable.json", "w"))
          json.dump(blocked, open("work/blocked.json", "w"))
          print("revalidate judgeable:", judgeable, "| blocked:", blocked)
          PY

      - name: Install droid CLI
        if: steps.pre.outputs.judgeable != '[]'
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Write BYOM settings (validator revalidate session)
        if: steps.pre.outputs.judgeable != '[]'
        env:
          WORKER_CI_KEY: ${{ secrets.WORKER_CI_KEY }}
          GO_GITHUB_RUN_TOKEN: ${{ secrets.GO_GITHUB_RUN_TOKEN }}
          GW_TOKEN_KNOWN: ${{ secrets.GW_TOKEN_KNOWN }}
          SESSION_NAME: team-validator
        run: |
          mkdir -p ~/.factory
          python3 - <<'PY'
