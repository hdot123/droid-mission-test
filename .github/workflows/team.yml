name: Droid Team v2 (foreman pattern test)

# Foreman pattern （领班制）, v2:
#   env-check (reusable gate, GitHub side only)
#   -> lead/foreman splits the order and files the [计划] issue + sub-issues
#   -> workers (one process card each, parallel)
#   -> prep (script job: merge + tests + evidence packs, validator never merges)
#   -> validate (squad-leader style: pre-packed evidence only, no GitHub token,
#      soft timeout, single structured verdict; no pack = no judging)
#   -> replan (foreman revises the plan / re-dispatches, at most one extra round)
#   -> worker2 / prep2 / validate2 when a replan happened
#   -> assemble (final status card, sub-issue close-out, PR attempt)

on:
  issue_comment:
    types: [created]

concurrency:
  group: team-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  env-check:
    name: env-check (gate)
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@team-droid')
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/env-check.yml
    with:
      issue_number: ${{ github.event.issue.number }}
      project_number: 33
    secrets: inherit

  lead:
    name: lead (foreman splits and files the plan)
    needs: env-check
    if: needs.env-check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      processes: ${{ steps.plan.outputs.processes }}
      plan_issue_number: ${{ steps.plan.outputs.plan_issue_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install droid CLI
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Write BYOM settings (lead session)
        env:
          WORKER_CI_KEY: ${{ secrets.WORKER_CI_KEY }}
          GO_GITHUB_RUN_TOKEN: ${{ secrets.GO_GITHUB_RUN_TOKEN }}
          GW_TOKEN_KNOWN: ${{ secrets.GW_TOKEN_KNOWN }}
          SESSION_NAME: team-lead
        run: |
          mkdir -p ~/.factory
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.factory/settings.json")
          s = {}
          if os.path.exists(p):
              s = json.load(open(p))
          headers = {
              "x-ci-key": os.environ.get("WORKER_CI_KEY", ""),
              "x-opencode-session": os.environ.get("SESSION_NAME", "team-lead"),
              "cf-aig-authorization": "Bearer " + os.environ.get("GW_TOKEN_KNOWN", ""),
          }
          s["customModels"] = [{
              "model": "dynamic/droid-review",
              "id": "custom:DeepSeek-V4.1-Flash-Go",
              "baseUrl": "https://droid-test.lumivane.dpdns.org",
              "apiKey": os.environ.get("GO_GITHUB_RUN_TOKEN", ""),
              "provider": "generic-chat-completion-api",
              "extraHeaders": headers,
          }]
          json.dump(s, open(p, "w"), indent=2)
          m = s["customModels"][0]
          print("settings check | model:", m["model"], "| baseUrl:", m["baseUrl"],
                "| apiKey present:", bool(m["apiKey"]),
                "| x-ci-key present:", bool(headers["x-ci-key"]),
                "| x-opencode-session present:", bool(headers["x-opencode-session"]),
                "| cf-aig-authorization present:", bool(headers["cf-aig-authorization"]))
          PY

      - name: Foreman splits the order into process cards
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          set -o pipefail
          python3 - <<'PY'
          import json, os
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          issue = ev.get("issue") or {}
          title = issue.get("title", "")
          body = issue.get("body") or ""
          prompt = f"""You are the FOREMAN （领班） of a development team under the foreman pattern. Your only job is to split the work order into process cards. You never write application code yourself. Do not edit any file except team-plan.json in the repository root.

          Work order title: {title}

          Work order body:
          {body}

          Create team-plan.json with exactly this JSON shape:
          {{
            "summary": "one short sentence",
            "processes": [
              {{
                "id": "short-kebab-id",
                "title": "process title",
                "scope": "what this process owns and does not own",
                "files": ["file this process may create or edit", "its test file"],
                "task": "complete instructions for one worker",
                "checks": ["one shell command that verifies this process"]
              }}
            ]
          }}

          Rules:
          - Split along module boundaries into exactly 3 independent processes.
          - Processes must not depend on each other and must not share files, except that every worker may also write its own handoff and status files under team/.
          - Each process gets exactly one worker, one job, and a short lease.
          - The checks must be runnable from the repository root.
          - Write valid JSON only into team-plan.json. Do not wrap it in Markdown.
          """
          open("lead-prompt.txt", "w").write(prompt)
          PY
          ~/.local/bin/droid exec --auto high -m "custom:DeepSeek-V4.1-Flash-Go" --output-format stream-json "$(cat lead-prompt.txt)" | tee lead-stream.jsonl

      - name: Validate plan, file [计划] issue and sub-issues
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          repo = os.environ["GITHUB_REPOSITORY"]
          issue_number = os.environ["ISSUE_NUMBER"]
          run_id = os.environ["RUN_ID"]

          def gh(*args, check=True):
              r = subprocess.run(["gh", *args], capture_output=True, text=True)
              if check and r.returncode != 0:
                  print("gh failed:", " ".join(args), r.stdout, r.stderr)
                  sys.exit(1)
              return r

          plan = json.load(open("team-plan.json"))
          processes = plan.get("processes") or []
          if len(processes) != 3:
              print(f"plan must contain exactly 3 processes, got {len(processes)}")
              sys.exit(1)
          seen_files = {}
          for proc in processes:
              for key in ("id", "title", "scope", "files", "task", "checks"):
                  if not proc.get(key):
                      print(f"process missing {key}: {proc}")
                      sys.exit(1)
              for f in proc["files"]:
                  if f in seen_files:
                      print(f"file owned by two processes: {f}")
                      sys.exit(1)
                  seen_files[f] = proc["id"]
          plan["plan_version"] = 1
          plan["iteration"] = 1

          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          order_title = (ev.get("issue") or {}).get("title", "")

          def find_issue(title):
              r = gh("issue", "list", "--state", "all", "--limit", "100",
                     "--search", f'"{title}" in:title', "--json", "number,title")
              for item in json.loads(r.stdout or "[]"):
                  if item.get("title") == title:
                      return item["number"]
              return None

          def create_issue(title, body):
              found = find_issue(title)
              if found:
                  return found
              open("issue-body.tmp.md", "w").write(body)
              r = gh("issue", "create", "--title", title, "--body-file", "issue-body.tmp.md")
              url = r.stdout.strip().splitlines()[-1]
              return int(url.rstrip("/").split("/")[-1])

          plan_title = f"[计划] 工单 #{issue_number} · run {run_id} · {order_title}"[:200]
          plan_lines = [f"# [计划] 工单 #{issue_number} 的执行计划（领班制）", "",
                        f"来源工单：#{issue_number}", f"运行：run {run_id}", "",
                        f"总述：{plan.get('summary', '')}", "", "## 工序卡清单", ""]
          for i, proc in enumerate(processes, 1):
              plan_lines += [f"### 工序 {i}：{proc['title']} (`{proc['id']}`)",
                             f"- 范围：{proc['scope']}",
                             f"- 文件：{', '.join(proc['files'])}",
                             f"- 任务：{proc['task']}",
                             f"- 检查：{'; '.join(proc['checks'])}", ""]
          plan_lines.append("本计划由领班 job 落成；工序以本单的 sub-issues 执行，进度看本单的 Sub-issues progress。")
          plan_number = create_issue(plan_title, "\n".join(plan_lines))
          print("plan issue:", plan_number)

          for proc in processes:
              child_title = f"[工序] {proc['id']} · 工单 #{issue_number} · run {run_id}"
              child_body = "\n".join([
                  f"# 工序卡：{proc['title']} (`{proc['id']}`)", "",
                  f"父计划：#{plan_number}", f"来源工单：#{issue_number}", "",
                  f"范围：{proc['scope']}", "",
                  f"文件：{', '.join(proc['files'])}", "",
                  f"任务：{proc['task']}", "",
                  f"检查：{'; '.join(proc['checks'])}", "",
                  "工人按本卡施工，交接记录与状态文件落在代码分支的 team/ 目录；验收过关后由汇总 job 关单。",
              ])
              child_number = create_issue(child_title, child_body)
              r = gh("api", f"repos/{repo}/issues/{child_number}", "--jq", ".id")
              child_id = int(r.stdout.strip())
              attach = gh("api", "--method", "POST",
                          f"repos/{repo}/issues/{plan_number}/sub_issues",
                          "-F", f"sub_issue_id={child_id}", check=False)
              linked = attach.returncode == 0
              if not linked:
                  note = ("sub-issue 挂接失败（原文）：" + (attach.stderr or attach.stdout).strip()[:300])
                  gh("issue", "comment", str(child_number), "--body",
                     f"父计划：#{plan_number}。{note}", check=False)
                  gh("issue", "comment", str(plan_number), "--body",
                     f"工序 `{proc['id']}` 子单 #{child_number}：{note}", check=False)
              proc["sub_issue_number"] = child_number
              proc["sub_issue_linked"] = linked
              print("sub-issue:", proc["id"], "->", child_number, "linked:", linked)

          json.dump(plan, open("team-plan.json", "w"), ensure_ascii=False, indent=2)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("processes=" + json.dumps(processes, ensure_ascii=False) + "\n")
              out.write(f"plan_issue_number={plan_number}\n")

          lines = ["## 领班派单卡", "",
                   f"计划已落成：[计划] #{plan_number}（工序在该单下以 sub-issues 执行）",
                   "", f"总述：{plan.get('summary', '')}", ""]
          for i, proc in enumerate(processes, 1):
              lines += [f"### 工序 {i}：{proc['title']} (`{proc['id']}`) → 子单 #{proc['sub_issue_number']}",
                        f"- 范围：{proc['scope']}",
                        f"- 文件：{', '.join(proc['files'])}",
                        f"- 检查：{'; '.join(proc['checks'])}", ""]
          lines.append("状态代偿记录：已派单（板面字段由 workflow 代偿写在此处，Projects 字段直写待令牌方案）。")
          open("plan-comment.md", "w").write("\n".join(lines))
          print("\n".join(lines))
          PY
          gh issue comment "$ISSUE_NUMBER" --body-file plan-comment.md

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-plan-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: team-plan.json

  worker:
    name: worker
    needs: lead
    if: needs.lead.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        process: ${{ fromJSON(needs.lead.outputs.processes) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install droid CLI
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Write BYOM settings (worker session)
        env:
          WORKER_CI_KEY: ${{ secrets.WORKER_CI_KEY }}
          GO_GITHUB_RUN_TOKEN: ${{ secrets.GO_GITHUB_RUN_TOKEN }}
          GW_TOKEN_KNOWN: ${{ secrets.GW_TOKEN_KNOWN }}
          SESSION_NAME: team-worker-${{ matrix.process.id }}
        run: |
          mkdir -p ~/.factory
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.factory/settings.json")
          s = {}
          if os.path.exists(p):
              s = json.load(open(p))
          headers = {
              "x-ci-key": os.environ.get("WORKER_CI_KEY", ""),
              "x-opencode-session": os.environ.get("SESSION_NAME", "team-worker"),
              "cf-aig-authorization": "Bearer " + os.environ.get("GW_TOKEN_KNOWN", ""),
          }
          s["customModels"] = [{
              "model": "dynamic/droid-review",
              "id": "custom:DeepSeek-V4.1-Flash-Go",
              "baseUrl": "https://droid-test.lumivane.dpdns.org",
              "apiKey": os.environ.get("GO_GITHUB_RUN_TOKEN", ""),
              "provider": "generic-chat-completion-api",
              "extraHeaders": headers,
          }]
          json.dump(s, open(p, "w"), indent=2)
          m = s["customModels"][0]
          print("settings check | model:", m["model"], "| baseUrl:", m["baseUrl"],
                "| apiKey present:", bool(m["apiKey"]),
                "| x-ci-key present:", bool(headers["x-ci-key"]),
                "| x-opencode-session present:", bool(headers["x-opencode-session"]),
                "| cf-aig-authorization present:", bool(headers["cf-aig-authorization"]))
          PY

      - name: Worker executes exactly one process card
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          PROCESS_JSON: ${{ toJSON(matrix.process) }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          python3 - <<'PY'
          import json, os
          proc = json.loads(os.environ["PROCESS_JSON"])
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          issue = ev.get("issue") or {}
          retry = proc.get("retry_note") or ""
          retry_block = f"\n          Retry context (this card was re-dispatched after validation):\n          {retry}\n" if retry else ""
          prompt = f"""You are a WORKER on a development team under the foreman pattern. Execute exactly one process card (your sub-issue #{proc.get('sub_issue_number', '?')}). Do not do any other process. Do not expand scope.

          Work order: #{os.environ['ISSUE_NUMBER']} {issue.get('title','')}
          Work order body:
          {issue.get('body') or ''}

          Your process card:
          {json.dumps(proc, ensure_ascii=False, indent=2)}
          {retry_block}
          Instructions:
          - Create or edit only these files: {', '.join(proc['files'])}
          - Also write exactly these two team files:
            1. team/handoffs/{proc['id']}.md — a self-contained handoff with: what was requested, what you did, what you did not do, checks you ran and their results, and anything the validator must pay attention to.
            2. team/status/{proc['id']}.json — valid JSON with keys: id, title, state ("done"), files (array), checks (array of objects with command and result).
          - Run your process checks before finishing: {'; '.join(proc['checks'])}
          - Do not commit or push; the workflow will do that.
          - Do not modify files owned by other processes.
          """
          open("worker-prompt.txt", "w").write(prompt)
          PY
          ~/.local/bin/droid exec --auto high -m "custom:DeepSeek-V4.1-Flash-Go" --output-format stream-json "$(cat worker-prompt.txt)" | tee worker-stream.jsonl

      - name: Verify process checks and handoff
        env:
          PROCESS_JSON: ${{ toJSON(matrix.process) }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          proc = json.loads(os.environ["PROCESS_JSON"])
          handoff = f"team/handoffs/{proc['id']}.md"
          status = f"team/status/{proc['id']}.json"
          for path in [handoff, status] + proc["files"]:
              if not os.path.exists(path):
                  print(f"missing expected file: {path}")
                  sys.exit(1)
          json.load(open(status))
          for cmd in proc["checks"]:
              print(f"$ {cmd}")
              result = subprocess.run(cmd, shell=True)
              if result.returncode != 0:
                  print(f"check failed: {cmd}")
                  sys.exit(result.returncode)
          print("worker verification passed")
          PY

      - name: Commit, push worker branch, and post handoff
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          PROCESS_ID: ${{ matrix.process.id }}
          PROCESS_TITLE: ${{ matrix.process.title }}
          PROCESS_JSON: ${{ toJSON(matrix.process) }}
          SUB_ISSUE_NUMBER: ${{ matrix.process.sub_issue_number }}
          BRANCH_SUFFIX: ${{ matrix.process.branch_suffix }}
        run: |
          SUFFIX="${BRANCH_SUFFIX:-}"
          BR="team/issue-${ISSUE_NUMBER}/run-${RUN_ID}/${PROCESS_ID}${SUFFIX}"
          git config user.name "droid-team-worker"
          git config user.email "droid-team-worker@localhost"
          git checkout -b "$BR"
          jq -r '.files[]' <<<"$PROCESS_JSON" | while IFS= read -r f; do git add -- "$f"; done
          git add -- "team/handoffs/${PROCESS_ID}.md" "team/status/${PROCESS_ID}.json"
          if git diff --cached --quiet; then
            echo "worker produced no changes"
            exit 1
          fi
          git commit -m "team worker ${PROCESS_ID}: ${PROCESS_TITLE}"
          git push -u origin "$BR"
          {
            echo "## 工人交接：${PROCESS_TITLE} (\`${PROCESS_ID}\`)"
            echo ""
            echo "分支：\`$BR\`"
            echo ""
            cat "team/handoffs/${PROCESS_ID}.md"
          } > handoff-comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file handoff-comment.md
          if [ -n "${SUB_ISSUE_NUMBER:-}" ]; then
            gh issue comment "$SUB_ISSUE_NUMBER" --body-file handoff-comment.md || echo "sub-issue handoff comment failed"
          fi

  prep:
    name: prep (merge and pack evidence)
              needs: [lead, worker]
    if: ${{ !cancelled() && needs.lead.result == 'success' && needs.worker.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate_branch: ${{ steps.prep.outputs.candidate_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: team-plan-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: plan

      - name: Merge worker branches, run tests, pack evidence
        id: prep
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys

          issue = os.environ["ISSUE_NUMBER"]
          run_id = os.environ["RUN_ID"]
          plan = json.load(open("plan/team-plan.json"))

          def run(cmd, **kw):
              return subprocess.run(cmd, capture_output=True, text=True, **kw)

          base = run(["git", "rev-parse", "HEAD"]).stdout.strip()
          candidate = f"team/issue-{issue}/candidate-{run_id}"
          run(["git", "config", "user.name", "droid-team-prep"])
          run(["git", "config", "user.email", "droid-team-prep@localhost"])
          run(["git", "checkout", "-b", candidate])

          os.makedirs("evidence/packs", exist_ok=True)
          packs = {}
          merged_any = False
          for proc in plan["processes"]:
              pid = proc["id"]
              branch = f"team/issue-{issue}/run-{run_id}/{pid}"
              pack_dir = f"evidence/packs/{pid}"
              os.makedirs(pack_dir, exist_ok=True)
              json.dump(proc, open(f"{pack_dir}/process-card.json", "w"), ensure_ascii=False, indent=2)
              info = {"branch": branch, "branch_present": False, "merged": False,
                      "merge_conflict": False}
              exists = run(["git", "ls-remote", "--exit-code", "origin", branch]).returncode == 0
              if exists:
                  info["branch_present"] = True
                  run(["git", "fetch", "origin", branch])
                  diff = run(["git", "diff", f"{base}...origin/{branch}", "--"] + proc["files"])
                  open(f"{pack_dir}/diff.patch", "w").write(diff.stdout)
                  merge = run(["git", "merge", "--no-ff", "--no-edit", f"origin/{branch}"])
                  if merge.returncode == 0:
                      info["merged"] = True
                      merged_any = True
                  else:
                      info["merge_conflict"] = True
                      run(["git", "merge", "--abort"])
                      print(f"merge conflict for {branch}: {merge.stdout} {merge.stderr}")
              packs[pid] = info

          pytest = subprocess.run(["python3", "-m", "pytest", "-q"],
                                  capture_output=True, text=True)
          open("evidence/pytest-output.txt", "w").write(pytest.stdout + pytest.stderr)
          open("evidence/pytest-exit.txt", "w").write(str(pytest.returncode))
          print(f"full pytest exit: {pytest.returncode}")

          for proc in plan["processes"]:
              pid = proc["id"]
              pack_dir = f"evidence/packs/{pid}"
              info = packs[pid]
              for src, dst in ((f"team/handoffs/{pid}.md", "handoff.md"),
                               (f"team/status/{pid}.json", "status.json")):
                  if info["merged"] and os.path.exists(src):
                      open(f"{pack_dir}/{dst}", "w").write(open(src).read())
              exits = []
              out_lines = []
              if info["merged"]:
                  for cmd in proc["checks"]:
                      r = subprocess.run(cmd, shell=True, capture_output=True, text=True)
                      out_lines.append(f"$ {cmd}\n{r.stdout}{r.stderr}\n[exit {r.returncode}]")
                      exits.append({"command": cmd, "exit": r.returncode})
              else:
                  out_lines.append("branch not merged; process checks not run by prep")
              open(f"{pack_dir}/checks-output.txt", "w").write("\n".join(out_lines))
              json.dump(exits, open(f"{pack_dir}/checks-exit.json", "w"), indent=2)
              info["pack"] = {
                  "process_card": True,
                  "handoff": os.path.exists(f"{pack_dir}/handoff.md"),
                  "status": os.path.exists(f"{pack_dir}/status.json"),
                  "diff": os.path.exists(f"{pack_dir}/diff.patch"),
                  "checks_output": True,
              }
              info["complete"] = all(info["pack"].values()) and info["merged"]

          json.dump(plan, open("evidence/plan.json", "w"), ensure_ascii=False, indent=2)
          open("evidence/candidate-branch.txt", "w").write(candidate if merged_any else "")

          manifest = {"issue": issue, "run_id": run_id, "iteration": 1,
                      "candidate_branch": candidate if merged_any else "",
                      "pytest_exit": pytest.returncode, "packs": packs, "sha256": {}}
          for root, _dirs, files in os.walk("evidence"):
              for name in files:
                  path = os.path.join(root, name)
                  if path == "evidence/manifest.json":
                      continue
                  manifest["sha256"][path] = hashlib.sha256(open(path, "rb").read()).hexdigest()
          json.dump(manifest, open("evidence/manifest.json", "w"), ensure_ascii=False, indent=2)
          print(json.dumps({pid: p["complete"] for pid, p in packs.items()}, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"candidate_branch={candidate if merged_any else ''}\n")
          if merged_any:
              push = run(["git", "push", "-u", "origin", candidate])
              if push.returncode != 0:
                  print("candidate push failed:", push.stdout, push.stderr)
                  sys.exit(1)
          PY
          tar -czf evidence.tar.gz -C evidence .

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-evidence-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: evidence.tar.gz

      - name: Post prep report
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PLAN_ISSUE_NUMBER: ${{ needs.lead.outputs.plan_issue_number }}
        run: |
          python3 - <<'PY'
          import json
          manifest = json.load(open("evidence/manifest.json"))
          lines = ["## 备料报告（脚本 job）", "",
                   f"候选分支：`{manifest.get('candidate_branch') or '（无可合并分支）'}`",
                   f"全量 pytest 退出码：{manifest.get('pytest_exit')}", "",
                   "| 工序 | 料齐 | 缺件 |", "|---|---|---|"]
          for pid, info in manifest["packs"].items():
              missing = [k for k, v in info["pack"].items() if not v]
              if not info["merged"]:
                  missing.append("未合并")
              lines.append(f"| `{pid}` | {'是' if info['complete'] else '否'} | {', '.join(missing) if missing else '—'} |")
          lines += ["", "料不齐的工序不予验收（没料不验收）：验收将对缺料工序直接判 blocked，理由记为料不齐。"]
          open("prep-comment.md", "w").write("\n".join(lines))
          print("\n".join(lines))
          PY
          gh issue comment "$ISSUE_NUMBER" --body-file prep-comment.md
          if [ -n "${PLAN_ISSUE_NUMBER:-}" ]; then
            gh issue comment "$PLAN_ISSUE_NUMBER" --body-file prep-comment.md || echo "plan prep comment failed"
          fi

  validate:
    name: validator (squad-leader style, evidence only)
    needs: prep
    if: needs.prep.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    outputs:
      overall: ${{ steps.verdict.outputs.overall }}
      failed_processes: ${{ steps.verdict.outputs.failed_processes }}
    steps:
      - name: Download evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: team-evidence-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}

      - name: Extract and precheck evidence packs
        id: pre
        run: |
          mkdir -p work
          tar -xzf evidence.tar.gz -C work
          python3 - <<'PY'
          import hashlib, json, os, sys
          manifest = json.load(open("work/manifest.json"))
          bad = []
          for path, digest in manifest["sha256"].items():
              local = "work/" + path[len("evidence/"):] if path.startswith("evidence/") else path
              if not os.path.exists(local) or hashlib.sha256(open(local, "rb").read()).hexdigest() != digest:
                  bad.append(path)
          if bad:
              print("evidence integrity check failed:", bad)
              sys.exit(1)
          judgeable, blocked = [], {}
          for pid, info in manifest["packs"].items():
              if info["complete"]:
                  judgeable.append(pid)
              else:
                  missing = [k for k, v in info["pack"].items() if not v]
                  if not info["merged"]:
                      missing.append("未合并")
                  blocked[pid] = missing
          json.dump(judgeable, open("work/judgeable.json", "w"))
          json.dump(blocked, open("work/blocked.json", "w"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("judgeable=" + json.dumps(judgeable) + "\n")
          print("judgeable:", judgeable, "| blocked （料不齐）:", blocked)
          PY

      - name: Install droid CLI
        if: steps.pre.outputs.judgeable != '[]'
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Write BYOM settings (validator session)
        if: steps.pre.outputs.judgeable != '[]'
        env:
          WORKER_CI_KEY: ${{ secrets.WORKER_CI_KEY }}
          GO_GITHUB_RUN_TOKEN: ${{ secrets.GO_GITHUB_RUN_TOKEN }}
          GW_TOKEN_KNOWN: ${{ secrets.GW_TOKEN_KNOWN }}
          SESSION_NAME: team-validator
        run: |
          mkdir -p ~/.factory
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.factory/settings.json")
          s = {}
          if os.path.exists(p):
              s = json.load(open(p))
          headers = {
              "x-ci-key": os.environ.get("WORKER_CI_KEY", ""),
              "x-opencode-session": os.environ.get("SESSION_NAME", "team-validator"),
              "cf-aig-authorization": "Bearer " + os.environ.get("GW_TOKEN_KNOWN", ""),
          }
          s["customModels"] = [{
              "model": "dynamic/droid-review",
              "id": "custom:DeepSeek-V4.1-Flash-Go",
              "baseUrl": "https://droid-test.lumivane.dpdns.org",
              "apiKey": os.environ.get("GO_GITHUB_RUN_TOKEN", ""),
              "provider": "generic-chat-completion-api",
              "extraHeaders": headers,
          }]
          json.dump(s, open(p, "w"), indent=2)
          m = s["customModels"][0]
          print("settings check | model:", m["model"], "| baseUrl:", m["baseUrl"],
                "| apiKey present:", bool(m["apiKey"]),
                "| x-ci-key present:", bool(headers["x-ci-key"]),
                "| x-opencode-session present:", bool(headers["x-opencode-session"]),
                "| cf-aig-authorization present:", bool(headers["cf-aig-authorization"]))
          PY

      - name: Validator judges evidence packs only
        if: steps.pre.outputs.judgeable != '[]'
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        working-directory: work
        run: |
          set -o pipefail
          python3 - <<'PY'
          import json
          judgeable = json.load(open("judgeable.json"))
          packs = "\n".join(f"- packs/{pid}/ (process-card.json, handoff.md, status.json, diff.patch, checks-output.txt, checks-exit.json)" for pid in judgeable)
          prompt = f"""You are the VALIDATOR on a development team, working in the squad-leader acceptance style. You only judge pre-packed evidence. You have no GitHub access and must not try to fetch anything else.

          Judge ONLY these processes: {', '.join(judgeable)}

          Evidence available in this directory:
          - plan.json (the plan and process cards)
          - pytest-output.txt and pytest-exit.txt (full test evidence for the merged candidate)
          {packs}

          Write exactly two files in this directory:
          1. verdict-droid.json with this shape:
          {{
            "processes": [
              {{"id": "process-id", "verdict": "pass" or "fail", "reason": "evidence-based reason"}}
            ]
          }}
          It must contain exactly one verdict for each judged process listed above, no more, no fewer.
          2. verdict-droid.md — a human-readable report, one section per judged process, naming the evidence you relied on.

          Rules:
          - Pass a process only when its card, handoff, status, diff, and check outputs line up.
          - Judge only from the evidence in this directory. Do not modify any evidence file.
          - Be efficient: at most 12 tool calls, then write the verdict files.
          """
          open("validator-prompt.txt", "w").write(prompt)
          PY
          timeout --signal=TERM --kill-after=30s 600s ~/.local/bin/droid exec --auto high -m "custom:DeepSeek-V4.1-Flash-Go" --output-format stream-json "$(cat validator-prompt.txt)" | tee validator-stream.jsonl

      - name: Merge verdict, enforce gates, verify evidence untouched
        id: verdict
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys
          manifest = json.load(open("work/manifest.json"))
          plan = json.load(open("work/plan.json"))
          judgeable = json.load(open("work/judgeable.json"))
          blocked = json.load(open("work/blocked.json"))

          for path, digest in manifest["sha256"].items():
              local = "work/" + path[len("evidence/"):] if path.startswith("evidence/") else path
              if not os.path.exists(local) or hashlib.sha256(open(local, "rb").read()).hexdigest() != digest:
                  print("validator modified evidence:", path)
                  sys.exit(1)

          verdicts = {}
          if judgeable:
              if not os.path.exists("work/verdict-droid.json"):
                  print("validator produced no verdict-droid.json")
                  sys.exit(1)
              droid = json.load(open("work/verdict-droid.json"))
              got = {p["id"]: p for p in droid.get("processes", [])}
              if set(got) != set(judgeable):
                  print(f"verdict coverage mismatch: judged {sorted(got)}, expected {sorted(judgeable)}")
                  sys.exit(1)
              for pid, entry in got.items():
                  if entry.get("verdict") not in ("pass", "fail"):
                      print("invalid verdict value:", entry)
                      sys.exit(1)
                  verdicts[pid] = {"id": pid, "verdict": entry["verdict"],
                                   "reason": entry.get("reason", "")}
          for pid, missing in blocked.items():
              verdicts[pid] = {"id": pid, "verdict": "blocked",
                               "reason": "料不齐（没料不验收）：缺 " + ", ".join(missing)}

          expected = {p["id"] for p in plan["processes"]}
          if set(verdicts) != expected:
              print(f"final coverage mismatch: {sorted(verdicts)} vs {sorted(expected)}")
              sys.exit(1)

          pytest_exit = manifest.get("pytest_exit", 1)
          overall = "pass" if all(v["verdict"] == "pass" for v in verdicts.values()) and pytest_exit == 0 else "fail"
          verdict = {"overall": overall, "pytest_exit": pytest_exit,
                     "iteration": manifest.get("iteration", 1),
                     "processes": [verdicts[p["id"]] for p in plan["processes"]]}
          json.dump(verdict, open("verdict.json", "w"), ensure_ascii=False, indent=2)

          lines = []
          if os.path.exists("work/verdict-droid.md"):
              lines.append(open("work/verdict-droid.md").read())
          lines += ["", "## 机器闸与缺料判定（脚本）", "",
                    f"全量 pytest 退出码：{pytest_exit}（非 0 时 overall 强制 fail）"]
          for pid, missing in blocked.items():
              lines.append(f"- `{pid}`：blocked — 料不齐，缺 {', '.join(missing)}")
          lines += ["", f"总判定：**{overall}**"]
          open("verdict.md", "w").write("\n".join(lines))

          failed = [pid for pid, v in verdicts.items() if v["verdict"] != "pass"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"overall={overall}\n")
              out.write("failed_processes=" + json.dumps(failed) + "\n")
          print("overall:", overall, "| failed:", failed)
          PY

      - name: Upload verdict artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-verdict-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: |
            verdict.json
            verdict.md
            work/validator-stream.jsonl

  replan:
    name: replan (foreman revises plan or re-dispatches)
    needs: [lead, prep, validate]
    if: needs.validate.result == 'success' && needs.validate.outputs.overall != 'pass'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      processes2: ${{ steps.replan.outputs.processes2 }}
    steps:
      - name: Download plan, verdict, and evidence
        uses: actions/download-artifact@v4
        with:
          pattern: team-*-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: dl

      - name: Install droid CLI
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Write BYOM settings (replan session)
        env:
          WORKER_CI_KEY: ${{ secrets.WORKER_CI_KEY }}
          GO_GITHUB_RUN_TOKEN: ${{ secrets.GO_GITHUB_RUN_TOKEN }}
          GW_TOKEN_KNOWN: ${{ secrets.GW_TOKEN_KNOWN }}
          SESSION_NAME: team-lead-replan
        run: |
          mkdir -p ~/.factory
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.factory/settings.json")
          s = {}
          if os.path.exists(p):
              s = json.load(open(p))
          headers = {
              "x-ci-key": os.environ.get("WORKER_CI_KEY", ""),
              "x-opencode-session": os.environ.get("SESSION_NAME", "team-lead-replan"),
              "cf-aig-authorization": "Bearer " + os.environ.get("GW_TOKEN_KNOWN", ""),
          }
          s["customModels"] = [{
              "model": "dynamic/droid-review",
              "id": "custom:DeepSeek-V4.1-Flash-Go",
              "baseUrl": "https://droid-test.lumivane.dpdns.org",
              "apiKey": os.environ.get("GO_GITHUB_RUN_TOKEN", ""),
              "provider": "generic-chat-completion-api",
              "extraHeaders": headers,
          }]
          json.dump(s, open(p, "w"), indent=2)
          print("settings written for replan session")
          PY

      - name: Foreman classifies failures and writes plan v2
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -o pipefail
          mkdir -p stage
          cp dl/team-plan-*/team-plan.json stage/plan-v1.json
          cp dl/team-verdict-*/verdict.json stage/verdict.json
          tar -xzf dl/team-evidence-*/evidence.tar.gz -C stage
          python3 - <<'PY'
          import json
          plan = json.load(open("stage/plan-v1.json"))
          verdict = json.load(open("stage/verdict.json"))
          failed = [p["id"] for p in verdict["processes"] if p["verdict"] != "pass"]
          prompt = f"""You are the FOREMAN （领班） again. Validation of plan v1 did not pass. Your job now is to fix the PLAN, never the code. Do not write application code. Do not edit any file except team-plan-v2.json in the current directory.

          In front of you:
          - stage/plan-v1.json (the original plan and process cards)
          - stage/verdict.json (the validator verdict per process)
          - stage/manifest.json and stage/packs/<id>/ (evidence packs, including failed ones)
          - stage/pytest-output.txt (full test evidence)

          Failed or blocked processes: {', '.join(failed)}

          For EACH failed or blocked process, decide whose fault it is:
          - "redispatch" （工人问题）: the card was fine, the work was not. Keep the original card and add a "retry_note" that tells the next worker exactly what to fix, citing the verdict reason and evidence.
          - "revise" （计划问题）: the card itself was wrong (bad split, wrong files, wrong checks, missing requirement). Output a corrected full card with the same "id", plus a "retry_note" explaining what changed and why.

          Write team-plan-v2.json with exactly this shape:
          {{
            "summary": "one short sentence",
            "changes": [
              {{"process_id": "id", "mode": "redispatch" or "revise", "reason": "whose fault and why", "card": {{full process card including retry_note}}}}
            ]
          }}
          The changes list must cover every failed or blocked process exactly once, and no passed process.
          A revised card must not claim files owned by a passed process.
          Write valid JSON only. Do not wrap it in Markdown.
          """
          open("replan-prompt.txt", "w").write(prompt)
          PY
          timeout --signal=TERM --kill-after=30s 480s ~/.local/bin/droid exec --auto high -m "custom:DeepSeek-V4.1-Flash-Go" --output-format stream-json "$(cat replan-prompt.txt)" | tee replan-stream.jsonl

      - name: Validate plan v2 and file the revision
        id: replan
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          PLAN_ISSUE_NUMBER: ${{ needs.lead.outputs.plan_issue_number }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          repo = os.environ["GITHUB_REPOSITORY"]
          issue_number = os.environ["ISSUE_NUMBER"]
          run_id = os.environ["RUN_ID"]
          plan_number = int(os.environ["PLAN_ISSUE_NUMBER"])

          def gh(*args, check=True):
              r = subprocess.run(["gh", *args], capture_output=True, text=True)
              if check and r.returncode != 0:
                  print("gh failed:", " ".join(args), r.stdout, r.stderr)
                  sys.exit(1)
              return r

          plan = json.load(open("stage/plan-v1.json"))
          verdict = json.load(open("stage/verdict.json"))
          v2 = json.load(open("team-plan-v2.json"))
          failed = {p["id"] for p in verdict["processes"] if p["verdict"] != "pass"}
          passed_files = {}
          for proc in plan["processes"]:
              if proc["id"] not in failed:
                  for f in proc["files"]:
                      passed_files[f] = proc["id"]

          changes = v2.get("changes") or []
          if {c.get("process_id") for c in changes} != failed:
              print(f"plan v2 must cover exactly the failed processes {sorted(failed)}")
              sys.exit(1)
          originals = {p["id"]: p for p in plan["processes"]}
          processes2 = []
          seen_files = dict(passed_files)
          comment_lines = ["## 计划改版 v1 → v2（领班改计划）", "",
                           f"总述：{v2.get('summary', '')}", ""]
          for change in changes:
              pid = change["process_id"]
              mode = change.get("mode")
              card = change.get("card") or {}
              if mode not in ("redispatch", "revise"):
                  print("invalid mode:", change)
                  sys.exit(1)
              if mode == "redispatch":
                  card = dict(originals[pid])
                  card["retry_note"] = (change.get("card") or {}).get("retry_note") or change.get("reason", "")
              else:
                  for key in ("id", "title", "scope", "files", "task", "checks"):
                      if not card.get(key):
                          print(f"revised card missing {key}: {pid}")
                          sys.exit(1)
                  if card["id"] != pid:
                      print("revised card id must stay the same:", pid)
                      sys.exit(1)
                  for f in card["files"]:
                      if f in seen_files:
                          print(f"revised card claims file owned by {seen_files[f]}: {f}")
                          sys.exit(1)
                      seen_files[f] = pid
              card["branch_suffix"] = "/r2"

              if mode == "revise":
                  old_sub = originals[pid].get("sub_issue_number")
                  child_title = f"[工序] {pid} v2 · 工单 #{issue_number} · run {run_id}"
                  child_body = "\n".join([
                      f"# 工序卡（计划 v2 修订）：{card['title']} (`{pid}`)", "",
                      f"父计划：#{plan_number}", f"来源工单：#{issue_number}", "",
                      f"修订理由：{change.get('reason', '')}", "",
                      f"范围：{card['scope']}", "", f"文件：{', '.join(card['files'])}", "",
                      f"任务：{card['task']}", "", f"检查：{'; '.join(card['checks'])}", "",
                      f"重试说明：{card.get('retry_note', '')}",
                  ])
                  open("issue-body.tmp.md", "w").write(child_body)
                  r = gh("issue", "create", "--title", child_title, "--body-file", "issue-body.tmp.md")
                  child_number = int(r.stdout.strip().splitlines()[-1].rstrip("/").split("/")[-1])
                  r = gh("api", f"repos/{repo}/issues/{child_number}", "--jq", ".id")
                  attach = gh("api", "--method", "POST",
                              f"repos/{repo}/issues/{plan_number}/sub_issues",
                              "-F", f"sub_issue_id={int(r.stdout.strip())}", check=False)
                  card["sub_issue_number"] = child_number
                  card["sub_issue_linked"] = attach.returncode == 0
                  if old_sub:
                      gh("issue", "comment", str(old_sub), "--body",
                         f"本工序卡已被计划 v2 修订卡取代（新子单 #{child_number}），本单以 not planned 关闭，不计完成。", check=False)
                      gh("issue", "close", str(old_sub), "--reason", "not planned", check=False)
                  comment_lines.append(f"- `{pid}`：改计划（revise）→ 新子单 #{child_number}；理由：{change.get('reason', '')}")
              else:
                  card["sub_issue_number"] = originals[pid].get("sub_issue_number")
                  card["sub_issue_linked"] = originals[pid].get("sub_issue_linked")
                  if card["sub_issue_number"]:
                      gh("issue", "comment", str(card["sub_issue_number"]), "--body",
                         f"## 重派（计划 v2）\n\n理由：{change.get('reason', '')}\n\n重试说明：{card.get('retry_note', '')}",
                         check=False)
                  comment_lines.append(f"- `{pid}`：重派（redispatch）→ 子单 #{card['sub_issue_number']}；理由：{change.get('reason', '')}")
              processes2.append(card)

          v2["processes"] = processes2
          v2["plan_version"] = 2
          json.dump(v2, open("team-plan-v2.json", "w"), ensure_ascii=False, indent=2)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("processes2=" + json.dumps(processes2, ensure_ascii=False) + "\n")
          comment_lines += ["", "状态代偿记录：施工中（第 2/2 轮迭代；再不过整单停下报人，不无限重试）。"]
          open("replan-comment.md", "w").write("\n".join(comment_lines))
          print("\n".join(comment_lines))
          PY
          gh issue comment "$PLAN_ISSUE_NUMBER" --body-file replan-comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file replan-comment.md

      - name: Upload plan v2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-plan-v2-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: team-plan-v2.json

  worker2:
    name: worker (round 2)
    needs: replan
    if: needs.replan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        process: ${{ fromJSON(needs.replan.outputs.processes2) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install droid CLI
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Write BYOM settings (worker round 2 session)
        env:
          WORKER_CI_KEY: ${{ secrets.WORKER_CI_KEY }}
          GO_GITHUB_RUN_TOKEN: ${{ secrets.GO_GITHUB_RUN_TOKEN }}
          GW_TOKEN_KNOWN: ${{ secrets.GW_TOKEN_KNOWN }}
          SESSION_NAME: team-worker-${{ matrix.process.id }}-r2
        run: |
          mkdir -p ~/.factory
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.factory/settings.json")
          s = {}
          if os.path.exists(p):
              s = json.load(open(p))
          headers = {
              "x-ci-key": os.environ.get("WORKER_CI_KEY", ""),
              "x-opencode-session": os.environ.get("SESSION_NAME", "team-worker"),
              "cf-aig-authorization": "Bearer " + os.environ.get("GW_TOKEN_KNOWN", ""),
          }
          s["customModels"] = [{
              "model": "dynamic/droid-review",
              "id": "custom:DeepSeek-V4.1-Flash-Go",
              "baseUrl": "https://droid-test.lumivane.dpdns.org",
              "apiKey": os.environ.get("GO_GITHUB_RUN_TOKEN", ""),
              "provider": "generic-chat-completion-api",
              "extraHeaders": headers,
          }]
          json.dump(s, open(p, "w"), indent=2)
          print("settings written for worker round 2 session")
          PY

      - name: Worker executes exactly one process card (round 2)
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          PROCESS_JSON: ${{ toJSON(matrix.process) }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          python3 - <<'PY'
          import json, os
          proc = json.loads(os.environ["PROCESS_JSON"])
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          issue = ev.get("issue") or {}
          retry = proc.get("retry_note") or ""
          retry_block = f"\n          Retry context (this card was re-dispatched after validation):\n          {retry}\n" if retry else ""
          prompt = f"""You are a WORKER on a development team under the foreman pattern. Execute exactly one process card (your sub-issue #{proc.get('sub_issue_number', '?')}). Do not do any other process. Do not expand scope.

          Work order: #{os.environ['ISSUE_NUMBER']} {issue.get('title','')}
          Work order body:
          {issue.get('body') or ''}

          Your process card:
          {json.dumps(proc, ensure_ascii=False, indent=2)}
          {retry_block}
          Instructions:
          - Create or edit only these files: {', '.join(proc['files'])}
          - Also write exactly these two team files:
            1. team/handoffs/{proc['id']}.md — a self-contained handoff with: what was requested, what you did, what you did not do, checks you ran and their results, and anything the validator must pay attention to.
            2. team/status/{proc['id']}.json — valid JSON with keys: id, title, state ("done"), files (array), checks (array of objects with command and result).
          - Run your process checks before finishing: {'; '.join(proc['checks'])}
          - Do not commit or push; the workflow will do that.
          - Do not modify files owned by other processes.
          """
          open("worker-prompt.txt", "w").write(prompt)
          PY
          ~/.local/bin/droid exec --auto high -m "custom:DeepSeek-V4.1-Flash-Go" --output-format stream-json "$(cat worker-prompt.txt)" | tee worker-stream.jsonl

      - name: Verify process checks and handoff
        env:
          PROCESS_JSON: ${{ toJSON(matrix.process) }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          proc = json.loads(os.environ["PROCESS_JSON"])
          handoff = f"team/handoffs/{proc['id']}.md"
          status = f"team/status/{proc['id']}.json"
          for path in [handoff, status] + proc["files"]:
              if not os.path.exists(path):
                  print(f"missing expected file: {path}")
                  sys.exit(1)
          json.load(open(status))
          for cmd in proc["checks"]:
              print(f"$ {cmd}")
              result = subprocess.run(cmd, shell=True)
              if result.returncode != 0:
                  print(f"check failed: {cmd}")
                  sys.exit(result.returncode)
          print("worker verification passed")
          PY

      - name: Commit, push worker branch, and post handoff
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          PROCESS_ID: ${{ matrix.process.id }}
          PROCESS_TITLE: ${{ matrix.process.title }}
          PROCESS_JSON: ${{ toJSON(matrix.process) }}
          SUB_ISSUE_NUMBER: ${{ matrix.process.sub_issue_number }}
          BRANCH_SUFFIX: ${{ matrix.process.branch_suffix }}
        run: |
          SUFFIX="${BRANCH_SUFFIX:-}"
          BR="team/issue-${ISSUE_NUMBER}/run-${RUN_ID}/${PROCESS_ID}${SUFFIX}"
          git config user.name "droid-team-worker"
          git config user.email "droid-team-worker@localhost"
          git checkout -b "$BR"
          jq -r '.files[]' <<<"$PROCESS_JSON" | while IFS= read -r f; do git add -- "$f"; done
          git add -- "team/handoffs/${PROCESS_ID}.md" "team/status/${PROCESS_ID}.json"
          if git diff --cached --quiet; then
            echo "worker produced no changes"
            exit 1
          fi
          git commit -m "team worker r2 ${PROCESS_ID}: ${PROCESS_TITLE}"
          git push -u origin "$BR"
          {
            echo "## 工人交接（第 2 轮）：${PROCESS_TITLE} (\`${PROCESS_ID}\`)"
            echo ""
            echo "分支：\`$BR\`"
            echo ""
            cat "team/handoffs/${PROCESS_ID}.md"
          } > handoff-comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file handoff-comment.md
          if [ -n "${SUB_ISSUE_NUMBER:-}" ]; then
            gh issue comment "$SUB_ISSUE_NUMBER" --body-file handoff-comment.md || echo "sub-issue handoff comment failed"
          fi

  prep2:
    name: prep round 2 (replace rerun processes, repack evidence)
    needs: [lead, prep, validate, replan, worker2]
    if: ${{ !cancelled() && needs.replan.result == 'success' && needs.worker2.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate_branch: ${{ steps.prep2.outputs.candidate_branch }}
    steps:
      - name: Checkout candidate from round 1
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.candidate_branch }}
          fetch-depth: 0

      - name: Download plan, plan v2, and round 1 evidence
        uses: actions/download-artifact@v4
        with:
          pattern: team-*-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: dl

      - name: Replace rerun processes, rerun tests, repack evidence
        id: prep2
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys

          issue = os.environ["ISSUE_NUMBER"]
          run_id = os.environ["RUN_ID"]

          def run(cmd, **kw):
              return subprocess.run(cmd, capture_output=True, text=True, **kw)

          def dl_file(prefix, filename):
              for d in sorted(os.listdir("dl")):
                  if d.startswith(prefix) and not (prefix == "team-plan-" and d.startswith("team-plan-v2")):
                      return os.path.join("dl", d, filename)
              raise FileNotFoundError(prefix + "/" + filename)

          plan = json.load(open(dl_file("team-plan-", "team-plan.json")))
          v2 = json.load(open(dl_file("team-plan-v2-", "team-plan-v2.json")))
          rerun = {p["id"]: p for p in v2["processes"]}

          os.makedirs("old_ev", exist_ok=True)
          ev_tar = [os.path.join("dl", d, "evidence.tar.gz") for d in os.listdir("dl") if d.startswith("team-evidence-")][0]
          run(["tar", "-xzf", ev_tar, "-C", "old_ev"])

          run(["git", "config", "user.name", "droid-team-prep"])
          run(["git", "config", "user.email", "droid-team-prep@localhost"])
          cand1_tip = run(["git", "rev-parse", "HEAD"]).stdout.strip()
          candidate2 = f"team/issue-{issue}/candidate-{run_id}-r2"
          run(["git", "checkout", "-b", candidate2])

          os.makedirs("evidence/packs", exist_ok=True)
          packs = {}
          replaced_any = False
          for proc in plan["processes"]:
              pid = proc["id"]
              pack_dir = f"evidence/packs/{pid}"
              os.makedirs(pack_dir, exist_ok=True)
              if pid not in rerun:
                  old_pack = f"old_ev/packs/{pid}"
                  info = json.load(open("old_ev/manifest.json"))["packs"][pid]
                  if os.path.isdir(old_pack):
                      for name in os.listdir(old_pack):
                          open(os.path.join(pack_dir, name), "wb").write(open(os.path.join(old_pack, name), "rb").read())
                  packs[pid] = info
                  continue
              card = rerun[pid]
              json.dump(card, open(f"{pack_dir}/process-card.json", "w"), ensure_ascii=False, indent=2)
              branch = f"team/issue-{issue}/run-{run_id}/{pid}/r2"
              info = {"branch": branch, "branch_present": False, "merged": False, "merge_conflict": False}
              exists = run(["git", "ls-remote", "--exit-code", "origin", branch]).returncode == 0
              if exists:
                  info["branch_present"] = True
                  run(["git", "fetch", "origin", branch])
                  diff = run(["git", "diff", cand1_tip, f"origin/{branch}", "--"] + card["files"])
                  open(f"{pack_dir}/diff.patch", "w").write(diff.stdout)
                  checkout = run(["git", "checkout", f"origin/{branch}", "--"] + card["files"] +
                                 [f"team/handoffs/{pid}.md", f"team/status/{pid}.json"])
                  if checkout.returncode == 0:
                      run(["git", "add", "--"] + card["files"] +
                          [f"team/handoffs/{pid}.md", f"team/status/{pid}.json"])
                      commit = run(["git", "commit", "-m", f"team prep2: replace {pid} with round 2 result"])
                      info["merged"] = commit.returncode == 0
                      replaced_any = replaced_any or info["merged"]
                  else:
                      print(f"replacement checkout failed for {branch}: {checkout.stderr}")
              packs[pid] = info

          pytest = subprocess.run(["python3", "-m", "pytest", "-q"], capture_output=True, text=True)
          open("evidence/pytest-output.txt", "w").write(pytest.stdout + pytest.stderr)
          open("evidence/pytest-exit.txt", "w").write(str(pytest.returncode))
          print(f"full pytest exit (round 2): {pytest.returncode}")

          for proc in plan["processes"]:
              pid = proc["id"]
              if pid not in rerun:
                  continue
              card = rerun[pid]
              pack_dir = f"evidence/packs/{pid}"
              info = packs[pid]
              for src, dst in ((f"team/handoffs/{pid}.md", "handoff.md"),
                               (f"team/status/{pid}.json", "status.json")):
                  if info["merged"] and os.path.exists(src):
                      open(f"{pack_dir}/{dst}", "w").write(open(src).read())
              exits, out_lines = [], []
              if info["merged"]:
                  for cmd in card["checks"]:
                      r = subprocess.run(cmd, shell=True, capture_output=True, text=True)
                      out_lines.append(f"$ {cmd}\n{r.stdout}{r.stderr}\n[exit {r.returncode}]")
                      exits.append({"command": cmd, "exit": r.returncode})
              else:
                  out_lines.append("round 2 branch not applied; process checks not run by prep2")
              open(f"{pack_dir}/checks-output.txt", "w").write("\n".join(out_lines))
              json.dump(exits, open(f"{pack_dir}/checks-exit.json", "w"), indent=2)
              info["pack"] = {"process_card": True,
                              "handoff": os.path.exists(f"{pack_dir}/handoff.md"),
                              "status": os.path.exists(f"{pack_dir}/status.json"),
                              "diff": os.path.exists(f"{pack_dir}/diff.patch"),
                              "checks_output": True}
              info["complete"] = all(info["pack"].values()) and info["merged"]

          effective_plan = dict(plan)
          effective_plan["processes"] = [rerun.get(p["id"], p) for p in plan["processes"]]
          effective_plan["plan_version"] = 2
          json.dump(effective_plan, open("evidence/plan.json", "w"), ensure_ascii=False, indent=2)
          open("evidence/candidate-branch.txt", "w").write(candidate2)

          manifest = {"issue": issue, "run_id": run_id, "iteration": 2,
                      "candidate_branch": candidate2,
                      "pytest_exit": pytest.returncode, "packs": packs, "sha256": {}}
          for root, _dirs, files in os.walk("evidence"):
              for name in files:
                  path = os.path.join(root, name)
                  if path == "evidence/manifest.json":
                      continue
                  manifest["sha256"][path] = hashlib.sha256(open(path, "rb").read()).hexdigest()
          json.dump(manifest, open("evidence/manifest.json", "w"), ensure_ascii=False, indent=2)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"candidate_branch={candidate2}\n")
          push = run(["git", "push", "-u", "origin", candidate2])
          if push.returncode != 0:
              print("candidate2 push failed:", push.stdout, push.stderr)
              sys.exit(1)
          PY
          tar -czf evidence.tar.gz -C evidence .

      - name: Upload evidence round 2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-evidence2-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: evidence.tar.gz

      - name: Post prep round 2 report
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PLAN_ISSUE_NUMBER: ${{ needs.lead.outputs.plan_issue_number }}
        run: |
          python3 - <<'PY'
          import json
          manifest = json.load(open("evidence/manifest.json"))
          lines = ["## 备料报告（第 2 轮，脚本 job）", "",
                   f"候选分支：`{manifest.get('candidate_branch')}`",
                   f"全量 pytest 退出码：{manifest.get('pytest_exit')}", "",
                   "| 工序 | 料齐 | 缺件 |", "|---|---|---|"]
          for pid, info in manifest["packs"].items():
              missing = [k for k, v in info["pack"].items() if not v]
              if not info["merged"]:
                  missing.append("未合并/未替换")
              lines.append(f"| `{pid}` | {'是' if info['complete'] else '否'} | {', '.join(missing) if missing else '—'} |")
          lines += ["", "重派工序以第 2 轮分支整卡替换第 1 轮成果；未重派工序沿用第 1 轮证据包。料不齐不予验收。"]
          open("prep2-comment.md", "w").write("\n".join(lines))
          print("\n".join(lines))
          PY
          gh issue comment "$ISSUE_NUMBER" --body-file prep2-comment.md
          if [ -n "${PLAN_ISSUE_NUMBER:-}" ]; then
            gh issue comment "$PLAN_ISSUE_NUMBER" --body-file prep2-comment.md || echo "plan prep2 comment failed"
          fi

  validate2:
    name: validator round 2 (squad-leader style, evidence only)
    needs: prep2
    if: needs.prep2.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    outputs:
      overall: ${{ steps.verdict.outputs.overall }}
      failed_processes: ${{ steps.verdict.outputs.failed_processes }}
    steps:
      - name: Download evidence round 2 artifact
        uses: actions/download-artifact@v4
        with:
          name: team-evidence2-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}

      - name: Extract and precheck evidence packs
        id: pre
        run: |
          mkdir -p work
          tar -xzf evidence.tar.gz -C work
          python3 - <<'PY'
          import hashlib, json, os, sys
          manifest = json.load(open("work/manifest.json"))
          bad = []
          for path, digest in manifest["sha256"].items():
              local = "work/" + path[len("evidence/"):] if path.startswith("evidence/") else path
              if not os.path.exists(local) or hashlib.sha256(open(local, "rb").read()).hexdigest() != digest:
                  bad.append(path)
          if bad:
              print("evidence integrity check failed:", bad)
              sys.exit(1)
          judgeable, blocked = [], {}
          for pid, info in manifest["packs"].items():
              if info["complete"]:
                  judgeable.append(pid)
              else:
                  missing = [k for k, v in info["pack"].items() if not v]
                  if not info["merged"]:
                      missing.append("未合并/未替换")
                  blocked[pid] = missing
          json.dump(judgeable, open("work/judgeable.json", "w"))
          json.dump(blocked, open("work/blocked.json", "w"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("judgeable=" + json.dumps(judgeable) + "\n")
          print("judgeable:", judgeable, "| blocked （料不齐）:", blocked)
          PY

      - name: Install droid CLI
        if: steps.pre.outputs.judgeable != '[]'
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Write BYOM settings (validator round 2 session)
        if: steps.pre.outputs.judgeable != '[]'
        env:
          WORKER_CI_KEY: ${{ secrets.WORKER_CI_KEY }}
          GO_GITHUB_RUN_TOKEN: ${{ secrets.GO_GITHUB_RUN_TOKEN }}
          GW_TOKEN_KNOWN: ${{ secrets.GW_TOKEN_KNOWN }}
          SESSION_NAME: team-validator-r2
        run: |
          mkdir -p ~/.factory
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.factory/settings.json")
          s = {}
          if os.path.exists(p):
              s = json.load(open(p))
          headers = {
              "x-ci-key": os.environ.get("WORKER_CI_KEY", ""),
              "x-opencode-session": os.environ.get("SESSION_NAME", "team-validator"),
              "cf-aig-authorization": "Bearer " + os.environ.get("GW_TOKEN_KNOWN", ""),
          }
          s["customModels"] = [{
              "model": "dynamic/droid-review",
              "id": "custom:DeepSeek-V4.1-Flash-Go",
              "baseUrl": "https://droid-test.lumivane.dpdns.org",
              "apiKey": os.environ.get("GO_GITHUB_RUN_TOKEN", ""),
              "provider": "generic-chat-completion-api",
              "extraHeaders": headers,
          }]
          json.dump(s, open(p, "w"), indent=2)
          print("settings written for validator round 2 session")
          PY

      - name: Validator judges evidence packs only (round 2)
        if: steps.pre.outputs.judgeable != '[]'
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        working-directory: work
        run: |
          set -o pipefail
          python3 - <<'PY'
          import json
          judgeable = json.load(open("judgeable.json"))
          packs = "\n".join(f"- packs/{pid}/ (process-card.json, handoff.md, status.json, diff.patch, checks-output.txt, checks-exit.json)" for pid in judgeable)
          prompt = f"""You are the VALIDATOR on a development team, working in the squad-leader acceptance style. This is the final validation round after a replan. You only judge pre-packed evidence. You have no GitHub access and must not try to fetch anything else.

          Judge ONLY these processes: {', '.join(judgeable)}

          Evidence available in this directory:
          - plan.json (the effective plan: revised cards for re-dispatched processes, original cards otherwise)
          - pytest-output.txt and pytest-exit.txt (full test evidence for the final merged candidate)
          {packs}

          Write exactly two files in this directory:
          1. verdict-droid.json with this shape:
          {{
            "processes": [
              {{"id": "process-id", "verdict": "pass" or "fail", "reason": "evidence-based reason"}}
            ]
          }}
          It must contain exactly one verdict for each judged process listed above, no more, no fewer.
          2. verdict-droid.md — a human-readable report, one section per judged process, naming the evidence you relied on.

          Rules:
          - Pass a process only when its card, handoff, status, diff, and check outputs line up.
          - Judge only from the evidence in this directory. Do not modify any evidence file.
          - Be efficient: at most 12 tool calls, then write the verdict files.
          """
          open("validator-prompt.txt", "w").write(prompt)
          PY
          timeout --signal=TERM --kill-after=30s 600s ~/.local/bin/droid exec --auto high -m "custom:DeepSeek-V4.1-Flash-Go" --output-format stream-json "$(cat validator-prompt.txt)" | tee validator-stream.jsonl

      - name: Merge verdict, enforce gates, verify evidence untouched
        id: verdict
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys
          manifest = json.load(open("work/manifest.json"))
          plan = json.load(open("work/plan.json"))
          judgeable = json.load(open("work/judgeable.json"))
          blocked = json.load(open("work/blocked.json"))

          for path, digest in manifest["sha256"].items():
              local = "work/" + path[len("evidence/"):] if path.startswith("evidence/") else path
              if not os.path.exists(local) or hashlib.sha256(open(local, "rb").read()).hexdigest() != digest:
                  print("validator modified evidence:", path)
                  sys.exit(1)

          verdicts = {}
          if judgeable:
              if not os.path.exists("work/verdict-droid.json"):
                  print("validator produced no verdict-droid.json")
                  sys.exit(1)
              droid = json.load(open("work/verdict-droid.json"))
              got = {p["id"]: p for p in droid.get("processes", [])}
              if set(got) != set(judgeable):
                  print(f"verdict coverage mismatch: judged {sorted(got)}, expected {sorted(judgeable)}")
                  sys.exit(1)
              for pid, entry in got.items():
                  if entry.get("verdict") not in ("pass", "fail"):
                      print("invalid verdict value:", entry)
                      sys.exit(1)
                  verdicts[pid] = {"id": pid, "verdict": entry["verdict"],
                                   "reason": entry.get("reason", "")}
          for pid, missing in blocked.items():
              verdicts[pid] = {"id": pid, "verdict": "blocked",
                               "reason": "料不齐（没料不验收）：缺 " + ", ".join(missing)}

          expected = {p["id"] for p in plan["processes"]}
          if set(verdicts) != expected:
              print(f"final coverage mismatch: {sorted(verdicts)} vs {sorted(expected)}")
              sys.exit(1)

          pytest_exit = manifest.get("pytest_exit", 1)
          overall = "pass" if all(v["verdict"] == "pass" for v in verdicts.values()) and pytest_exit == 0 else "fail"
          verdict = {"overall": overall, "pytest_exit": pytest_exit,
                     "iteration": manifest.get("iteration", 2),
                     "processes": [verdicts[p["id"]] for p in plan["processes"]]}
          json.dump(verdict, open("verdict.json", "w"), ensure_ascii=False, indent=2)

          lines = []
          if os.path.exists("work/verdict-droid.md"):
              lines.append(open("work/verdict-droid.md").read())
          lines += ["", "## 机器闸与缺料判定（脚本）", "",
                    f"全量 pytest 退出码：{pytest_exit}（非 0 时 overall 强制 fail）"]
          for pid, missing in blocked.items():
              lines.append(f"- `{pid}`：blocked — 料不齐，缺 {', '.join(missing)}")
          lines += ["", f"总判定：**{overall}**"]
          open("verdict.md", "w").write("\n".join(lines))

          failed = [pid for pid, v in verdicts.items() if v["verdict"] != "pass"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"overall={overall}\n")
              out.write("failed_processes=" + json.dumps(failed) + "\n")
          print("overall:", overall, "| failed:", failed)
          PY

      - name: Upload verdict round 2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-verdict2-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: |
            verdict.json
            verdict.md
            work/validator-stream.jsonl

  assemble:
    name: assemble (final status card, close-out, PR)
    needs: [lead, prep, validate, replan, prep2, validate2]
    if: >-
      ${{ !cancelled() && needs.lead.result == 'success' &&
      needs.validate.result == 'success' &&
      (needs.validate2.result == 'success' || needs.validate2.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: team-*-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: dl

      - name: Pick final verdict and candidate
        id: pick
        run: |
          python3 - <<'PY'
          import json, os
          def find(dirname_prefix, filename):
              for d in sorted(os.listdir("dl")):
                  if d.startswith(dirname_prefix):
                      p = os.path.join("dl", d, filename)
                      if os.path.exists(p):
                          return p
              return None
          verdict_path = find("team-verdict2-", "verdict.json") or find("team-verdict-", "verdict.json")
          verdict = json.load(open(verdict_path))
          json.dump(verdict, open("final-verdict.json", "w"), ensure_ascii=False, indent=2)
          manifest_path = None
          for prefix in ("team-evidence2-", "team-evidence-"):
              for d in sorted(os.listdir("dl")):
                  if d.startswith(prefix) and os.path.exists(os.path.join("dl", d, "evidence.tar.gz")):
                      manifest_path = os.path.join("dl", d, "evidence.tar.gz")
          candidate = ""
          if manifest_path:
              import tarfile, io
              with tarfile.open(manifest_path) as tf:
                  member = tf.extractfile("./manifest.json") or tf.extractfile("manifest.json")
                  manifest = json.load(io.TextIOWrapper(member, encoding="utf-8"))
                  candidate = manifest.get("candidate_branch", "")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"overall={verdict.get('overall')}\n")
              out.write(f"candidate={candidate}\n")
          print("final overall:", verdict.get("overall"), "| candidate:", candidate)
          PY

      - name: Post final status card, close out, attempt PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PLAN_ISSUE_NUMBER: ${{ needs.lead.outputs.plan_issue_number }}
          CANDIDATE_BRANCH: ${{ steps.pick.outputs.candidate }}
          OVERALL: ${{ steps.pick.outputs.overall }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          def gh(*args, check=False):
              r = subprocess.run(["gh", *args], capture_output=True, text=True)
              if check and r.returncode != 0:
                  print("gh failed:", " ".join(args), r.stdout, r.stderr)
              return r

          issue_number = os.environ["ISSUE_NUMBER"]
          plan_number = os.environ["PLAN_ISSUE_NUMBER"]
          candidate = os.environ["CANDIDATE_BRANCH"]
          overall = os.environ["OVERALL"]
          verdict = json.load(open("final-verdict.json"))

          def find_file(prefix, filename):
              for d in sorted(os.listdir("dl")):
                  if d.startswith(prefix):
                      p = os.path.join("dl", d, filename)
                      if os.path.exists(p):
                          return p
              return None

          plan = json.load(open(find_file("team-plan-", "team-plan.json")))
          subs = {p["id"]: p.get("sub_issue_number") for p in plan["processes"]}
          v2_path = find_file("team-plan-v2-", "team-plan-v2.json")
          if v2_path:
              v2 = json.load(open(v2_path))
              for p in v2.get("processes", []):
                  if p.get("sub_issue_number"):
                      subs[p["id"]] = p["sub_issue_number"]

          pr_text = "（未尝试：无候选分支）"
          if overall == "pass" and candidate:
              for pid, sub in subs.items():
                  if sub:
                      gh("issue", "close", str(sub), "--reason", "completed")
              gh("issue", "comment", plan_number, "--body",
                 "## 收口\n\n全部工序验收过关，子单已关闭（Sub-issues progress 应为 3/3）。\n\n状态代偿记录：已验收。")
              r = gh("pr", "create", "--repo", os.environ["GITHUB_REPOSITORY"],
                     "--base", "main", "--head", candidate,
                     "--title", f"team: issue #{issue_number}",
                     "--body", f"Foreman-pattern result for issue #{issue_number}. Candidate branch: {candidate}")
              pr_text = (r.stdout or r.stderr).strip() or "(gh pr create 无输出)"
              print("gh pr create rc:", r.returncode, pr_text)
          elif overall != "pass":
              failed = [p["id"] for p in verdict.get("processes", []) if p.get("verdict") != "pass"]
              gh("issue", "comment", plan_number, "--body",
                 f"## 阻塞\n\n验收未过：{', '.join(failed)}。迭代已用满（上限 2 轮）或无可重派，整单停下报人裁。子单保持打开。\n\n状态代偿记录：阻塞。")
              pr_text = "（未尝试：验收未过）"

          lines = ["## 团队状态卡（收口）", "",
                   f"计划：#{plan_number}（计划版本 v{verdict.get('iteration', 1)} 轮验收）",
                   f"候选分支：`{candidate or '无'}`", "",
                   "### 验收结果"]
          for proc in verdict.get("processes", []):
              lines.append(f"- `{proc.get('id')}`（子单 #{subs.get(proc.get('id'))}）：{proc.get('verdict')} — {proc.get('reason')}")
          lines += ["", f"总判定：**{overall}**", "", "### PR", "", pr_text, "",
                    "状态代偿说明：Projects 板面字段由 workflow 以评论代偿记录（已派单/施工中/待验收/已验收/阻塞），字段直写待令牌方案。"]
          open("final-comment.md", "w").write("\n".join(lines))
          print("\n".join(lines))
          PY
          gh issue comment "$ISSUE_NUMBER" --body-file final-comment.md

      - name: Fail the run when validation did not pass
        if: steps.pick.outputs.overall != 'pass'
        run: |
          echo "validation overall != pass; run marked failed after posting the status card"
          exit 1
