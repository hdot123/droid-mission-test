name: Droid

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  droid:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: Factory-AI/droid-action@v1
        with:
          factory-api-key: ${{ secrets.FACTORY_API_KEY }}
