name: Droid (CF BYOM naming test)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  droid:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@droid')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install droid CLI
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Write BYOM settings (replica pattern, caller-side gateway auth)
        env:
          WORKER_CI_KEY: ${{ secrets.WORKER_CI_KEY }}
          GO_GITHUB_RUN_TOKEN: ${{ secrets.GO_GITHUB_RUN_TOKEN }}
          GW_TOKEN_KNOWN: ${{ secrets.GW_TOKEN_KNOWN }}
        run: |
          mkdir -p ~/.factory
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.factory/settings.json")
          s = {}
          if os.path.exists(p):
              s = json.load(open(p))
          headers = {}
          if os.environ.get("WORKER_CI_KEY"):
              headers["x-ci-key"] = os.environ["WORKER_CI_KEY"]
          headers["x-opencode-session"] = "droid-test"
          if os.environ.get("GW_TOKEN_KNOWN"):
              headers["cf-aig-authorization"] = "Bearer " + os.environ["GW_TOKEN_KNOWN"]
          s["customModels"] = [{
              "model": "dynamic/droid-review",
              "id": "custom:DeepSeek-V4.1-Flash-Go",
              "baseUrl": "https://droid-test.lumivane.dpdns.org",
              "apiKey": os.environ.get("GO_GITHUB_RUN_TOKEN", ""),
              "provider": "generic-chat-completion-api",
              "extraHeaders": headers,
          }]
          json.dump(s, open(p, "w"), indent=2)
          m = s["customModels"][0]
          print("customModels written:", m["id"], "| model:", m["model"], "| baseUrl:", m["baseUrl"],
                "| apiKey present:", bool(m["apiKey"]), "| x-ci-key present:", "x-ci-key" in headers,
                "| x-opencode-session present:", "x-opencode-session" in headers,
                "| cf-aig-authorization present:", "cf-aig-authorization" in headers)
          PY

      - name: Run droid (named by comment)
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          PROMPT=$(python3 - <<'PY'
          import json, os
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          body = (ev.get("comment") or {}).get("body", "").replace("@droid", "", 1).strip()
          issue = (ev.get("issue") or {}).get("body") or ""
          print(body + "\n\n--- Issue context ---\n" + issue)
          PY
          )
          echo "$PROMPT" | head -c 500
          ~/.local/bin/droid exec --auto high -m "custom:DeepSeek-V4.1-Flash-Go" --output-format stream-json "$PROMPT"

      - name: Commit and open PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            BR="droid/issue-${{ github.event.issue.number }}-replica"
            git config user.name "droid-test"
            git config user.email "droid-test@localhost"
            git checkout -b "$BR"
            git add -A
            git commit -m "droid: work on issue #${{ github.event.issue.number }}"
            git push -u origin "$BR"
            gh pr create --title "droid: issue #${{ github.event.issue.number }}" --body "Automated work from @droid naming on issue #${{ github.event.issue.number }}." --head "$BR" || true
          else
            echo "no changes"
          fi
